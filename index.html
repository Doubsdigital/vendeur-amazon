<style>
/* Layout : sommaire latéral (carton d'expédition) + leçon au centre ; empilé sur mobile */
:root{
  --bg:#f3f4f6; --paper:#ffffff; --ink:#14213a; --muted:#5b6475; --line:#d9dde4;
  --kraft:#b7792b; --kraft-soft:#f3e6d2; --navy:#1d3a6b;

  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --kraft:#d9a05a; --kraft-soft:#3a2d1c; --navy:#8fb0ea;
  --ok:#5cc58c; --ok-soft:#173326; --warn:#e3a54a; --warn-soft:#3a2c14; --bad:#ef7b72; --bad-soft:#3d1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1420; --paper:#171e2d; --ink:#e7ebf3; --muted:#9aa3b5; --line:#2a3346;
  --kraft:#d9a05a; --kraft-soft:#3a2d1c; --navy:#8fb0ea;
  --ok:#5cc58c; --ok-soft:#173326; --warn:#e3a54a; --warn-soft:#3a2c14; --bad:#ef7b72; --bad-soft:#3d1c1a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--f-body)}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between;padding-bottom:18px;border-bottom:2px solid var(--ink);margin-bottom:24px}
.brand{font:800 clamp(1.5rem,4vw,2.1rem)/1.05 var(--f-display);letter-spacing:-.01em;text-wrap:balance;margin:0}

.bar{height:10px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;width:0;background:var(--kraft);transition:width .4s}
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:28px;align-items:start}
nav.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
nav.toc details{background:var(--paper);border:1px solid var(--line);border-radius:4px}
nav.toc summary{display:none}
.lvl{font:500 .72rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:14px 16px 4px}
.toc ul{list-style:none;margin:0;padding:0 8px 8px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:3px;color:var(--ink);text-decoration:none;font-size:.92rem;line-height:1.3}
.toc a:hover{background:var(--bg)}
.toc a[aria-current="page"]{background:var(--kraft-soft);font-weight:600}
.tick{flex:none;width:18px;height:18px;border:1.5px solid var(--line);border-radius:2px;display:grid;place-items:center;font-size:.7rem;color:transparent}

.tool-link .tick{border-style:dashed}
main{min-width:0}

.lesson p,.lesson li{max-width:68ch}

th{font:600 .78rem var(--f-mono);text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.formula{font:500 .92rem var(--f-mono);background:var(--bg);border:1px dashed var(--line);padding:12px 14px;border-radius:3px;overflow-x:auto}

.lesson h3{font:700 1.02rem/1.3 var(--f-display);margin:20px 0 6px}
.lesson blockquote{margin:10px 0 18px;padding:12px 16px;border-left:3px solid var(--kraft);background:var(--bg);border-radius:0 3px 3px 0;max-width:68ch}
.lesson blockquote p{margin:4px 0}
.lesson ul.task-list,.lesson ul:has(> li > input){list-style:none;padding-left:.2em}
.lesson li input[type=checkbox]{margin-right:8px;accent-color:var(--ok)}
.lesson code{font-family:var(--f-mono);font-size:.88em;background:var(--bg);padding:1px 4px;border-radius:2px}
.lesson a{color:var(--navy)}
.ck-tip{font-size:.85rem;color:var(--muted);margin:0 0 8px}
.lesson li.ck-item{position:relative;padding-right:40px;margin:8px 0}
.lesson li input[type=checkbox]{cursor:pointer;width:17px;height:17px;vertical-align:-3px}
.info{position:absolute;right:0;top:0;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--navy);background:transparent;color:var(--navy);font:700 .85rem/1 Georgia,"Times New Roman",serif;font-style:italic;cursor:pointer;display:grid;place-items:center;padding:0}
.info.on,.info:hover{background:var(--navy);color:var(--paper)}
.ans{margin:8px 0 4px;padding:10px 12px;background:var(--kraft-soft);border-radius:3px;font-size:.92rem;line-height:1.5}
.lesson h3{font:700 1.02rem/1.3 var(--f-display);margin:20px 0 6px}
.lesson blockquote{margin:10px 0 18px;padding:12px 16px;border-left:3px solid var(--kraft);background:var(--bg);border-radius:0 3px 3px 0;max-width:68ch}
.lesson blockquote p{margin:4px 0}
.lesson ul.task-list,.lesson ul:has(> li > input){list-style:none;padding-left:.2em}

.lesson code{font-family:var(--f-mono);font-size:.88em;background:var(--bg);padding:1px 4px;border-radius:2px}
.lesson a{color:var(--navy)}
.calcpage fieldset{border:1px solid var(--line);border-radius:4px;padding:12px 14px 14px;margin:0;display:grid;gap:12px;min-width:0}
.calcpage legend{font:600 .74rem var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--kraft);padding:0 6px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.chk label{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;cursor:pointer}
.chk input{width:17px;height:17px;margin-top:2px;accent-color:var(--navy)}
.tierbox{font-size:.88rem;background:var(--bg);border:1px dashed var(--line);border-radius:3px;padding:10px 12px;line-height:1.55}
.pill{display:inline-block;font:600 .7rem var(--f-mono);background:var(--ok-soft);color:var(--ok);padding:1px 6px;border-radius:10px;text-transform:uppercase}
.warn{color:var(--warn);font-size:.82rem}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{flex:1;font:600 .85rem var(--f-body);padding:9px 6px;border:0;background:var(--paper);color:var(--ink);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.results{display:grid;gap:14px;align-content:start;min-width:0}
.adv{border:1px solid var(--line);border-radius:4px;padding:10px 14px}
.adv summary{cursor:pointer;font-weight:600}
.adv[open]>*:not(summary){margin-top:12px}
.hint2{font-size:.82rem;color:var(--muted);font-family:var(--f-body);margin:8px 0 0}
.cmpwrap{overflow-x:auto;margin:10px 0}
.cmp{min-width:520px;font-size:.88rem}
.cmp td{font-variant-numeric:tabular-nums;white-space:nowrap}
.cmp tr.cur td{background:var(--kraft-soft)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%}
.dot.v{background:var(--ok)}.dot.o{background:var(--warn)}.dot.r{background:var(--bad)}
@media (max-width:420px){.row3{grid-template-columns:1fr 1fr 1fr;gap:6px}.row3 .field label{font-size:.75rem}}
.lesson h3{font:700 1.02rem/1.3 var(--f-display);margin:20px 0 6px}

/* Quiz */
.quiz{margin-top:32px;border:2px solid var(--ink);border-radius:4px;padding:20px}
.quiz h2{margin-top:0}
.q{margin:18px 0}
.q p{font-weight:600;margin:0 0 8px}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:9px 12px;cursor:pointer}
.opt:hover{border-color:var(--navy)}
.opt:focus-visible,.btn:focus-visible,.toc a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.opt .k{font:500 .8rem var(--f-mono);color:var(--muted);flex:none;width:1.2em}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.fb{font-size:.9rem;margin-top:6px;color:var(--muted)}
.score{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:16px;font-weight:600}
.btn{font:600 .92rem var(--f-body);border-radius:3px;padding:9px 16px;cursor:pointer;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--ink)}

.pager a{color:var(--navy);font-weight:600;text-decoration:none}
/* Calculator */
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.fields{display:grid;gap:12px}
.field label{display:block;font:600 .82rem var(--f-body);margin-bottom:4px}
.field input,.field select{width:100%;font:500 1rem var(--f-mono);padding:8px 10px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--ink)}
.field .hint{font-size:.78rem;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ticket{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:18px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ticket h3{font:700 1rem var(--f-display);margin:0 0 10px}
.line{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dotted var(--line);font-size:.9rem}
.line.total{border-bottom:none;border-top:2px solid var(--ink);margin-top:6px;padding-top:10px;font-weight:600;font-size:1.05rem}
.verdict{margin-top:14px;padding:12px 14px;border-radius:3px;font-family:var(--f-body);font-weight:600}
.verdict.v{background:var(--ok-soft);color:var(--ok)}
.verdict.o{background:var(--warn-soft);color:var(--warn)}
.verdict.r{background:var(--bad-soft);color:var(--bad)}
.verdict span{display:block;font-weight:400;font-size:.88rem;color:var(--ink);margin-top:4px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:10px}
.kpi b{display:block;font-size:1.25rem}
.kpi small{color:var(--muted);font-family:var(--f-body)}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}

}

<body lang="fr">
<div class="wrap">
  <header class="top">
    <h1 class="brand"><small>Cours complet et e-learning · 15 modules · Débutant → Expert</small>Programme Expert Vendeur Amazon</h1>
    <div class="prog" aria-live="polite">
      <div class="prog-label"><span>Progression</span><span id="progTxt">0 / 15 modules</span></div>
      <div class="bar"><i id="progBar"></i></div>
    </div>
  </header>
  <div class="layout">
    <nav class="toc" aria-label="Sommaire">
      <details id="tocDetails" open>
        <summary><span>Sommaire</span><span id="tocCur"></span></summary>

      </details>

  </div>
</div>

<script>
const TVA = {FR:["France",.20],DE:["Allemagne",.19],ES:["Espagne",.21],IT:["Italie",.22],NL:["Pays-Bas",.21],BE:["Belgique",.21],IE:["Irlande",.23],PL:["Pologne",.23],SE:["Suède",.25]};

const M = [{"id": "intro", "lvl": "Démarrer", "t": "Présentation du programme", "tag": "Introduction", "min": 10, "lead": "Ce programme forme un vendeur Amazon capable de trouver, financer, expédier et vendre des produits rentables dans toute l&#x27;Europe, puis de piloter l&#x27;activité comme une entreprise. Il est calibré pour une SAS française qui démarre avec 1 000 € de stock test, dispose de trésorerie pour accélérer, et vise un complément de revenu conséquent.", "html": "<h2 id=\"le-parcours\">Le parcours<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Niveau<\/th>\n<th>Modules<\/th>\n<th>Compétences à la sortie<\/th>\n<th>Durée de travail<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Fondations<\/td>\n<td>1 à 3<\/td>\n<td>Comprendre la mécanique d'Amazon, être en règle, ouvrir et paramétrer un compte sain<\/td>\n<td>8 à 10 h<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Opérationnel<\/td>\n<td>4 à 8<\/td>\n<td>Analyser un produit en 30 secondes, sourcer, calculer, mettre en ligne, expédier<\/td>\n<td>20 à 25 h<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Croissance<\/td>\n<td>9 à 12<\/td>\n<td>Gagner la Buy Box, faire de la publicité rentable, vendre dans 9 pays, lancer une marque<\/td>\n<td>20 à 25 h<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Expert<\/td>\n<td>13 à 15<\/td>\n<td>Piloter par les chiffres, protéger le compte, déléguer, passer à l'échelle<\/td>\n<td>10 à 12 h<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Comptez 60 à 70 heures de travail réel, exercices compris, étalées sur les 90 jours du plan d'action.<\/p>\n<h2 id=\"les-règles-du-programme\">Les règles du programme<\/h2>\n<ul>\n<li><strong>Calculs en régime réel de TVA<\/strong> : prix affichés TTC, marges hors taxes, TVA d'achat récupérée.<\/li>\n<li><strong>Catégories exclues<\/strong> : produits à risque sanitaire (alimentaire, compléments, cosmétiques, hygiène, puériculture, contact alimentaire) et jouets ou articles enfants à risque d'accident.<\/li>\n<li><strong>Produits pouvant tomber en panne<\/strong> : autorisés uniquement avec au moins 50 % de retour sur l'achat et 5 € de marge, après 8 % de provision pour retours.<\/li>\n<li><strong>Produits simples et robustes<\/strong> : seuils de 30 % de retour sur l'achat et 3 € de marge.<\/li>\n<li><strong>Marché cible<\/strong> : la France d'abord, puis le plus grand nombre de pays européens.<\/li>\n<\/ul>\n<h2 id=\"comment-travailler-ce-programme\">Comment travailler ce programme<\/h2>\n<ol type=\"1\">\n<li>Lisez un module en entier avant d'agir.<\/li>\n<li>Faites les exercices de fin de module avec de vrais produits.<\/li>\n<li>Cochez la checklist de validation : un module n'est maîtrisé que si vous savez faire chaque point sans relire.<\/li>\n<li>Revenez aux modules 6 et 14 chaque mois : ce sont ceux qui protègent votre marge et votre compte.<\/li>\n<\/ol>\n<p>Les frais Amazon cités sont des ordres de grandeur repérés en novembre 2026. Amazon les révise plusieurs fois par an : vérifiez toujours dans Seller Central avant une décision. Ce document n'est pas un conseil juridique, fiscal ou comptable.<\/p>\n", "todo": [], "quiz": null}, {"id": "m1", "lvl": "Fondations", "t": "Comprendre Amazon en profondeur", "tag": "Module 1", "min": 35, "lead": "Amazon n&#x27;est pas une boutique où vous ouvrez votre vitrine : c&#x27;est un catalogue unique où tous les vendeurs d&#x27;un même produit se partagent une seule fiche, et où un algorithme décide qui vend. Comprendre ces deux mécanismes, la recherche et la Buy Box, explique 90 % des réussites et des échecs.", "html": "<h2 id=\"11-le-marché-européen-damazon\">1.1 Le marché européen d'Amazon<\/h2>\n<ul>\n<li><strong>Plus de la moitié des ventes sur Amazon sont réalisées par des vendeurs tiers<\/strong>, pas par Amazon lui-même. Vous êtes dans ce camp.<\/li>\n<li><strong>L'Allemagne est le premier marché européen<\/strong>, devant le Royaume-Uni et la France. Viennent ensuite l'Italie et l'Espagne, puis les Pays-Bas, la Belgique, la Pologne, la Suède et l'Irlande.<\/li>\n<li><strong>Un seul compte vendeur européen<\/strong> donne accès à tous les sites de l'UE, plus le Royaume-Uni en option.<\/li>\n<li><strong>Les clients Prime<\/strong> commandent beaucoup plus que les autres et filtrent souvent les résultats sur la livraison Prime. Sans FBA, vous leur êtes largement invisible.<\/li>\n<li><strong>Les pics de l'année<\/strong> : Prime Day (juillet), French Days (printemps et automne en France), Black Friday et Noël (novembre et décembre, souvent 25 à 35 % du chiffre d'affaires annuel d'un vendeur), soldes de janvier.<\/li>\n<\/ul>\n<h2 id=\"12-seller-ou-vendor\">1.2 Seller ou Vendor<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th><\/th>\n<th>Seller Central (vendeur tiers)<\/th>\n<th>Vendor Central (fournisseur)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Qui vend au client<\/td>\n<td>Vous<\/td>\n<td>Amazon<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Qui fixe le prix<\/td>\n<td>Vous<\/td>\n<td>Amazon<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Accès<\/td>\n<td>Libre, sur inscription<\/td>\n<td>Sur invitation d'Amazon<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Paiement<\/td>\n<td>Tous les 14 jours environ<\/td>\n<td>60 à 90 jours après facture<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Pour qui<\/td>\n<td>Revendeurs et marques<\/td>\n<td>Grandes marques établies<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Tout ce programme concerne Seller Central.<\/p>\n<h2 id=\"13-le-catalogue--une-fiche-plusieurs-vendeurs\">1.3 Le catalogue : une fiche, plusieurs vendeurs<\/h2>\n<p>Chaque produit a un identifiant unique, l'<strong>ASIN<\/strong> (10 caractères commençant généralement par B0). Quand vous vendez un produit qui existe déjà, vous ne créez pas d'annonce : vous ajoutez une <strong>offre<\/strong> sur la fiche existante. Tous les vendeurs partagent le même titre, les mêmes photos, les mêmes avis.<\/p>\n<p>Conséquences pratiques :<\/p>\n<ul>\n<li>Vous ne pouvez pas vous différencier par la fiche. Vous vous différenciez par le <strong>prix<\/strong>, la <strong>livraison<\/strong> et la <strong>qualité de votre compte<\/strong>.<\/li>\n<li>Les avis sont ceux du produit, pas les vôtres. Un produit très bien noté se vend tout seul ; un produit mal noté se vend mal quel que soit votre prix.<\/li>\n<li>Vos propres évaluations de vendeur existent à part (« feedback ») et pèsent dans la Buy Box.<\/li>\n<\/ul>\n<h2 id=\"14-lalgorithme-de-recherche\">1.4 L'algorithme de recherche<\/h2>\n<p>Amazon ne publie pas sa formule, mais ses principes sont connus et constants :<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Facteur<\/th>\n<th>Ce qu'il mesure<\/th>\n<th>Ce que vous contrôlez<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Pertinence<\/td>\n<td>Correspondance entre la recherche et le titre, les points clés, les mots-clés cachés<\/td>\n<td>Uniquement sur vos propres fiches<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Conversion<\/td>\n<td>Part des visiteurs qui achètent<\/td>\n<td>Prix, images, avis, Prime<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Vélocité des ventes<\/td>\n<td>Nombre de ventes récentes<\/td>\n<td>Stock disponible, publicité<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Disponibilité<\/td>\n<td>Produit en stock, livré vite<\/td>\n<td>Gestion du stock, FBA<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Satisfaction<\/td>\n<td>Retours, réclamations, notes<\/td>\n<td>Qualité produit et emballage<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Retenez le cercle vertueux : <strong>plus un produit vend, mieux il est classé, plus il vend<\/strong>. C'est pourquoi une rupture de stock coûte bien plus que les ventes perdues pendant la rupture : le classement chute et met des semaines à remonter.<\/p>\n<h2 id=\"15-la-mécanique-de-la-buy-box\">1.5 La mécanique de la Buy Box<\/h2>\n<p>La Buy Box (officiellement « offre en vedette ») est le bloc « Ajouter au panier ». Environ 80 % des ventes passent par elle ; les autres offres sont cachées derrière un lien « Autres vendeurs ».<\/p>\n<p><strong>Pour être éligible<\/strong>, il faut un compte Professionnel, des indicateurs de performance corrects, du stock et un produit en état Neuf.<\/p>\n<p><strong>Parmi les vendeurs éligibles<\/strong>, Amazon pondère :<\/p>\n<ol type=\"1\">\n<li>Le prix total (prix + frais de port).<\/li>\n<li>Le mode et la vitesse de livraison : FBA est considéré comme la meilleure expédition possible.<\/li>\n<li>Les indicateurs du compte : défauts de commande, retards, annulations.<\/li>\n<li>Les évaluations de vendeur et l'ancienneté.<\/li>\n<li>La profondeur du stock.<\/li>\n<\/ol>\n<p><strong>La rotation<\/strong> : quand plusieurs vendeurs FBA sont à prix égal ou très proche, la Buy Box tourne entre eux, à peu près au prorata de leur poids. Trois vendeurs FBA au même prix se partagent donc les ventes. C'est le calcul clé de l'estimation des ventes (module 4).<\/p>\n<p><strong>Amazon vendeur<\/strong> : quand Amazon vend lui-même le produit, il remporte la Buy Box la grande majorité du temps. Règle : évitez les produits où Amazon est en stock de façon régulière.<\/p>\n<p><strong>Pas de Buy Box du tout<\/strong> : quand le prix de toutes les offres est jugé trop élevé par rapport au marché (y compris hors d'Amazon), Amazon peut retirer la Buy Box de la fiche. Les ventes s'effondrent.<\/p>\n<h2 id=\"16-le-cycle-de-vie-dune-fiche-partagée\">1.6 Le cycle de vie d'une fiche partagée<\/h2>\n<ol type=\"1\">\n<li><strong>Peu de vendeurs<\/strong> : prix haut, marges confortables. C'est là que vous voulez entrer.<\/li>\n<li><strong>Arrivée de nouveaux vendeurs<\/strong> attirés par la marge : le prix commence à baisser.<\/li>\n<li><strong>Guerre des prix<\/strong> : les vendeurs s'alignent à la baisse, la marge disparaît.<\/li>\n<li><strong>Assainissement<\/strong> : les vendeurs non rentables vident leur stock et partent, le prix remonte.<\/li>\n<\/ol>\n<p>Un expert entre en phase 1, sort ou ne réapprovisionne pas en phase 3, et revient en phase 4. Keepa permet de voir dans quelle phase est une fiche (module 4).<\/p>\n<h2 id=\"17-les-modèles-économiques-comparés\">1.7 Les modèles économiques comparés<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Modèle<\/th>\n<th>Capital de départ<\/th>\n<th>Marge nette typique<\/th>\n<th>Temps par semaine<\/th>\n<th>Scalabilité<\/th>\n<th>Valeur de revente de l'activité<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Arbitrage en magasin<\/td>\n<td>500 à 2 000 €<\/td>\n<td>20 à 40 %<\/td>\n<td>Élevé (déplacements)<\/td>\n<td>Faible<\/td>\n<td>Quasi nulle<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Arbitrage en ligne<\/td>\n<td>1 000 à 5 000 €<\/td>\n<td>15 à 30 %<\/td>\n<td>Moyen<\/td>\n<td>Moyenne<\/td>\n<td>Faible<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Grossiste (wholesale)<\/td>\n<td>3 000 à 15 000 €<\/td>\n<td>10 à 25 %<\/td>\n<td>Faible une fois en place<\/td>\n<td>Élevée<\/td>\n<td>Moyenne<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Marque propre<\/td>\n<td>5 000 à 30 000 €<\/td>\n<td>20 à 35 %<\/td>\n<td>Élevé au lancement<\/td>\n<td>Très élevée<\/td>\n<td>Élevée (2 à 4 ans de bénéfice)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Dropshipping<\/td>\n<td>Très faible<\/td>\n<td>Variable<\/td>\n<td>Moyen<\/td>\n<td>Faible<\/td>\n<td>Nulle<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Le dropshipping est autorisé sur Amazon uniquement si vous êtes le vendeur officiel sur tous les documents ; acheter chez un autre détaillant qui livre directement votre client est interdit.<\/p>\n<p><strong>Votre trajectoire recommandée<\/strong> : arbitrage pour apprendre (mois 1 à 3), grossistes pour stabiliser le volume (mois 3 à 12), marque propre pour construire un actif (à partir du mois 9 à 12).<\/p>\n<h2 id=\"exercices\">Exercices<\/h2>\n<ol type=\"1\">\n<li>Choisissez 10 produits de la vie courante. Pour chacun, notez l'ASIN, le nombre de vendeurs, qui détient la Buy Box, et si Amazon vend.<\/li>\n<li>Sur 3 de ces fiches, cliquez sur « Autres vendeurs » et comparez prix, mode de livraison et notes des vendeurs. Expliquez pourquoi le gagnant de la Buy Box gagne.<\/li>\n<\/ol>\n<h2 id=\"checklist-de-validation\">Checklist de validation<\/h2>\n<ul class=\"task-list\">\n<li><label><input type=\"checkbox\" />Je sais expliquer la différence entre une offre et une fiche.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Je connais les 5 facteurs de la Buy Box.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Je sais pourquoi il faut éviter les fiches où Amazon vend.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Je sais reconnaître les 4 phases du cycle de vie d'une fiche.<\/label><\/li>\n<\/ul>\n", "todo": [], "quiz": [["Que se passe-t-il quand dix vendeurs proposent le même produit ?", ["Chacun a sa propre fiche", "Ils partagent la même fiche (même ASIN)", "Amazon refuse les neuf derniers"], 1, "Une fiche = un ASIN, partagé par tous les vendeurs du produit."], ["Qu'est-ce que la Buy Box ?", ["Le carton envoyé à Amazon", "Le bloc « Ajouter au panier » attribué à un vendeur", "Un abonnement premium"], 1, "Environ 80 % des ventes passent par elle."], ["Amazon vend lui-même le produit la plupart du temps. Vous :", ["Évitez le produit", "Passez sous son prix", "Vendez en FBM"], 0, "Amazon remporte la Buy Box la grande majorité du temps."]], "ans": ["Une fiche, c'est la page produit unique (un ASIN), partagée par tous les vendeurs : même titre, mêmes photos, mêmes avis. Une offre, c'est votre proposition sur cette fiche : votre prix, votre stock, votre mode d'expédition. En revente, vous n'ajoutez qu'une offre. Voir 1.3.", "1. Le prix total (prix + port). 2. Le mode et la vitesse de livraison (FBA = le meilleur). 3. Les indicateurs du compte (défauts, retards, annulations). 4. Les évaluations et l'ancienneté du vendeur. 5. La profondeur du stock. Voir 1.5.", "Quand Amazon vend lui-même un produit, il remporte la Buy Box la grande majorité du temps : il ne vous reste presque aucune vente. Évitez les produits où Amazon est en stock de façon régulière. Voir 1.5.", "1. Peu de vendeurs : prix haut, on achète. 2. Arrivée de vendeurs : le prix commence à baisser, petit lot seulement. 3. Guerre des prix : la marge disparaît, on n'achète pas. 4. Assainissement : les vendeurs partent, le prix remonte, on revient. Voir 1.6 et 4.4."]}, {"id": "m2", "lvl": "Fondations", "t": "Société, TVA et conformité", "tag": "Module 2", "min": 50, "lead": "Une activité Amazon rentable peut être fermée du jour au lendemain par une non-conformité, et une marge calculée sans TVA est une marge fausse. Ce module pose les bases qui évitent les deux.", "html": "<h2 id=\"21-la-société\">2.1 La société<\/h2>\n<ul>\n<li><strong>Objet social<\/strong> : « achat, vente et revente de marchandises, notamment par vente à distance et sur places de marché en ligne ; import, export ». Assez large pour la marque propre plus tard.<\/li>\n<li><strong>Compte bancaire professionnel<\/strong> au nom de la SAS. Le RIB servira à recevoir les virements Amazon ; prévoyez une carte bancaire au nom de la société ou du dirigeant pour les frais Amazon.<\/li>\n<li><strong>Code APE<\/strong> : généralement 47.91B (vente à distance sur catalogue spécialisé) ou 47.91A. Il n'a pas d'effet juridique, mais facilite les échanges avec les grossistes qui exigent un statut de revendeur.<\/li>\n<li><strong>Pacte d'associés<\/strong> entre frères : répartition des rôles, apports, décision d'achat au-delà d'un montant, sortie d'un associé. À écrire tant que tout va bien.<\/li>\n<\/ul>\n<h2 id=\"22-comptabilité-et-pièces-justificatives\">2.2 Comptabilité et pièces justificatives<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Pièce<\/th>\n<th>Règle<\/th>\n<th>Pourquoi<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Facture d'achat<\/td>\n<td>Au nom et à l'adresse de la SAS, avec son numéro de TVA<\/td>\n<td>Déduction de la TVA, preuve d'authenticité pour Amazon<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Ticket de caisse<\/td>\n<td>Insuffisant seul : demander une facture en caisse ou en ligne<\/td>\n<td>Amazon et l'administration le refusent comme preuve<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Facture de vente<\/td>\n<td>Émise automatiquement par le service de calcul de TVA d'Amazon<\/td>\n<td>Obligatoire pour chaque vente, demandée par les clients professionnels<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Relevés de paiement Amazon<\/td>\n<td>Export tous les 14 jours<\/td>\n<td>Rapprochement bancaire, détail des frais<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Inventaire<\/td>\n<td>Au 31 décembre, valorisé au coût d'achat HT<\/td>\n<td>Calcul du résultat, stock FBA inclus<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Conservez toutes les factures d'achat au moins 10 ans (obligation comptable) et en version numérique classée par fournisseur et par mois (demande Amazon possible à tout moment).<\/p>\n<p><strong>DAC7<\/strong> : Amazon déclare chaque année à l'administration fiscale le chiffre d'affaires de chaque vendeur. Toute vente non comptabilisée sera visible.<\/p>\n<p><strong>Logiciel<\/strong> : un outil qui importe automatiquement les paiements Amazon (connecteurs du type A2X ou Link My Books) vous évite des heures de saisie et sépare commissions, frais FBA, remboursements et publicité.<\/p>\n<h2 id=\"23-le-régime-de-tva-de-la-sas\">2.3 Le régime de TVA de la SAS<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Régime<\/th>\n<th>Vous facturez la TVA<\/th>\n<th>Vous récupérez la TVA d'achat<\/th>\n<th>Intéressant quand<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Franchise en base<\/td>\n<td>Non<\/td>\n<td>Non<\/td>\n<td>Achats TTC en magasin, France seule, petit chiffre d'affaires<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Régime réel<\/td>\n<td>Oui<\/td>\n<td>Oui<\/td>\n<td>Grossistes HT, volumes, vente en Europe<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Exemple : achat 4 € TTC, vente 15 €. En franchise, vous gardez 15 € et payez 4 €. Au réel, vous gardez 12,50 € HT et payez 3,33 € HT. La franchise rapporte environ 1,80 € de plus par unité, mais se perd au-delà d'un seuil de chiffre d'affaires et n'est pas compatible avec le stockage dans d'autres pays de l'UE. <strong>Votre objectif européen impose le régime réel<\/strong> : c'est l'hypothèse de tout le programme.<\/p>\n<h2 id=\"24-la-tva-dans-vos-calculs\">2.4 La TVA dans vos calculs<\/h2>\n<div class=\"formula\">Prix HT = (Prix TTC) ÷ (1 + taux de TVA)<\/div>\n<p>Erreur classique : retirer 20 % au lieu de diviser par 1,20. 24 € TTC donnent 20 € HT, pas 19,20 €.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Pays (site Amazon)<\/th>\n<th>Taux normal<\/th>\n<th>15 € TTC en HT<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>France (.fr)<\/td>\n<td>20 %<\/td>\n<td>12,50 €<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Allemagne (.de)<\/td>\n<td>19 %<\/td>\n<td>12,61 €<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Espagne (.es)<\/td>\n<td>21 %<\/td>\n<td>12,40 €<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Italie (.it)<\/td>\n<td>22 %<\/td>\n<td>12,30 €<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Pays-Bas (.nl)<\/td>\n<td>21 %<\/td>\n<td>12,40 €<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Belgique (.com.be)<\/td>\n<td>21 %<\/td>\n<td>12,40 €<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Irlande (.ie)<\/td>\n<td>23 %<\/td>\n<td>12,20 €<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Pologne (.pl)<\/td>\n<td>23 %<\/td>\n<td>12,20 €<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Suède (.se)<\/td>\n<td>25 %<\/td>\n<td>12,00 €<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Les frais Amazon sont facturés par une entité luxembourgeoise avec autoliquidation de la TVA : vous les comptabilisez HT, et votre comptable gère l'autoliquidation sur la déclaration.<\/p>\n<h2 id=\"25-vendre-à-létranger--oss-et-immatriculations\">2.5 Vendre à l'étranger : OSS et immatriculations<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Situation<\/th>\n<th>Règle de TVA<\/th>\n<th>Déclaration<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Stock en France, ventes UE à des particuliers sous 10 000 € par an (tous pays confondus)<\/td>\n<td>TVA française possible<\/td>\n<td>Déclaration française habituelle<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Mêmes ventes au-delà de 10 000 €<\/td>\n<td>TVA du pays du client<\/td>\n<td>Guichet unique OSS, déclaré depuis la France chaque trimestre<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Stock dans un autre pays (Pan-EU, multi-pays)<\/td>\n<td>TVA locale du pays de stockage pour les ventes locales<\/td>\n<td>Numéro de TVA et déclarations dans ce pays<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Transfert de votre stock de France vers un autre pays<\/td>\n<td>Opération assimilée à une livraison intracommunautaire<\/td>\n<td>Déclarations dans les deux pays<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Vente à une entreprise d'un autre pays avec numéro de TVA<\/td>\n<td>Exonération, autoliquidation par l'acheteur<\/td>\n<td>Mention sur la facture<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Budget d'un prestataire fiscal européen : environ 300 à 1 000 € par pays et par an.<\/p>\n<h2 id=\"26-rep--responsabilité-élargie-du-producteur\">2.6 REP : responsabilité élargie du producteur<\/h2>\n<p>Chaque pays oblige celui qui met un produit emballé sur son marché à financer son recyclage. Amazon vérifie et désactive les offres non conformes.<\/p>\n<ul>\n<li><strong>France<\/strong> : adhésion à un éco-organisme par filière (emballages, équipements électriques, textile, meubles, articles de sport, bricolage et jardin, jouets...), qui délivre un identifiant unique (IDU) à saisir dans Seller Central. Alternative : le programme d'Amazon qui paie les éco-contributions à votre place, chiffré par un prestataire spécialisé à environ 25 € par catégorie et par an, qui ne couvre que les ventes Amazon.fr.<\/li>\n<li><strong>Allemagne<\/strong> : enregistrement au registre LUCID et contrat avec un système dual pour les emballages, plus d'autres registres pour l'électrique (stiftung ear) et les piles.<\/li>\n<li><strong>Autres pays<\/strong> : obligations similaires pays par pays. Le programme d'Amazon en couvre une partie ; vérifiez dans Seller Central avant chaque ouverture.<\/li>\n<li><strong>Revente de marques<\/strong> : le fabricant couvre son produit ; vous devez surtout couvrir vos propres emballages d'expédition (FBM). En marque propre, vous êtes producteur pour tout.<\/li>\n<\/ul>\n<h2 id=\"27-gpsr--sécurité-générale-des-produits\">2.7 GPSR : sécurité générale des produits<\/h2>\n<p>Le règlement européen 2023/988 s'applique depuis le 13 décembre 2024 à presque tous les produits non alimentaires.<\/p>\n<ul>\n<li>Chaque fiche indique le fabricant, son adresse postale et électronique, et une personne responsable établie dans l'UE.<\/li>\n<li>Le produit ou son emballage porte un numéro de type, de lot ou de série.<\/li>\n<li>Avertissements et consignes de sécurité dans la langue du pays de vente.<\/li>\n<li>Vous devez pouvoir retracer à qui vous avez acheté et à qui vous avez vendu, pour un rappel éventuel.<\/li>\n<li>Ne jamais ajouter un logo CE « pour rassurer » : c'est sanctionnable.<\/li>\n<\/ul>\n<h2 id=\"28-catégories-et-documents-de-conformité\">2.8 Catégories et documents de conformité<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Type de produit<\/th>\n<th>Document exigé<\/th>\n<th>Votre règle<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Produits ménagers, piles, aérosols, produits chimiques<\/td>\n<td>Fiche de données de sécurité (FDS) et examen « matières dangereuses »<\/td>\n<td>Seulement avec la FDS du fabricant<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Électrique et électronique<\/td>\n<td>Déclaration UE de conformité, marquage CE, REP électrique<\/td>\n<td>Autorisé avec forte marge<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Alimentaire, compléments, cosmétiques, hygiène, puériculture<\/td>\n<td>Nombreux documents et responsabilité sanitaire<\/td>\n<td>Exclu<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Jouets<\/td>\n<td>Norme EN 71, marquage CE, avertissements d'âge<\/td>\n<td>Exclus s'il y a risque d'accident<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"29-assurance\">2.9 Assurance<\/h2>\n<p>Responsabilité civile professionnelle avec garantie « produits livrés ». Amazon l'exige au-delà d'un seuil de chiffre d'affaires mensuel (de l'ordre de 10 000 €), mais prenez-la dès le départ : un produit défectueux qui provoque un dommage engage votre responsabilité de vendeur. Budget indicatif : quelques centaines d'euros par an.<\/p>\n<h2 id=\"exercices\">Exercices<\/h2>\n<ol type=\"1\">\n<li>Calculez le prix HT d'un produit vendu 29,99 € TTC dans chacun des 9 pays.<\/li>\n<li>Listez les filières REP concernées par 5 produits que vous envisagez de vendre.<\/li>\n<\/ol>\n<h2 id=\"checklist-de-validation\">Checklist de validation<\/h2>\n<ul class=\"task-list\">\n<li><label><input type=\"checkbox\" />Le régime de TVA est validé avec le comptable.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Chaque achat donne lieu à une facture au nom de la SAS.<\/label><\/li>\n<li><label><input type=\"checkbox\" />La solution REP France est en place, l'IDU saisi dans Seller Central.<\/label><\/li>\n<li><label><input type=\"checkbox\" />L'assurance RC pro avec garantie produits est souscrite.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Je sais quand le guichet OSS devient obligatoire.<\/label><\/li>\n<\/ul>\n", "todo": [], "quiz": [["Un produit vendu 24 € TTC en France rapporte, hors taxes :", ["19,20 €", "20,00 €", "24,00 €"], 1, "24 ÷ 1,20 = 20 €. On divise, on ne retire pas 20 %."], ["Stock en France, 14 000 €/an de ventes à des particuliers en Allemagne et en Italie. Quelle TVA ?", ["TVA française partout", "TVA du pays du client, via OSS", "Aucune TVA hors de France"], 1, "Au-delà de 10 000 € de ventes UE hors France, TVA du pays du client, déclarée via le guichet OSS."], ["Pourquoi le régime réel de TVA pour votre SAS ?", ["Il est toujours moins cher", "Il est compatible avec la vente et le stockage dans toute l'Europe", "Amazon l'impose"], 1, "La franchise se perd au-delà d'un seuil et bloque le stockage dans d'autres pays."]], "ans": ["À faire avec votre comptable. Pour vendre dans toute l'Europe, c'est le régime réel : vous facturez la TVA et récupérez celle de vos achats. Voir 2.3.", "Demandez une facture en caisse ou commandez sur le site de l'enseigne : nom, adresse et numéro de TVA de la SAS. Un ticket seul ne suffit ni pour la TVA, ni pour Amazon. Voir 2.2.", "Adhérez à un éco-organisme (qui donne un identifiant unique, l'IDU) ou utilisez le programme d'Amazon qui paie à votre place. Saisissez l'identifiant dans Seller Central, rubrique conformité. Voir 2.6.", "Responsabilité civile professionnelle avec garantie « produits livrés », demandée à votre assureur. Quelques centaines d'euros par an. Voir 2.9.", "Dès que vos ventes à des particuliers dans les autres pays de l'UE dépassent 10 000 € par an, tous pays confondus. Vous appliquez alors la TVA du pays du client et la déclarez chaque trimestre depuis la France. Voir 2.5."]}, {"id": "m3", "lvl": "Fondations", "t": "Seller Central de A à Z", "tag": "Module 3", "min": 40, "lead": "Seller Central est votre poste de commande : catalogue, stock, commandes, prix, publicité, paiements et santé du compte. Un compte mal ouvert ou mal paramétré est la première cause d&#x27;échec au démarrage.", "html": "<h2 id=\"31-choisir-le-plan\">3.1 Choisir le plan<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th><\/th>\n<th>Individuel<\/th>\n<th>Professionnel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Coût<\/td>\n<td>0,99 € HT par article vendu<\/td>\n<td>39 € HT par mois<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Buy Box<\/td>\n<td>Non<\/td>\n<td>Oui<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Publicité, catégories restreintes, envois en masse<\/td>\n<td>Non<\/td>\n<td>Oui<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Rentable à partir de<\/td>\n<td>—<\/td>\n<td>40 ventes par mois<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Prenez le plan Professionnel dès le premier jour (<a target=\"_blank\" rel=\"noopener\" href=\"https://www.lafabriquedunet.fr/creation-site-ecommerce/articles/pourquoi-vendre-produits-marketplace-cdiscount/\">La Fabrique du Net<\/a>, tarifs relevés en octobre 2026).<\/p>\n<h2 id=\"32-louverture-étape-par-étape\">3.2 L'ouverture, étape par étape<\/h2>\n<ol type=\"1\">\n<li><strong>Préparer les documents<\/strong> : Kbis de moins de 3 mois, pièce d'identité du dirigeant en cours de validité, justificatif de domicile ou relevé bancaire de moins de 180 jours, RIB de la SAS, carte bancaire.<\/li>\n<li><strong>Vérifier la cohérence<\/strong> : même nom, même adresse, même orthographe partout. Un accent ou un numéro de rue différent suffit à bloquer.<\/li>\n<li><strong>S'inscrire<\/strong> depuis le site vendeur d'Amazon France avec une adresse e-mail dédiée à la société.<\/li>\n<li><strong>Remplir<\/strong> les informations de l'entreprise exactement comme sur le Kbis, puis celles du dirigeant et du bénéficiaire effectif.<\/li>\n<li><strong>Passer la vérification vidéo<\/strong> : un agent compare votre visage et vos documents originaux en direct. Ayez les originaux en main.<\/li>\n<li><strong>Attendre la validation<\/strong> : quelques jours en général, parfois plus si des pièces sont redemandées.<\/li>\n<li><strong>Activer la double authentification<\/strong> immédiatement.<\/li>\n<\/ol>\n<p><strong>Règle absolue : un seul compte par entreprise et par personne.<\/strong> Amazon détecte les comptes liés par l'ordinateur, le réseau, la carte bancaire, l'IBAN, l'adresse ou le téléphone. Un compte lié à un compte suspendu est suspendu à son tour.<\/p>\n<h2 id=\"33-les-paramètres-à-régler-le-premier-jour\">3.3 Les paramètres à régler le premier jour<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Paramètre<\/th>\n<th>Où<\/th>\n<th>Réglage conseillé<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Utilisateurs<\/td>\n<td>Paramètres, Autorisations des utilisateurs<\/td>\n<td>Un utilisateur par associé, droits adaptés, jamais de partage de mot de passe<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Notifications<\/td>\n<td>Paramètres, Préférences de notification<\/td>\n<td>Santé du compte, retours, réclamations et messages acheteurs vers un e-mail lu chaque jour<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Service de calcul de TVA<\/td>\n<td>Paramètres, Calcul de TVA<\/td>\n<td>Activé, avec numéro de TVA saisi : factures automatiques<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Adresse de retour<\/td>\n<td>Paramètres d'expédition<\/td>\n<td>Adresse de la société<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Modèles d'expédition (FBM)<\/td>\n<td>Paramètres d'expédition<\/td>\n<td>Délais réalistes, zones desservies, tarifs<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Vacances<\/td>\n<td>Paramètres du compte<\/td>\n<td>Mode à activer si vous ne pouvez pas expédier vos commandes FBM<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Identifiant REP<\/td>\n<td>Conformité<\/td>\n<td>IDU français et numéros des autres pays<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Informations GPSR<\/td>\n<td>Fiches produits<\/td>\n<td>Fabricant et personne responsable pour chaque produit de marque propre<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"34-les-menus-que-vous-utiliserez-chaque-jour\">3.4 Les menus que vous utiliserez chaque jour<\/h2>\n<ul>\n<li><strong>Catalogue<\/strong> : ajouter des produits, vérifier les restrictions, créer des fiches.<\/li>\n<li><strong>Inventaire<\/strong> : gérer les offres, les prix, le stock, créer les envois FBA.<\/li>\n<li><strong>Prix<\/strong> : tableau de bord des prix, ajustement automatique, alertes de prix non compétitifs.<\/li>\n<li><strong>Commandes<\/strong> : commandes FBM à expédier, retours.<\/li>\n<li><strong>Publicité<\/strong> : console des campagnes.<\/li>\n<li><strong>Rapports<\/strong> : rapports d'activité, de paiement, d'inventaire FBA, de retours.<\/li>\n<li><strong>Performances<\/strong> : santé du compte, évaluations, réclamations A à Z.<\/li>\n<li><strong>Messages acheteurs<\/strong> : réponse obligatoire sous 24 heures, week-end compris.<\/li>\n<\/ul>\n<h2 id=\"35-la-santé-du-compte\">3.5 La santé du compte<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Indicateur<\/th>\n<th>Ce qu'il mesure<\/th>\n<th>Seuil<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Taux de défauts de commande (ODR)<\/td>\n<td>Évaluations négatives, réclamations A à Z, rétrofacturations<\/td>\n<td>Moins de 1 %<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Taux d'annulation avant expédition (FBM)<\/td>\n<td>Commandes annulées par vous<\/td>\n<td>Moins de 2,5 %<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Taux d'expéditions en retard (FBM)<\/td>\n<td>Expéditions après la date promise<\/td>\n<td>Moins de 4 %<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Suivi valide (FBM)<\/td>\n<td>Colis avec numéro de suivi<\/td>\n<td>Plus de 95 %<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Temps de réponse aux messages<\/td>\n<td>Réponses sous 24 h<\/td>\n<td>Plus de 90 %<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Plaintes de propriété intellectuelle et d'authenticité<\/td>\n<td>Signalements des marques et clients<\/td>\n<td>Zéro idéalement<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Notation de la santé du compte<\/td>\n<td>Synthèse des violations de règles<\/td>\n<td>Zone verte<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>En FBA, Amazon prend à sa charge les retards et une partie des évaluations liées à la livraison : c'est une protection de plus.<\/p>\n<h2 id=\"36-catégories-et-marques-restreintes\">3.6 Catégories et marques restreintes<\/h2>\n<p>Certaines catégories (beauté, alimentaire, montres, bijoux, objets de collection) et de nombreuses marques demandent une autorisation. Selon le compte, Amazon peut :<\/p>\n<ul>\n<li>vous autoriser automatiquement (compte ancien, bonnes performances) ;<\/li>\n<li>demander des factures : en général d'un grossiste ou du fabricant, de moins de 180 jours, portant sur au moins 10 unités, avec coordonnées complètes du fournisseur, que l'équipe d'Amazon peut contacter ;<\/li>\n<li>exiger une lettre d'autorisation de la marque ;<\/li>\n<li>refuser sans recours pour certaines marques.<\/li>\n<\/ul>\n<p>Les tickets de caisse et factures de détaillants sont refusés. Ne trichez jamais sur ces documents : une facture modifiée entraîne la fermeture définitive du compte.<\/p>\n<h2 id=\"37-les-paiements\">3.7 Les paiements<\/h2>\n<ul>\n<li>Amazon verse votre solde environ tous les 14 jours, après déduction de tous les frais.<\/li>\n<li>Une réserve peut être retenue sur un compte neuf ou après des réclamations : le paiement d'une vente intervient alors quelques jours après la livraison.<\/li>\n<li>Le rapport de paiement détaille chaque frais : c'est la base de votre comptabilité et de vos calculs de marge réelle.<\/li>\n<\/ul>\n<h2 id=\"38-réussir-linscription-du-premier-coup\">3.8 Réussir l'inscription du premier coup<\/h2>\n<ul>\n<li><strong>Carte bancaire<\/strong> : Visa, Mastercard ou American Express. Les cartes prépayées, cartes cadeaux, chèques et PayPal sont refusés.<\/li>\n<li><strong>Vérification d'identité<\/strong> : selon le cas, photo de votre visage avec la pièce d'identité, appel vidéo, ou simple envoi de la pièce. Comptez en général 3 jours ouvrés ou moins.<\/li>\n<li><strong>Preuve du lien avec la société<\/strong> : statuts, attestation d'actionnaire ou lettre d'autorisation, si le contact principal n'apparaît pas clairement sur le Kbis.<\/li>\n<li><strong>Relevé bancaire<\/strong> de moins de 180 jours si Amazon ne vérifie pas le compte automatiquement.<\/li>\n<li><strong>Documents<\/strong> : scans ou photos en couleur, quatre coins visibles, texte lisible, jamais de capture d'écran.<\/li>\n<li><strong>Nom de boutique<\/strong> : unique sur Amazon, choisissez-le à l'avance.<\/li>\n<li><strong>Inscription unifiée<\/strong> : un seul compte européen couvre la France, l'Allemagne, l'Italie, l'Espagne, les Pays-Bas, la Suède, la Pologne et le Royaume-Uni. L'abonnement de 39 € HT couvre les sites européens ; vous choisissez ensuite les sites où vendre.<\/li>\n<li>L'abonnement n'est débité qu'une fois l'inscription vérifiée.<\/li>\n<\/ul>\n<h2 id=\"39-les-avantages-nouveaux-vendeurs\">3.9 Les avantages nouveaux vendeurs<\/h2>\n<p>Amazon annonce jusqu'à 47 250 € d'avantages pour les nouveaux vendeurs. À activer dès le départ :<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Avantage<\/th>\n<th>Montant<\/th>\n<th>Condition principale<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Remise sur les ventes de marque<\/td>\n<td>10 % sur les 45 000 premiers euros de ventes de marque, puis 5 % jusqu'à 900 000 €, la première année<\/td>\n<td>Marque inscrite au Brand Registry (module 12)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Crédits Vine<\/td>\n<td>180 €<\/td>\n<td>Marque enregistrée<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Crédits d'expédition FBA<\/td>\n<td>90 €<\/td>\n<td>Envois avec le transporteur partenaire d'Amazon<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Nouveau programme de sélection FBA<\/td>\n<td>Stockage, retraits et retours gratuits sur les nouveaux produits<\/td>\n<td>Automatique pour les nouveaux ASIN en FBA (module 8.10)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Crédits publicitaires<\/td>\n<td>Jusqu'à 850 € en Sponsored Products, et 45 € en bons d'achat<\/td>\n<td>Créer une campagne ou un bon d'achat dans les 90 jours suivant la mise en ligne<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Les crédits publicitaires expirent généralement 30 jours après leur attribution : lancez une première campagne dès qu'un produit exclusif est en stock. Conditions à vérifier sur la page Tarification d'Amazon, rubrique avantages nouveaux vendeurs.<\/p>\n<h2 id=\"exercices\">Exercices<\/h2>\n<ol type=\"1\">\n<li>Ouvrez le compte et réglez chacun des 8 paramètres du tableau 3.3.<\/li>\n<li>Testez 20 ASIN visés dans Catalogue, Ajouter des produits : notez lesquels sont restreints.<\/li>\n<\/ol>\n<h2 id=\"checklist-de-validation\">Checklist de validation<\/h2>\n<ul class=\"task-list\">\n<li><label><input type=\"checkbox\" />Compte Professionnel ouvert et double authentification activée.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Un utilisateur par associé.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Service de calcul de TVA activé.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Notifications de santé du compte reçues sur un e-mail lu chaque jour.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Je connais les seuils des 6 indicateurs de santé.<\/label><\/li>\n<\/ul>\n", "todo": [], "quiz": [["Votre associé veut ouvrir son propre compte vendeur. Risque ?", ["Aucun", "Comptes liés : suspension possible des deux", "Frais doublés seulement"], 1, "Un seul compte ; ajoutez-le comme utilisateur."], ["Quel document Amazon accepte pour débloquer une marque restreinte ?", ["Un ticket de caisse Action", "Une facture de grossiste au nom de la société", "Une photo du produit"], 1, "Les tickets et factures de détaillant sont refusés."], ["Quel taux de défauts de commande (ODR) ne faut-il pas dépasser ?", ["1 %", "5 %", "10 %"], 0, "Au-delà de 1 %, le compte risque la suspension."]], "ans": ["Plan Professionnel (39 € HT par mois) choisi à l'inscription. Double authentification : Paramètres, Connexion et sécurité. Voir 3.1 et 3.2.", "Paramètres, Autorisations des utilisateurs : invitez l'autre associé avec sa propre adresse e-mail. Ne partagez jamais un mot de passe et n'ouvrez jamais un deuxième compte. Voir 3.3.", "Paramètres, Calcul de TVA : activez le service et saisissez le numéro de TVA de la SAS. Amazon émet alors les factures de vente automatiquement. Voir 3.3.", "Paramètres, Préférences de notification : cochez santé du compte, retours, réclamations et messages acheteurs, vers une adresse lue chaque jour. Voir 3.3.", "Défauts de commande (ODR) sous 1 %. Annulations sous 2,5 %. Expéditions en retard sous 4 %. Suivi valide au-dessus de 95 %. Réponse aux messages sous 24 h dans plus de 90 % des cas. Plaintes de propriété intellectuelle : zéro. Voir 3.5."]}, {"id": "m4", "lvl": "Opérationnel", "t": "Scanner et analyser un produit", "tag": "Module 4", "min": 45, "lead": "Un vendeur expert décide en moins d&#x27;une minute s&#x27;il achète un produit, en magasin, son téléphone à la main. Ce module vous apprend à le faire avec ProfitGo : lire un scan, estimer les ventes mensuelles et votre part de ces ventes, et repérer les pièges.", "html": "<h2 id=\"41-les-outils\">4.1 Les outils<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Outil<\/th>\n<th>Ce qu'il donne<\/th>\n<th>Prix indicatif<\/th>\n<th>Indispensable<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>ProfitGo (ProfitPath)<\/td>\n<td>Application mobile de scan et extension Chrome : marge et retour sur l'achat avec TVA, ventes estimées, statistiques de Buy Box, liste des offres FBA et FBM, historique du prix et du classement sur 30, 60, 90 et 180 jours, comparaison entre les sites Amazon européens, recherche inversée dans plus de 2 000 boutiques<\/td>\n<td>14,95 à 19,95 € par mois<\/td>\n<td>Oui, votre outil principal<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Application Amazon Seller<\/td>\n<td>Restriction du produit pour VOTRE compte, frais exacts, offres en cours<\/td>\n<td>Gratuit<\/td>\n<td>Oui, en complément<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Keepa<\/td>\n<td>Historique très détaillé, recherche de produits par filtres, alertes de prix<\/td>\n<td>Environ 20 € par mois<\/td>\n<td>Plus tard, pour l'arbitrage en ligne avancé<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Helium 10 ou Jungle Scout<\/td>\n<td>Mots-clés et niches pour la marque propre<\/td>\n<td>40 à 100 € par mois<\/td>\n<td>À partir du module 12<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Combinaison de départ : <strong>ProfitGo + application Amazon Seller<\/strong>, soit environ 15 à 20 € par mois.<\/p>\n<p>Pourquoi l'application Amazon Seller en plus : ProfitGo ne mentionne pas de vérification des restrictions de votre compte, ni d'alertes de propriété intellectuelle ou de matières dangereuses. L'application d'Amazon répond à la première question en 3 secondes. Demandez pendant la formation ProfitGo si ces alertes existent.<\/p>\n<h2 id=\"42-le-réglage-de-profitgo-avant-le-premier-scan\">4.2 Le réglage de ProfitGo avant le premier scan<\/h2>\n<ol type=\"1\">\n<li><strong>Site Amazon<\/strong> : Amazon.fr comme site principal, avec l'affichage des autres sites européens pour comparer.<\/li>\n<li><strong>TVA<\/strong> : activée, taux de 20 %, prix d'achat saisis TTC (le prix du ticket).<\/li>\n<li><strong>Mode d'expédition<\/strong> : FBA.<\/li>\n<li><strong>Objectifs<\/strong> : retour sur l'achat cible de 30 % (50 % pour les produits qui peuvent tomber en panne) et marge minimum de 3 €.<\/li>\n<li><strong>Coûts supplémentaires<\/strong> : 0,35 € par unité pour les étiquettes, sachets et transport vers Amazon, si le champ existe.<\/li>\n<li><strong>Période d'analyse<\/strong> : 90 jours pour les prix et le classement.<\/li>\n<li><strong>Remises<\/strong> : utilisez le champ remise (par exemple 10 % ou 3 pour 2) quand le magasin fait une promotion.<\/li>\n<li><strong>Deux utilisateurs<\/strong> : vérifiez pendant la formation si l'abonnement couvre deux téléphones.<\/li>\n<\/ol>\n<p>Les noms exacts des réglages peuvent différer : notez-les pendant la formation visio.<\/p>\n<h2 id=\"43-lire-un-scan-en-30-secondes\">4.3 Lire un scan en 30 secondes<\/h2>\n<p>L'ordre de lecture qui fait gagner du temps :<\/p>\n<ol type=\"1\">\n<li><strong>Restriction<\/strong> : un coup d'œil dans l'application Amazon Seller (ou les raccourcis vers Seller Central de ProfitGo). Restreint : arrêtez-vous là.<\/li>\n<li><strong>Amazon vend-il ?<\/strong> Regardez les statistiques de Buy Box : si Amazon la détient la plupart du temps, passez.<\/li>\n<li><strong>Prix de la Buy Box<\/strong> et offres FBA les moins chères (résumé des offres).<\/li>\n<li><strong>Marge et retour sur l'achat<\/strong> au prix de la Buy Box.<\/li>\n<li><strong>Ventes estimées par mois<\/strong> et <strong>nombre de vendeurs FBA<\/strong>.<\/li>\n<li><strong>Historique sur 90 jours<\/strong> : le prix est-il stable, en baisse, en dent de scie ?<\/li>\n<li><strong>Comparaison européenne<\/strong> : le produit se vend-il plus cher en Allemagne, en Italie ou en Espagne ?<\/li>\n<\/ol>\n<h2 id=\"44-lire-lhistorique-des-prix-et-du-classement\">4.4 Lire l'historique des prix et du classement<\/h2>\n<p>Que ce soit dans ProfitGo ou dans Keepa, les mêmes courbes se lisent de la même façon :<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Courbe<\/th>\n<th>Ce qu'elle montre<\/th>\n<th>Bon signe<\/th>\n<th>Mauvais signe<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Prix d'Amazon vendeur<\/td>\n<td>Prix quand Amazon vend lui-même<\/td>\n<td>Absente ou interrompue longtemps<\/td>\n<td>Continue : Amazon toujours en stock<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Prix de la Buy Box<\/td>\n<td>Prix de vente réel<\/td>\n<td>Stable ou en hausse<\/td>\n<td>Baisse régulière (guerre des prix)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Offre FBA la moins chère<\/td>\n<td>Plancher des concurrents FBA<\/td>\n<td>Proche de la Buy Box<\/td>\n<td>Très en dessous<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Classement des ventes (BSR)<\/td>\n<td>Rang dans la catégorie<\/td>\n<td>Nombreuses chutes vers le bas<\/td>\n<td>Plat ou en hausse continue<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Nombre d'offres<\/td>\n<td>Nombre de vendeurs<\/td>\n<td>Stable ou en baisse<\/td>\n<td>En forte hausse<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>La règle des chutes de classement<\/strong> : chaque fois que la courbe du classement descend brusquement, au moins une vente a eu lieu. Comptez les chutes sur 30 jours : c'est le nombre minimum de ventes mensuelles.<\/p>\n<p><strong>Lire la phase du cycle de vie<\/strong> (module 1.6) :<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Phase<\/th>\n<th>Nombre d'offres<\/th>\n<th>Prix de la Buy Box<\/th>\n<th>Décision<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1. Peu de vendeurs<\/td>\n<td>Bas et stable<\/td>\n<td>Haut et stable<\/td>\n<td>Acheter<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>2. Arrivée de vendeurs<\/td>\n<td>En hausse<\/td>\n<td>Commence à baisser<\/td>\n<td>Petit lot seulement<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>3. Guerre des prix<\/td>\n<td>Haut<\/td>\n<td>En chute<\/td>\n<td>Ne pas acheter<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>4. Assainissement<\/td>\n<td>En baisse<\/td>\n<td>Remonte<\/td>\n<td>Revenir prudemment<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"45-estimer-les-ventes-mensuelles\">4.5 Estimer les ventes mensuelles<\/h2>\n<p>Croisez trois sources et retenez la plus prudente :<\/p>\n<ol type=\"1\">\n<li><strong>L'estimation de ventes de ProfitGo<\/strong> (et par variation, pour les tailles et couleurs).<\/li>\n<li><strong>Les chutes de classement sur 30 jours<\/strong> dans le graphique.<\/li>\n<li><strong>La mention « X achetés au cours du mois dernier »<\/strong> affichée sur de nombreuses fiches Amazon (arrondie : 50+, 100+, 1 k+...).<\/li>\n<\/ol>\n<p>Pour un produit qui se vend plusieurs fois par jour, les chutes sous-estiment les ventes. Pour un produit lent, elles sont fiables.<\/p>\n<h2 id=\"46-calculer-votre-part-des-ventes\">4.6 Calculer VOTRE part des ventes<\/h2>\n<p>Les ventes de la fiche ne sont pas les vôtres : elles sont partagées entre les vendeurs qui obtiennent la Buy Box.<\/p>\n<div class=\"formula\">Vos ventes mensuelles ≈ (Ventes de la fiche) ÷ (Vendeurs FBA au prix de la Buy Box + 1)<\/div>\n<p><strong>Cas pratique<\/strong> : un produit vend 150 unités par mois. Les statistiques de Buy Box montrent 4 vendeurs FBA à moins de 2 % du prix de la Buy Box. Vous arrivez au même prix : vos ventes estimées sont 150 ÷ 5 = 30 unités par mois. Avec 3,50 € de marge, ce produit vous rapporte environ 105 € par mois. Un lot de 30 à 45 unités (1 à 1,5 mois de ventes) est le bon dimensionnement.<\/p>\n<p>Comptez les vendeurs FBM à prix égal pour moitié : ils obtiennent moins souvent la Buy Box.<\/p>\n<h2 id=\"47-la-recherche-inversée-et-larbitrage-en-ligne\">4.7 La recherche inversée et l'arbitrage en ligne<\/h2>\n<ul>\n<li><strong>Recherche inversée<\/strong> : depuis un produit Amazon rentable, ProfitGo cherche le prix le plus bas dans plus de 2 000 boutiques européennes. C'est la méthode la plus rapide pour l'arbitrage en ligne.<\/li>\n<li><strong>Sourcer sur n'importe quel site<\/strong> : sur la page d'un produit d'une boutique en ligne, l'extension calcule frais et retour sur l'achat.<\/li>\n<li><strong>Analyse de vitrine<\/strong> : regardez les marques et produits d'un vendeur concurrent qui réussit, pour trouver des pistes.<\/li>\n<li><strong>Export Google Sheets<\/strong> : gardez une trace de chaque produit analysé (date, source, prix, décision).<\/li>\n<\/ul>\n<h2 id=\"48-les-signaux-dalerte\">4.8 Les signaux d'alerte<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Signal<\/th>\n<th>Ce qu'il révèle<\/th>\n<th>Décision<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Nombre de vendeurs qui double en 30 jours<\/td>\n<td>Produit découvert par d'autres revendeurs<\/td>\n<td>Ne pas acheter, ou très petit lot<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Un seul vendeur depuis longtemps, c'est la marque<\/td>\n<td>Marque qui protège sa fiche<\/td>\n<td>Risque de plainte, éviter<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Prix en chute continue sur 90 jours<\/td>\n<td>Guerre des prix en cours<\/td>\n<td>Attendre la phase d'assainissement<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Pic de prix récent isolé<\/td>\n<td>Rupture passagère, prix artificiel<\/td>\n<td>Calculer au prix moyen 90 jours<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Buy Box supprimée récemment<\/td>\n<td>Prix jugé trop haut par Amazon<\/td>\n<td>Prudence, ventes instables<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Fiche avec moins de 3,8 étoiles<\/td>\n<td>Produit décevant, retours fréquents<\/td>\n<td>Éviter<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Produit saisonnier<\/td>\n<td>Ventes concentrées sur quelques semaines<\/td>\n<td>Acheter seulement 4 à 8 semaines avant la saison<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Lot ou pack sur la fiche<\/td>\n<td>La fiche vend 2 ou 3 unités, pas une<\/td>\n<td>Multiplier votre coût d'achat<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"49-la-grille-de-décision-complète\">4.9 La grille de décision complète<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Critère<\/th>\n<th>Feu vert<\/th>\n<th>Feu orange<\/th>\n<th>Feu rouge<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Restriction<\/td>\n<td>Aucune<\/td>\n<td>—<\/td>\n<td>Restreint<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Amazon vendeur<\/td>\n<td>Absent<\/td>\n<td>Présent moins de 30 % du temps<\/td>\n<td>Présent la plupart du temps<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Retour sur l'achat (produit simple)<\/td>\n<td>30 % et plus<\/td>\n<td>20 à 30 %<\/td>\n<td>Moins de 20 %<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Marge par unité (produit simple)<\/td>\n<td>3 € et plus<\/td>\n<td>2 à 3 €<\/td>\n<td>Moins de 2 €<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Produit à panne<\/td>\n<td>50 % et 5 €<\/td>\n<td>35 % et 3,50 €<\/td>\n<td>En dessous<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Vos ventes estimées<\/td>\n<td>20 par mois et plus<\/td>\n<td>10 à 20<\/td>\n<td>Moins de 10<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Prix sur 90 jours<\/td>\n<td>Stable<\/td>\n<td>Variations de plus de 20 %<\/td>\n<td>Baisse continue<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Catégorie<\/td>\n<td>Autorisée<\/td>\n<td>—<\/td>\n<td>Exclue par vos règles<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Un seul feu rouge suffit pour refuser. Deux feux orange : petit lot test uniquement.<\/p>\n<h2 id=\"exercices\">Exercices<\/h2>\n<ol type=\"1\">\n<li>En magasin, scannez 50 produits avec ProfitGo en 45 minutes. Classez-les vert, orange, rouge.<\/li>\n<li>Pour les 5 meilleurs, vérifiez la restriction dans l'application Amazon Seller, puis calculez votre part des ventes et le lot à acheter.<\/li>\n<li>Trouvez une fiche en guerre des prix et une fiche en phase d'assainissement.<\/li>\n<li>Utilisez la recherche inversée sur 10 produits rentables.<\/li>\n<\/ol>\n<h2 id=\"checklist-de-validation\">Checklist de validation<\/h2>\n<ul class=\"task-list\">\n<li><label><input type=\"checkbox\" />ProfitGo est réglé avec Amazon.fr, la TVA et vos seuils.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Je vérifie la restriction de chaque produit avant d'acheter.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Je lis un scan dans l'ordre des 7 étapes.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Je reconnais la phase du cycle de vie d'une fiche.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Je calcule ma part des ventes et le lot à acheter.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Je reconnais les 8 signaux d'alerte.<\/label><\/li>\n<\/ul>\n", "todo": [], "quiz": [["Que regarder en premier sur un scan ?", ["La marge", "Les restrictions et alertes", "Le nombre de vendeurs"], 1, "Un produit restreint ou à risque s'arrête là, inutile de lire la suite."], ["La fiche vend 150 unités/mois, 4 vendeurs FBA sont au prix de la Buy Box. Vous entrez au même prix : vos ventes ?", ["150", "Environ 30", "Environ 75"], 1, "150 ÷ (4 + 1) = 30 unités par mois."], ["Sur Keepa, la courbe du classement chute brusquement. Cela signifie :", ["Au moins une vente a eu lieu", "Le produit est en rupture", "Le prix a baissé"], 0, "Comptez les chutes sur 30 jours : c'est le minimum de ventes mensuelles."]], "ans": ["Site Amazon.fr, TVA activée à 20 % avec prix d'achat TTC, mode FBA, objectifs 30 % de retour et 3 € de marge (50 % et 5 € pour les produits à panne), 0,35 € de coûts par unité, période 90 jours. Voir 4.2.", "Scannez le code-barres dans l'application Amazon Seller (gratuite) : si elle affiche « Demander l'autorisation », le produit est restreint pour votre compte. On ne l'achète pas. Voir 4.1 et 4.3.", "1. Restriction. 2. Amazon vend-il ? 3. Prix de la Buy Box et offres FBA. 4. Marge et retour sur l'achat. 5. Ventes estimées et nombre de vendeurs FBA. 6. Historique sur 90 jours. 7. Comparaison avec les autres pays. Voir 4.3.", "Regardez deux courbes : le nombre d'offres et le prix de la Buy Box. Offres basses et prix stable : phase 1. Offres en hausse, prix qui baisse : phase 2. Offres hautes, prix en chute : phase 3. Offres en baisse, prix qui remonte : phase 4. Voir 4.4.", "Vos ventes ≈ ventes de la fiche ÷ (vendeurs FBA au prix de la Buy Box + 1). Lot = 1 à 1,5 mois de vos ventes. Exemple : 150 ÷ (4 + 1) = 30 par mois, lot de 30 à 45 unités. Voir 4.6.", "Vendeurs qui doublent en 30 jours, la marque seule vendeuse, prix en chute sur 90 jours, pic de prix isolé, Buy Box supprimée récemment, moins de 3,8 étoiles, produit saisonnier, lot ou pack sur la fiche. Voir 4.8."]}, {"id": "m5", "lvl": "Opérationnel", "t": "Sourcing expert", "tag": "Module 5", "min": 45, "lead": "Le profit se fait à l&#x27;achat. Un vendeur moyen cherche des produits ; un expert construit des sources récurrentes qui lui livrent des produits rentables chaque semaine. Ce module couvre les quatre sources, de la plus simple à la plus puissante.", "html": "<h2 id=\"51-larbitrage-en-magasin\">5.1 L'arbitrage en magasin<\/h2>\n<p><strong>Les enseignes à prospecter<\/strong> : déstockeurs et discounters (Action, Noz, Stokomani, Gifi, Centrakor), grandes surfaces spécialisées en promotion (bricolage, jardin, sport, culture), hypermarchés en fin de saison, magasins d'usine. Votre secteur frontalier permet aussi de comparer avec les promotions suisses et allemandes.<\/p>\n<p><strong>La routine d'une tournée<\/strong> :<\/p>\n<ol type=\"1\">\n<li>Partez avec un objectif chiffré : 150 à 300 € d'achats par tournée au début.<\/li>\n<li>Commencez par les rayons déstockage, fin de série et promotions.<\/li>\n<li>Scannez tout ce qui porte une marque connue et un code-barres, sans juger à l'œil.<\/li>\n<li>Notez les produits feu vert dans une liste partagée (enseigne, produit, prix, marge, quantité en rayon).<\/li>\n<li>Demandez une facture au nom de la SAS en caisse, ou commandez en ligne sur le site de l'enseigne pour obtenir une facture.<\/li>\n<li>Le soir, vérifiez chaque achat sur Keepa avant de l'envoyer.<\/li>\n<\/ol>\n<p><strong>Bonnes pratiques<\/strong> : restez discret et courtois, ne videz pas un rayon d'un coup si l'enseigne limite les quantités, ne revendez jamais un produit déballé ou abîmé en « Neuf ».<\/p>\n<h2 id=\"52-larbitrage-en-ligne\">5.2 L'arbitrage en ligne<\/h2>\n<p>Même principe, depuis l'ordinateur : vous achetez en promotion sur des sites marchands et revendez sur Amazon.<\/p>\n<ul>\n<li><strong>Sources<\/strong> : promotions des sites d'enseignes, ventes flash, sites de marques en déstockage, jamais Amazon lui-même ni Amazon Seconde Main (revente interdite), autres places de marché avec prudence.<\/li>\n<li><strong>Méthode<\/strong> : extension ProfitGo installée, vous parcourez les promotions et l'extension affiche la marge en direct.<\/li>\n<li><strong>Recherche inversée avec Keepa<\/strong> : filtrez les produits dont le prix vient de monter sur Amazon et cherchez-les en promotion ailleurs.<\/li>\n<li><strong>Cumulez les réductions<\/strong> : codes promotionnels, cashback, cartes de fidélité professionnelles.<\/li>\n<li><strong>Livraison<\/strong> : faites livrer directement chez un prestataire de préparation FBA si vous ne voulez pas manipuler les cartons.<\/li>\n<\/ul>\n<h2 id=\"53-les-grossistes-et-distributeurs--le-cœur-de-lactivité\">5.3 Les grossistes et distributeurs : le cœur de l'activité<\/h2>\n<p>Un grossiste fournit des marques existantes, avec facture professionnelle, en quantité et de façon répétée. C'est ce qui fait passer de quelques centaines à plusieurs milliers d'euros de bénéfice par mois.<\/p>\n<p><strong>Où les trouver<\/strong> :<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Source<\/th>\n<th>Comment<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Le produit lui-même<\/td>\n<td>Sur l'emballage : fabricant, importateur ou distributeur pour la France. Contactez-le directement.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Site de la marque<\/td>\n<td>Rubrique « Devenir revendeur », « Professionnels » ou « Distributeurs »<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Salons professionnels<\/td>\n<td>Maison et Objet (Paris), Ambiente (Francfort), salons du bricolage et du jardin, salons régionaux<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Annuaires B2B<\/td>\n<td>Annuaires de grossistes, plateformes B2B européennes, Kompass<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Distributeurs allemands et suisses<\/td>\n<td>Mêmes marques, parfois de meilleurs prix et plus ouverts à Amazon<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Recherche Google<\/td>\n<td>« grossiste + catégorie », « distributeur officiel + marque », en français, allemand et anglais<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Fins de série de marques<\/td>\n<td>Demandez à la marque ses surstocks et emballages ancienne version<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Le premier contact<\/strong> : un e-mail court et professionnel (modèle en annexe), avec le Kbis et le numéro de TVA. Beaucoup de marques refusent Amazon au premier abord : présentez-vous comme revendeur en ligne multicanal, mentionnez que vous respectez leur prix de vente conseillé et leur image.<\/p>\n<p><strong>Ce qu'il faut obtenir<\/strong> :<\/p>\n<ul>\n<li>La liste de prix revendeur (souvent en Excel, avec codes-barres).<\/li>\n<li>Le minimum de commande (en euros ou en unités).<\/li>\n<li>Les délais et frais de livraison, et s'ils livrent un entrepôt Amazon.<\/li>\n<li>Les conditions de paiement.<\/li>\n<li>Leur politique sur Amazon : autorisation écrite ou interdiction.<\/li>\n<\/ul>\n<p><strong>Analyser une liste de prix en masse<\/strong> : importez le fichier dans un outil d'analyse en masse (outil d'analyse de liste de ProfitPath ou de Keepa, ou un tableur). Sur 1 000 références, 2 à 5 % passent en général vos critères : c'est normal et suffisant.<\/p>\n<h2 id=\"54-négocier-avec-un-fournisseur\">5.4 Négocier avec un fournisseur<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Levier<\/th>\n<th>Ce que vous demandez<\/th>\n<th>Quand<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Remise volume<\/td>\n<td>3 à 10 % de plus à partir d'un palier<\/td>\n<td>Dès la deuxième commande<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Franco de port<\/td>\n<td>Livraison offerte au-delà d'un montant<\/td>\n<td>Toujours<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Délai de paiement<\/td>\n<td>30 jours fin de mois<\/td>\n<td>Après 2 à 3 commandes payées à l'heure<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Exclusivité Amazon<\/td>\n<td>Être le seul revendeur autorisé sur Amazon pour la marque<\/td>\n<td>Quand vous vendez déjà bien leurs produits<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Gestion de leur présence Amazon<\/td>\n<td>Reprendre leurs fiches, améliorer photos et contenus<\/td>\n<td>Marques mal présentes sur Amazon<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Lettre d'autorisation<\/td>\n<td>Document autorisant la revente sur Amazon<\/td>\n<td>Pour débloquer une marque restreinte<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>La position la plus forte : proposer à une marque française ou européenne mal présente sur Amazon de gérer ses ventes dans toute l'Europe. Vous obtenez souvent l'exclusivité et de meilleurs prix.<\/p>\n<h2 id=\"55-les-fabricants-directs\">5.5 Les fabricants directs<\/h2>\n<p>Pour les marques françaises et européennes (PME, artisans industriels), le fabricant est souvent son propre distributeur. Les marges sont meilleures que chez un grossiste, et la relation peut déboucher sur une exclusivité ou une marque blanche (module 12).<\/p>\n<h2 id=\"56-liquidations-et-lots\">5.6 Liquidations et lots<\/h2>\n<ul>\n<li><strong>Sources<\/strong> : surstocks de marques, faillites, retours clients reconditionnés, palettes de liquidation.<\/li>\n<li><strong>Risques<\/strong> : produits abîmés, incomplets, sans facture d'origine, ou de marques restreintes.<\/li>\n<li><strong>Règle<\/strong> : n'achetez que des lots manifestés (liste détaillée avec codes-barres) que vous pouvez analyser avant achat, avec facture. Revendez en « Occasion » tout ce qui n'est pas parfaitement neuf.<\/li>\n<\/ul>\n<h2 id=\"57-organiser-le-sourcing-à-deux\">5.7 Organiser le sourcing à deux<\/h2>\n<ul>\n<li><strong>Liste partagée<\/strong> des produits testés : date, source, prix d'achat, décision, résultat réel après vente.<\/li>\n<li><strong>Liste des fournisseurs<\/strong> : contact, conditions, historique des commandes, prochaine relance.<\/li>\n<li><strong>Objectifs hebdomadaires<\/strong> : nombre de produits scannés, nombre de fournisseurs contactés, montant investi.<\/li>\n<\/ul>\n<h2 id=\"exercices\">Exercices<\/h2>\n<ol type=\"1\">\n<li>Faites une tournée de 3 magasins avec l'objectif de 5 produits feu vert.<\/li>\n<li>Identifiez 30 fournisseurs à partir des emballages de produits feu vert et envoyez-leur le modèle d'e-mail.<\/li>\n<li>Analysez une liste de prix d'au moins 200 références.<\/li>\n<\/ol>\n<h2 id=\"checklist-de-validation\">Checklist de validation<\/h2>\n<ul class=\"task-list\">\n<li><label><input type=\"checkbox\" />Je fais une tournée magasin avec facture pour chaque achat.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Je sais trouver le distributeur d'un produit à partir de son emballage.<\/label><\/li>\n<li><label><input type=\"checkbox\" />J'ai envoyé au moins 30 demandes à des fournisseurs.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Je sais analyser une liste de prix en masse.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Je connais les 6 leviers de négociation.<\/label><\/li>\n<\/ul>\n", "todo": [], "quiz": [["Où trouver le distributeur d'un produit de marque ?", ["Sur l'emballage du produit", "Auprès d'Amazon", "Dans Keepa"], 0, "Fabricant, importateur ou distributeur y figurent souvent."], ["Sur une liste de 1 000 références de grossiste, combien passent vos critères en général ?", ["Environ 50 %", "2 à 5 %", "Aucune"], 1, "C'est normal et suffisant."], ["Le levier de négociation le plus fort avec une marque mal présente sur Amazon :", ["Exiger 50 % de remise", "Proposer de gérer sa présence Amazon en Europe", "Menacer de vendre moins cher"], 1, "Vous obtenez souvent exclusivité et meilleurs prix."]], "ans": ["Objectif chiffré avant de partir, rayons déstockage d'abord, scan de tout produit de marque, liste partagée des feux verts, facture au nom de la SAS pour chaque achat, vérification le soir avant envoi. Voir 5.1.", "Lisez l'emballage : fabricant, importateur ou distributeur pour la France y figurent souvent. Sinon, site de la marque, rubrique « Revendeurs » ou « Professionnels ». Voir 5.3.", "Utilisez le modèle d'e-mail A1 des annexes, avec Kbis et numéro de TVA. Relancez au bout de 7 jours avec le modèle A2. Comptez 3 à 5 réponses utiles pour 30 envois. Voir 5.3 et annexes.", "Importez la liste de prix (codes-barres et prix HT) dans un outil d'analyse de liste ou faites-la analyser par l'IA avec le modèle de consigne du 13.8. Sur 1 000 références, 2 à 5 % passent vos critères. Voir 5.3 et 13.8.", "1. Remise volume. 2. Franco de port. 3. Délai de paiement (30 jours). 4. Exclusivité Amazon. 5. Gestion de leur présence Amazon. 6. Lettre d'autorisation de revente. Voir 5.4."]}, {"id": "m6", "lvl": "Opérationnel", "t": "Économie d'un produit et compte de résultat", "tag": "Module 6", "min": 50, "lead": "Un expert connaît sa marge nette au centime près, produit par produit, et sait à quel prix il cesse de gagner de l&#x27;argent. C&#x27;est ce chiffre, et non le chiffre d&#x27;affaires, qui décide de tout : achat, prix, publicité, réapprovisionnement.", "html": "<h2 id=\"61-tous-les-frais-sans-exception\">6.1 Tous les frais, sans exception<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Frais<\/th>\n<th>Calcul<\/th>\n<th>S'applique<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Abonnement Professionnel<\/td>\n<td>39 € HT par mois<\/td>\n<td>Toujours<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Commission (frais de vente)<\/td>\n<td>8 à 15 % du prix TTC selon la catégorie (parfois plus), avec un minimum par article<\/td>\n<td>Chaque vente<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Frais d'expédition FBA<\/td>\n<td>Montant fixe selon le poids et les dimensions du colis emballé<\/td>\n<td>Chaque vente FBA<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Surcoût réseau européen (EFN)<\/td>\n<td>Supplément par commande livrée dans un autre pays<\/td>\n<td>Ventes étrangères depuis la France<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Stockage mensuel FBA<\/td>\n<td>Par mètre cube, plus cher d'octobre à décembre<\/td>\n<td>Stock chez Amazon<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Stockage de longue durée<\/td>\n<td>Surtaxe sur le stock ancien<\/td>\n<td>Stock qui dort<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Traitement des retours<\/td>\n<td>Par unité retournée dans certaines catégories<\/td>\n<td>Retours<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Retrait ou destruction<\/td>\n<td>Par unité<\/td>\n<td>Stock invendable<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Frais de remboursement<\/td>\n<td>Part de commission conservée par Amazon<\/td>\n<td>Remboursements<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Transport vers Amazon<\/td>\n<td>Colis ou palette<\/td>\n<td>Chaque envoi<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Préparation et éti
