quetage<\/td>\n<td>Votre temps ou un prestataire (0,50 à 1,50 € par unité)<\/td>\n<td>Chaque unité<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Publicité<\/td>\n<td>Coût par clic<\/td>\n<td>Si campagne<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Outils, comptable, assurance<\/td>\n<td>Forfaits mensuels<\/td>\n<td>Toujours<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Amazon crée régulièrement de nouveaux frais : lisez les annonces de Seller Central chaque mois. Pour un produit donné, le calculateur de revenus FBA d'Amazon donne les frais exacts.<\/p>\n<h2 id=\"les-grilles-officielles-2026-en-chiffres-amazonfr\">Les grilles officielles 2026 en chiffres (Amazon.fr)<\/h2>\n<p>Relevées sur la page Tarification d'Amazon et la grille tarifaire FBA en vigueur au 2 novembre 2026. Le calculateur de la version interactive applique ces grilles automatiquement.<\/p>\n<p><strong>Frais de vente des catégories qui vous concernent<\/strong> (pourcentage du prix total TTC, minimum 0,30 € par article)<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Catégorie<\/th>\n<th>Taux<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Produits pour la maison<\/td>\n<td>8 % jusqu'à 20 €, 15 % au-dessus (sur tout le prix)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Cuisine ; linge de maison et tapis<\/td>\n<td>15 %<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Outils pour la maison et aménagement intérieur<\/td>\n<td>13 %<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Pelouse et jardin ; sports et plein air ; produits de bureau<\/td>\n<td>15 %<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Automobile<\/td>\n<td>15 % jusqu'à 50 €, 9 % sur la part au-dessus<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Accessoires électroniques et informatiques<\/td>\n<td>15 % jusqu'à 100 €, 8 % sur la part au-dessus<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Électronique grand public ; ordinateurs<\/td>\n<td>7 %<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Meubles<\/td>\n<td>15 % jusqu'à 200 €, 10 % sur la part au-dessus<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Animalerie (articles)<\/td>\n<td>15 %<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Bagages ; sacs à dos et sacs à main ; chaussures<\/td>\n<td>15 %<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Vêtements et accessoires<\/td>\n<td>5 % jusqu'à 15 €, 10 % de 15 à 20 €, 15 % au-dessus<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Tout le reste<\/td>\n<td>15 %<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Frais d'expédition FBA en France (à l'unité, hors TVA)<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Format (dimensions maximales)<\/th>\n<th>Poids d'expédition<\/th>\n<th>Frais<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Enveloppe standard (33 × 23 × 2,5 cm)<\/td>\n<td>210 g / 460 g<\/td>\n<td>3,33 € / 3,77 €<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Grande enveloppe (33 × 23 × 4 cm)<\/td>\n<td>960 g<\/td>\n<td>4,39 €<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Petit colis (35 × 25 × 12 cm)<\/td>\n<td>150 g / 400 g / 900 g / 1,9 kg / 3,9 kg<\/td>\n<td>4,56 / 5,07 / 5,79 / 6,10 / 7,80 €<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Colis standard (45 × 34 × 26 cm)<\/td>\n<td>400 g / 900 g / 1,9 kg / 3,9 kg / 11,9 kg<\/td>\n<td>5,22 / 6,01 / 6,44 / 7,81 / 9,38 €<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Petit surdimensionné (61 × 46 × 46 cm)<\/td>\n<td>Jusqu'à 760 g<\/td>\n<td>7,05 €, puis 0,20 € par kg<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Poids d'expédition<\/strong> : pour les colis, le plus élevé entre le poids réel et le poids volumétrique (longueur × largeur × hauteur en cm ÷ 5 000, en kg). Les enveloppes utilisent le poids réel.<\/li>\n<li><strong>Prix bas FBA<\/strong> : frais réduits automatiquement pour la plupart des produits vendus 20 € TTC ou moins (12 € dans certaines catégories), petits et légers. Exemple : 2,81 € au lieu de 3,33 € pour une enveloppe standard de 210 g.<\/li>\n<li><strong>Surcharge carburant et logistique<\/strong> : 2 % des frais d'expédition FBA depuis le 2 novembre 2026.<\/li>\n<li><strong>Produits contenant du lithium ou classés dangereux<\/strong> : 0,10 € de plus par unité.<\/li>\n<li><strong>Haute saison<\/strong> : des tarifs majorés s'appliquent du 15 octobre au 14 janvier ; vérifiez-les dans Seller Central.<\/li>\n<\/ul>\n<p><strong>Stockage FBA (par mètre cube et par mois)<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Type<\/th>\n<th>Janvier à septembre<\/th>\n<th>Octobre à décembre<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Format standard, la plupart des catégories<\/td>\n<td>27,54 €<\/td>\n<td>52,20 €<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Format standard, vêtements, chaussures, sacs<\/td>\n<td>19,99 €<\/td>\n<td>29,23 €<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Surdimensionné<\/td>\n<td>21,78 €<\/td>\n<td>34,49 €<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Matières dangereuses, format standard<\/td>\n<td>30,00 €<\/td>\n<td>50,51 €<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Stock ancien<\/strong> : surtaxe à partir de 241 jours en stock (47,99 € par mètre cube et par mois de 241 à 270 jours, jusqu'à 261,97 € au-delà de 455 jours).<\/li>\n<li><strong>Retrait ou destruction<\/strong> : par exemple 0,50 € par unité de moins de 200 g retournée chez vous, 0,74 € pour une destruction.<\/li>\n<li><strong>Remboursement d'un client<\/strong> : Amazon vous rend la commission, moins des frais de gestion de 20 % de cette commission, plafonnés à 5 €.<\/li>\n<li><strong>Taxe française sur les services numériques<\/strong> : Amazon la répercute depuis 2019 sur les frais des vendeurs français vendant sur Amazon.fr, au taux de 3 %. Un relèvement est débattu au Parlement : vérifiez le taux sur vos factures de frais.<\/li>\n<\/ul>\n<h2 id=\"62-les-trois-formules-à-connaître-par-cœur\">6.2 Les trois formules à connaître par cœur<\/h2>\n<div class=\"formula\">Marge nette = (P TTC) ÷ (1 + t) - Achat HT - c × P TTC - FBA - Autres frais - Provision<\/div>\n<div class=\"formula\">Retour sur achat = (Marge nette) ÷ (Achat HT)       Taux de marge = (Marge nette) ÷ (P HT)<\/div>\n<div class=\"formula\">Prix plancher TTC = (Marge minimum + Achat HT + FBA + Autres frais) ÷ ((1) ÷ (1 + t) - c)<\/div>\n<p>Où t est le taux de TVA du pays de vente et c le taux de commission.<\/p>\n<h2 id=\"63-trois-cas-complets\">6.3 Trois cas complets<\/h2>\n<p><strong>Cas A — boîte de rangement (produit simple, FBA, France)<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Ligne<\/th>\n<th>Montant<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Prix de vente<\/td>\n<td>19,99 € TTC, soit 16,66 € HT<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Achat<\/td>\n<td>−6,00 € HT<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Commission 15 %<\/td>\n<td>−3,00 €<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Frais FBA<\/td>\n<td>−3,80 €<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Stockage et transport<\/td>\n<td>−0,40 €<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Marge nette<\/strong><\/td>\n<td><strong>3,46 €<\/strong><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Retour sur achat / taux de marge<\/td>\n<td>58 % / 21 %<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Verdict<\/td>\n<td>Feu vert<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Prix plancher pour garder 2 € de marge : (2 + 6 + 3,80 + 0,40) ÷ (0,8333 − 0,15) = <strong>17,85 € TTC<\/strong>. En dessous, vous ne suivez plus la baisse.<\/p>\n<p><strong>Cas B — mini-aspirateur (produit à panne, FBA, France)<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Ligne<\/th>\n<th>Montant<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Prix de vente<\/td>\n<td>49,99 € TTC, soit 41,66 € HT<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Achat<\/td>\n<td>−18,00 € HT<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Commission 15 %<\/td>\n<td>−7,50 €<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Frais FBA<\/td>\n<td>−5,50 €<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Stockage et transport<\/td>\n<td>−0,80 €<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Provision retours 8 % du HT<\/td>\n<td>−3,33 €<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Marge nette<\/strong><\/td>\n<td><strong>6,53 €<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Retour sur achat / taux de marge<\/td>\n<td>36 % / 16 %<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Verdict<\/td>\n<td>Feu orange : marge suffisante mais retour sous 50 %. Négocier l'achat à 14 € HT le ferait passer au vert.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Cas C — parasol lourd (FBM, France)<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Ligne<\/th>\n<th>Montant<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Prix de vente<\/td>\n<td>69,99 € TTC, soit 58,33 € HT<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Achat<\/td>\n<td>−25,00 € HT<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Commission 15 %<\/td>\n<td>−10,50 €<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Expédition par transporteur<\/td>\n<td>−12,00 €<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Emballage<\/td>\n<td>−1,00 €<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Marge nette<\/strong><\/td>\n<td><strong>9,83 €<\/strong><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Retour sur achat / taux de marge<\/td>\n<td>39 % / 17 %<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Verdict<\/td>\n<td>Feu vert, mais saisonnier : n'acheter qu'au printemps<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"64-les-pièges-qui-mangent-la-marge\">6.4 Les pièges qui mangent la marge<\/h2>\n<ul>\n<li><strong>Le prix du jour<\/strong> au lieu du prix bas sur 90 jours.<\/li>\n<li><strong>Le poids volumétrique<\/strong> : un produit léger mais encombrant change de tranche FBA.<\/li>\n<li><strong>Les lots<\/strong> : la fiche vend un pack de 3, vous avez calculé avec une unité.<\/li>\n<li><strong>Les retours<\/strong> : 2 à 5 % pour un produit simple, 5 à 15 % pour l'électronique ou l'habillement.<\/li>\n<li><strong>Le stock dormant<\/strong> : chaque mois de stockage supplémentaire, et la surtaxe longue durée.<\/li>\n<li><strong>Les petits prix<\/strong> : sous 10 € TTC, les frais fixes FBA absorbent presque toute la marge.<\/li>\n<li><strong>La publicité<\/strong> non incluse dans le calcul.<\/li>\n<\/ul>\n<h2 id=\"65-le-compte-de-résultat-mensuel\">6.5 Le compte de résultat mensuel<\/h2>\n<p>Exemple d'un mois à 600 ventes, panier moyen de 18 € TTC, France seule :<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Poste<\/th>\n<th>Montant<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Chiffre d'affaires TTC<\/td>\n<td>10 800 €<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Chiffre d'affaires HT<\/strong><\/td>\n<td><strong>9 000 €<\/strong><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Coût d'achat des produits vendus (5 € HT moyen)<\/td>\n<td>−3 000 €<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Commissions Amazon<\/td>\n<td>−1 620 €<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Frais FBA (3,60 € moyen)<\/td>\n<td>−2 160 €<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Stockage<\/td>\n<td>−120 €<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Transport vers Amazon<\/td>\n<td>−210 €<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Publicité<\/td>\n<td>−300 €<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Retours et pertes (2 % du CA HT)<\/td>\n<td>−180 €<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Abonnement, outils, comptable, assurance<\/td>\n<td>−234 €<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Résultat avant impôt<\/strong><\/td>\n<td><strong>1 176 € (13 % du CA HT)<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Les trois leviers qui font le plus bouger ce résultat : le coût d'achat (négociation, grossistes), le panier moyen (produits plus chers, moins de frais fixes par euro vendu) et le volume.<\/p>\n<h2 id=\"66-le-besoin-de-trésorerie\">6.6 Le besoin de trésorerie<\/h2>\n<p>Vous payez le stock avant de le vendre, et Amazon vous paie environ tous les 14 jours après la vente.<\/p>\n<div class=\"formula\">Trésorerie immobilisée ≈ Achats mensuels × (Délai d&#x27;écoulement (jours) + 20) ÷ (30)<\/div>\n<p>Avec 3 000 € d'achats par mois et 45 jours d'écoulement, comptez environ 6 500 € immobilisés en permanence.<\/p>\n<h2 id=\"exercices\">Exercices<\/h2>\n<ol type=\"1\">\n<li>Refaites les trois cas avec vos propres produits.<\/li>\n<li>Calculez le prix plancher de chacun de vos produits actifs et saisissez-le dans l'outil d'ajustement des prix.<\/li>\n<li>Construisez votre compte de résultat du mois à partir du rapport de paiement Amazon.<\/li>\n<\/ol>\n<h2 id=\"checklist-de-validation\">Checklist de validation<\/h2>\n<ul class=\"task-list\">\n<li><label><input type=\"checkbox\" />Je calcule une marge nette complète avec la TVA en moins de 2 minutes.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Je connais le prix plancher de chaque produit actif.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Je sais lire un rapport de paiement Amazon.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Je produis un compte de résultat mensuel.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Je connais mon besoin de trésorerie.<\/label><\/li>\n<\/ul>\n", "todo": [], "quiz": [["Sur quel prix Amazon calcule-t-il sa commission ?", ["Le prix HT", "Le prix TTC payé par le client", "Votre prix d'achat"], 1, "La commission s'applique au prix total payé par le client."], ["Achat 5 € HT, marge nette 2 €. Le retour sur l'achat est :", ["40 %", "20 %", "2 %"], 0, "2 ÷ 5 = 40 %."], ["À quoi sert le prix plancher ?", ["Ne jamais vendre sous votre marge minimum", "Fixer le prix maximum", "Calculer la TVA"], 0, "Il se saisit comme prix minimum dans l'ajustement automatique."]], "ans": ["Prix TTC ÷ (1 + TVA) − achat HT − commission (sur le prix TTC) − frais FBA − stockage et transport − provision éventuelle. Le calculateur de la formation le fait pour vous. Voir 6.2 et 6.3.", "Prix plancher TTC = (marge minimum + achat HT + FBA + autres frais) ÷ (1 ÷ (1 + TVA) − commission). Saisissez-le comme prix minimum dans l'ajustement automatique des prix. Voir 6.2 et 9.2.", "Seller Central, Rapports, Paiements : chaque virement liste ventes, commissions, frais FBA, remboursements, publicité et stockage. C'est la base de votre marge réelle et de votre comptabilité. Voir 3.7.", "Chiffre d'affaires HT − coût d'achat des produits vendus − commissions − frais FBA − stockage − transport − publicité − retours − frais fixes = résultat. Voir l'exemple du 6.5.", "Trésorerie immobilisée ≈ achats mensuels × (jours d'écoulement + 20) ÷ 30. Exemple : 3 000 € d'achats et 45 jours d'écoulement donnent environ 6 500 €. Voir 6.6."]}, {"id": "m7", "lvl": "Opérationnel", "t": "Mettre une offre en ligne pas à pas", "tag": "Module 7", "min": 40, "lead": "En revente, 95 % de vos mises en ligne consistent à ajouter une offre sur une fiche existante : quelques minutes par produit. Créer une fiche complète n&#x27;est nécessaire que pour un produit absent d&#x27;Amazon ou votre marque propre.", "html": "<h2 id=\"71-ajouter-une-offre-sur-une-fiche-existante\">7.1 Ajouter une offre sur une fiche existante<\/h2>\n<ol type=\"1\">\n<li><strong>Catalogue, Ajouter des produits<\/strong>. Cherchez par code-barres EAN (le plus sûr), par ASIN ou par nom. Depuis l'application Amazon Seller, scannez directement le code-barres.<\/li>\n<li><strong>Vérifiez la correspondance<\/strong> : même marque, même référence, même contenance, même quantité (unité ou lot), même couleur. Une erreur ici provoque des réclamations « produit différent de la description ».<\/li>\n<li><strong>Cliquez sur « Vendre ce produit »<\/strong>. Si un bouton « Demander l'autorisation » apparaît, le produit est restreint (module 3).<\/li>\n<li><strong>Renseignez l'offre<\/strong> :\n<ul>\n<li><strong>SKU<\/strong> : votre référence interne. Adoptez une convention lisible, par exemple <code>FR-DETACH-ACT-0412<\/code> (pays, produit, source, date d'achat). Elle vous permettra de retrouver le prix d'achat de chaque lot.<\/li>\n<li><strong>État<\/strong> : Neuf uniquement si l'article est neuf, intact, dans son emballage d'origine scellé. Sinon, « Occasion — comme neuf » ou autre, avec une note précise.<\/li>\n<li><strong>Prix<\/strong> : prix de la Buy Box ou légèrement au-dessus, jamais sous votre prix plancher.<\/li>\n<li><strong>Prix minimum et maximum<\/strong> : protègent contre les erreurs de saisie et servent à l'ajustement automatique.<\/li>\n<li><strong>Quantité<\/strong> : en FBM, votre stock réel ; en FBA, laissez vide, Amazon l'alimente à réception.<\/li>\n<li><strong>Canal d'expédition<\/strong> : « Amazon expédie et assure le service client » (FBA) ou « J'expédierai cet article moi-même » (FBM).<\/li>\n<\/ul><\/li>\n<li><strong>Enregistrez<\/strong>. En FBM, l'offre est en ligne en quelques minutes. En FBA, elle apparaît comme « Inactive — stock épuisé » jusqu'à la réception de l'envoi (module 8).<\/li>\n<\/ol>\n<h2 id=\"72-ajouter-des-offres-en-masse\">7.2 Ajouter des offres en masse<\/h2>\n<p>Au-delà de 10 produits à la fois, utilisez le modèle de fichier d'Amazon (Catalogue, Ajouter des produits par téléchargement) :<\/p>\n<ol type=\"1\">\n<li>Téléchargez le modèle « offres » (chargement d'offres sur des fiches existantes).<\/li>\n<li>Une ligne par produit : SKU, code-barres ou ASIN, prix, état, quantité, canal d'expédition.<\/li>\n<li>Importez le fichier et lisez le rapport de traitement : il liste les lignes rejetées et la raison.<\/li>\n<\/ol>\n<p>C'est la méthode normale avec un grossiste qui fournit une liste de prix avec codes-barres.<\/p>\n<h2 id=\"73-créer-une-nouvelle-fiche\">7.3 Créer une nouvelle fiche<\/h2>\n<p><strong>Avant de commencer<\/strong>, il vous faut :<\/p>\n<ul>\n<li>Un <strong>code-barres GS1<\/strong> valide (acheté auprès de GS1 France), ou une <strong>exemption de code-barres<\/strong> accordée par Amazon si vous êtes la marque ou si le produit n'en a pas.<\/li>\n<li>Si vous êtes la marque : idéalement le <strong>Brand Registry<\/strong> (module 12).<\/li>\n<li>Les <strong>informations GPSR<\/strong> : fabricant, adresse, personne responsable dans l'UE, avertissements.<\/li>\n<li>Les <strong>photos<\/strong> au bon format et les textes prêts.<\/li>\n<\/ul>\n<p><strong>Les champs d'une fiche<\/strong> :<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Champ<\/th>\n<th>Règle<\/th>\n<th>Exemple<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Catégorie (type de produit)<\/td>\n<td>La plus précise possible : elle détermine la commission et les champs obligatoires<\/td>\n<td>Cuisine et maison, Rangement, Boîtes de rangement<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Titre<\/td>\n<td>Marque + produit + caractéristique clé + taille, couleur ou quantité. Sans majuscules partout, sans prix ni promesse<\/td>\n<td>MaisonFix – Boîtes de rangement empilables avec couvercle, lot de 3, 20 L, transparentes<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Marque<\/td>\n<td>Exactement le nom déposé<\/td>\n<td>MaisonFix<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Image principale<\/td>\n<td>Fond blanc pur, produit seul, 85 % de l'image, 2 000 pixels minimum<\/td>\n<td>Photo studio<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Images secondaires<\/td>\n<td>Usage, dimensions, détails, infographie des bénéfices, contenu du lot<\/td>\n<td>6 à 8 images<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Points clés<\/td>\n<td>5 puces : bénéfice en majuscule courte, puis la preuve<\/td>\n<td>GAIN DE PLACE : empilables jusqu'à 5 hauteurs...<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Description<\/td>\n<td>Texte d'usage, conseils, ou contenu A+ pour les marques<\/td>\n<td>—<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Mots-clés de recherche<\/td>\n<td>Synonymes, termes absents du titre, sans répétition ni marques concurrentes<\/td>\n<td>caisse, bac, organisateur, garage<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Dimensions et poids<\/td>\n<td>Du produit emballé, mesurés réellement<\/td>\n<td>Ils déterminent les frais FBA<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Sécurité et conformité<\/td>\n<td>GPSR, matières dangereuses, âge recommandé<\/td>\n<td>Obligatoires selon la catégorie<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Les étapes<\/strong> : Catalogue, Ajouter des produits, « Je crée une nouvelle fiche produit », choix de la catégorie, remplissage onglet par onglet, enregistrement. Comptez 24 à 48 heures pour que la fiche apparaisse correctement dans la recherche.<\/p>\n<h2 id=\"74-les-variations-tailles-couleurs-contenances\">7.4 Les variations (tailles, couleurs, contenances)<\/h2>\n<p>Une fiche parente regroupe plusieurs fiches enfants : le client choisit la taille ou la couleur sur la même page, et les avis sont cumulés.<\/p>\n<ul>\n<li>Thèmes possibles selon la catégorie : taille, couleur, taille et couleur, contenance, nombre d'unités.<\/li>\n<li>Chaque enfant a son propre code-barres, son prix, son stock.<\/li>\n<li>Ne regroupez jamais des produits différents sous une variation : c'est une violation des règles.<\/li>\n<\/ul>\n<h2 id=\"75-ouvrir-loffre-dans-les-autres-pays\">7.5 Ouvrir l'offre dans les autres pays<\/h2>\n<ul>\n<li>Pour une fiche existante dans un autre pays, l'outil « Créer des offres internationales » copie votre offre avec une règle de prix (par exemple prix français converti, plus 5 %).<\/li>\n<li>Si la fiche n'existe pas dans le pays, créez-la dans la langue locale, ou laissez Amazon la traduire automatiquement puis corrigez au moins le titre et les avertissements.<\/li>\n<li>Vérifiez que la TVA et la REP du pays sont en place avant d'ouvrir.<\/li>\n<\/ul>\n<h2 id=\"76-les-erreurs-fréquentes-et-leurs-solutions\">7.6 Les erreurs fréquentes et leurs solutions<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Message ou situation<\/th>\n<th>Cause<\/th>\n<th>Solution<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>« Vous devez obtenir une autorisation »<\/td>\n<td>Marque ou catégorie restreinte<\/td>\n<td>Factures de grossiste ou abandon du produit<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Offre « supprimée de la recherche »<\/td>\n<td>Champ obligatoire manquant ou mot interdit<\/td>\n<td>Ouvrir l'offre, corriger le champ signalé<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Offre « inactive », prix potentiellement erroné<\/td>\n<td>Prix très éloigné de l'historique<\/td>\n<td>Vérifier et confirmer le prix<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Code-barres déjà associé à un autre produit<\/td>\n<td>Mauvais code ou fiche erronée<\/td>\n<td>Contacter l'assistance vendeur avec photos du code-barres<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Produit différent de la fiche (lot, couleur)<\/td>\n<td>Mauvaise correspondance<\/td>\n<td>Retirer l'offre immédiatement<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Fiche fusionnée ou modifiée par un autre vendeur<\/td>\n<td>Contrôle de la fiche par la marque ou Amazon<\/td>\n<td>Seule la marque enregistrée peut corriger durablement<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"exercices\">Exercices<\/h2>\n<ol type=\"1\">\n<li>Mettez en ligne 5 offres sur des fiches existantes, dont une en FBM et quatre en FBA.<\/li>\n<li>Préparez un fichier d'offres en masse de 10 lignes à partir d'une liste de grossiste.<\/li>\n<li>Rédigez une fiche complète fictive pour un produit de votre future marque.<\/li>\n<\/ol>\n<h2 id=\"checklist-de-validation\">Checklist de validation<\/h2>\n<ul class=\"task-list\">\n<li><label><input type=\"checkbox\" />Je vérifie la correspondance exacte produit-fiche avant chaque offre.<\/label><\/li>\n<li><label><input type=\"checkbox\" />J'utilise une convention de SKU qui retrouve le prix d'achat.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Je sais charger des offres en masse.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Je connais les champs obligatoires d'une nouvelle fiche.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Je sais résoudre les 6 erreurs fréquentes.<\/label><\/li>\n<\/ul>\n", "todo": [], "quiz": [["Pour ajouter une offre sur une fiche existante, la recherche la plus sûre :", ["Par nom", "Par code-barres EAN", "Par photo"], 1, "Le code-barres évite les erreurs de version, de lot ou de couleur."], ["La fiche vend un lot de 3, vous avez une unité. Vous :", ["Ajoutez votre offre quand même", "Ne vendez pas sur cette fiche", "Mettez le prix divisé par 3"], 1, "Produit différent de la fiche = réclamations assurées."], ["Au-delà de 10 produits à mettre en ligne :", ["Le fichier de chargement en masse", "10 saisies manuelles", "Le service client"], 0, "C'est la méthode normale avec une liste de grossiste."]], "ans": ["Même marque, même référence, même contenance, même quantité (unité ou lot) et même couleur que la fiche. Cherchez de préférence par code-barres. Voir 7.1.", "Exemple : FR-DETACH-ACT-0412 (pays, produit, source, date d'achat). La date d'achat permet de retrouver le prix payé pour chaque lot. Voir 7.1.", "Catalogue, Ajouter des produits par téléchargement : modèle « offres », une ligne par produit (SKU, code-barres ou ASIN, prix, état, quantité, expédition), puis lecture du rapport de traitement. Voir 7.2.", "Catégorie, titre, marque, code-barres GS1 (ou exemption), image principale sur fond blanc, points clés, dimensions et poids, informations de sécurité GPSR. Voir 7.3.", "Autorisation demandée, offre supprimée de la recherche, prix potentiellement erroné, code-barres déjà associé, produit différent de la fiche, fiche modifiée par un autre vendeur. Solutions dans le tableau du 7.6."]}, {"id": "m8", "lvl": "Opérationnel", "t": "Logistique FBA et FBM", "tag": "Module 8", "min": 45, "lead": "La logistique est là où l&#x27;on perd de l&#x27;argent sans le voir : envois refusés, unités perdues, frais de non-conformité, stock qui dort. Une procédure rigoureuse et un contrôle systématique des réceptions récupèrent souvent 1 à 3 % du chiffre d&#x27;affaires.", "html": "<h2 id=\"81-léquipement-de-départ\">8.1 L'équipement de départ<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Équipement<\/th>\n<th>Usage<\/th>\n<th>Budget<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Imprimante d'étiquettes thermique<\/td>\n<td>Étiquettes produit et carton<\/td>\n<td>100 à 200 €<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Étiquettes adhésives (format adapté)<\/td>\n<td>Codes FNSKU<\/td>\n<td>Quelques euros le rouleau<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Pistolet à ruban adhésif et ruban<\/td>\n<td>Fermeture des cartons<\/td>\n<td>20 à 40 €<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Cartons doubles cannelures neufs<\/td>\n<td>Envois FBA<\/td>\n<td>1 à 2 € l'unité<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Sachets plastiques avec avertissement, film bulle<\/td>\n<td>Préparation<\/td>\n<td>30 à 60 €<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Balance et mètre<\/td>\n<td>Poids et dimensions des cartons<\/td>\n<td>30 à 50 €<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Espace de stockage<\/td>\n<td>Lots en attente d'envoi<\/td>\n<td>Garage ou local<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"82-les-règles-de-préparation-fba\">8.2 Les règles de préparation FBA<\/h2>\n<ul>\n<li><strong>Étiquetage<\/strong> : chaque produit porte soit l'étiquette Amazon (FNSKU) qui recouvre l'ancien code-barres, soit son code-barres fabricant si vous avez choisi cette option. L'étiquette Amazon est recommandée : elle rattache chaque unité à votre stock.<\/li>\n<li><strong>Un seul code-barres lisible<\/strong> par unité : masquez les autres.<\/li>\n<li><strong>Sachets<\/strong> pour les articles en tissu, en peluche ou en vrac, avec la mention d'avertissement d'étouffement si l'ouverture dépasse une certaine taille.<\/li>\n<li><strong>Lots<\/strong> : film ou sachet, avec l'étiquette « Vendu par lot, ne pas séparer ».<\/li>\n<li><strong>Fragile<\/strong> : film bulle ou carton individuel.<\/li>\n<li><strong>Liquides<\/strong> : bouchon scellé et sachet.<\/li>\n<li><strong>Dates de péremption<\/strong> : produits concernés exclus de votre activité.<\/li>\n<\/ul>\n<h2 id=\"83-créer-un-envoi-étape-par-étape\">8.3 Créer un envoi, étape par étape<\/h2>\n<ol type=\"1\">\n<li><strong>Inventaire, Envoyer au stock Amazon<\/strong>. Choisissez les SKU et les quantités.<\/li>\n<li><strong>Indiquez la préparation<\/strong> et qui étiquette (vous, ou Amazon contre paiement).<\/li>\n<li><strong>Déclarez le conditionnement<\/strong> : un SKU par carton (le plus simple) ou cartons mixtes, avec poids et dimensions de chaque carton.<\/li>\n<li><strong>Choisissez l'option de placement<\/strong> : Amazon propose une répartition sur un ou plusieurs entrepôts, parfois contre des frais pour un envoi unique.<\/li>\n<li><strong>Choisissez le transport<\/strong> : transporteur partenaire d'Amazon (tarif négocié, suivi automatique) ou votre transporteur.<\/li>\n<li><strong>Imprimez et collez les étiquettes de carton<\/strong> sur le dessus, sans les plier, une par carton.<\/li>\n<li><strong>Palette<\/strong> : 4 étiquettes de palette, hauteur et poids dans les limites indiquées dans Seller Central, rendez-vous de livraison pris par le transporteur.<\/li>\n<li><strong>Remettez au transporteur<\/strong> et saisissez les numéros de suivi si le transporteur n'est pas partenaire.<\/li>\n<\/ol>\n<p><strong>Limites des cartons<\/strong> : en général 23 kg et 63,5 cm de côté maximum (au-delà, mentions obligatoires de colis lourd). Vérifiez les règles en vigueur dans Seller Central.<\/p>\n<h2 id=\"84-contrôler-la-réception\">8.4 Contrôler la réception<\/h2>\n<ul>\n<li>Un envoi passe par les statuts : en transit, livré, enregistré, en réception, clôturé.<\/li>\n<li>Comparez systématiquement les quantités reçues aux quantités envoyées.<\/li>\n<li>En cas d'écart, ouvrez un rapprochement depuis l'envoi, avec la preuve de livraison et le détail des cartons, dans les délais indiqués (quelques semaines après la livraison).<\/li>\n<\/ul>\n<h2 id=\"85-récupérer-largent-perdu-remboursements-fba\">8.5 Récupérer l'argent perdu (remboursements FBA)<\/h2>\n<p>Amazon perd ou abîme régulièrement des unités en entrepôt, rembourse un client sans récupérer le produit, ou mesure mal un colis.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Situation<\/th>\n<th>Où le voir<\/th>\n<th>Action<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Unités perdues ou endommagées en entrepôt<\/td>\n<td>Rapport d'ajustement d'inventaire<\/td>\n<td>Amazon rembourse souvent automatiquement ; vérifiez<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Client remboursé, produit non retourné<\/td>\n<td>Rapport des remboursements et des retours<\/td>\n<td>Réclamation après le délai de retour<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Retour remis en stock abîmé<\/td>\n<td>Rapport des retours<\/td>\n<td>Demande de remboursement<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Frais FBA trop élevés (mauvaises dimensions)<\/td>\n<td>Rapport de prévisualisation des frais<\/td>\n<td>Demande de nouvelle mesure<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Des services spécialisés font ce travail contre un pourcentage des sommes récupérées : intéressants au-delà de quelques milliers d'euros de ventes mensuelles.<\/p>\n<h2 id=\"86-limites-de-stockage-et-performance-dinventaire\">8.6 Limites de stockage et performance d'inventaire<\/h2>\n<ul>\n<li>Amazon fixe une <strong>capacité de stockage<\/strong> par compte, en volume, plus faible pour un compte neuf. Elle augmente avec les ventes.<\/li>\n<li>L'<strong>indicateur de performance d'inventaire<\/strong> récompense le stock qui tourne et pénalise le stock dormant.<\/li>\n<li>Planifiez les envois de fin d'année tôt : les délais de réception s'allongent fortement de mi-octobre à décembre.<\/li>\n<\/ul>\n<h2 id=\"87-gérer-le-stock\">8.7 Gérer le stock<\/h2>\n<div class=\"formula\">Point de commande = Ventes par jour × (Délai fournisseur + Délai de réception Amazon + 14)<\/div>\n<ul>\n<li><strong>Couverture cible<\/strong> : 30 à 60 jours de ventes en stock FBA.<\/li>\n<li><strong>Stock dormant<\/strong> au-delà de 90 jours : baisse de prix, promotion, liquidation Amazon, ou retrait vers vous avant la surtaxe longue durée.<\/li>\n<li><strong>Ruptures<\/strong> : elles font chuter le classement. Un réapprovisionnement en retard coûte plus cher qu'un léger surstock.<\/li>\n<\/ul>\n<ul>\n<li><strong>Taux de vente<\/strong> (indicateur d'Amazon) : unités vendues sur les 90 derniers jours ÷ unités en stock. Plus il est haut, mieux votre stock tourne.<\/li>\n<li><strong>Indice de performance de stock (IPI)<\/strong> : note calculée par Amazon à partir des ventes, du stock excédentaire et du stock disponible. Un indice faible réduit votre capacité de stockage. Suivez-le dans Inventaire, Tableau de bord de planification du stock.<\/li>\n<li><strong>Outil de réapprovisionnement<\/strong> d'Amazon : il propose les quantités à renvoyer pour chaque produit, à comparer avec votre propre point de commande.<\/li>\n<\/ul>\n<h2 id=\"88-lexpédition-par-vos-soins-fbm\">8.8 L'expédition par vos soins (FBM)<\/h2>\n<ul>\n<li>Délai d'expédition promis de 1 à 2 jours ouvrés, respecté à 100 %.<\/li>\n<li>Numéro de suivi valide sur chaque colis.<\/li>\n<li>Comptes professionnels chez les transporteurs ou un agrégateur (Boxtal, Sendcloud, Packlink) : jusqu'à 30 % sous les tarifs publics.<\/li>\n<li>Programme « Prime expédié par le vendeur » : possible plus tard, avec des exigences de livraison très strictes.<\/li>\n<li>Retours : acceptez-les sans discuter, dans les délais Amazon, et contrôlez l'état avant remise en vente.<\/li>\n<\/ul>\n<h2 id=\"89-les-prestataires-de-préparation\">8.9 Les prestataires de préparation<\/h2>\n<p>Un prestataire de préparation (« prep center ») reçoit les marchandises de vos fournisseurs, les contrôle, les étiquette et les envoie chez Amazon. Comptez environ 0,50 à 1,50 € par unité. Il devient rentable quand votre temps vaut plus que ce coût, ou dès que vous achetez chez des grossistes éloignés.<\/p>\n<h2 id=\"810-les-programmes-fba-à-connaître\">8.10 Les programmes FBA à connaître<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Programme<\/th>\n<th>Ce qu'il apporte<\/th>\n<th>Conditions<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Nouveau programme de sélection<\/td>\n<td>Stockage mensuel gratuit pendant 120 jours (100 unités par produit parent en format standard), retraits et liquidations gratuits pendant 180 jours, remise moyenne de 10 % sur les ventes des nouveaux produits, 25 % de réduction sur l'inscription Vine<\/td>\n<td>Produits nouveaux en FBA, compte Professionnel, inscription avant le premier envoi<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Prix bas FBA<\/td>\n<td>Frais d'expédition réduits (environ 0,45 € de moins par unité en moyenne)<\/td>\n<td>Automatique pour les produits petits et légers vendus 20 € TTC ou moins (12 € dans certaines catégories)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Transporteur partenaire<\/td>\n<td>Tarifs négociés pour envoyer vers les entrepôts, suivi automatique ; 90 € de crédits pour les nouveaux vendeurs<\/td>\n<td>Choisi lors de la création de l'envoi<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Abonnez-vous et économisez<\/td>\n<td>Ventes récurrentes de produits de consommation courante<\/td>\n<td>Produits éligibles, à étudier plus tard<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Le nouveau programme de sélection est très intéressant pour vos tests : un premier lot qui dort quelques semaines ne coûte presque rien en stockage.<\/p>\n<h2 id=\"811-lexpédition-par-vos-soins-niveau-avancé\">8.11 L'expédition par vos soins, niveau avancé<\/h2>\n<ul>\n<li><strong>Achat d'expédition<\/strong> dans Seller Central : étiquettes des grands transporteurs à tarifs négociés, jusqu'à 100 commandes d'un coup, confirmation et suivi automatiques. Si vous expédiez à temps avec cet outil, vous êtes protégé contre les réclamations A à Z liées à la livraison.<\/li>\n<li><strong>Délai de livraison<\/strong> = délai de préparation + délai de transport. Utilisez les modèles d'expédition avec des zones et des délais réalistes : une évaluation négative pour retard peut alors être retirée si vous avez expédié à temps.<\/li>\n<li><strong>Retours<\/strong> : Amazon approuve automatiquement les retours conformes à sa politique ; les autres demandes doivent recevoir une réponse sous 24 heures. Une étiquette de retour prépayée (ou un remboursement sans retour) est obligatoire.<\/li>\n<li><strong>Prime expédié par le vendeur<\/strong> : badge Prime sur vos expéditions, avec livraison en 1 jour sans frais pour les clients Prime, après une période d'essai et des exigences de performance élevées (dont l'achat d'expédition sur au moins 98 % des commandes). À envisager plus tard.<\/li>\n<\/ul>\n<h2 id=\"812-lexpédition-multicanal\">8.12 L'expédition multicanal<\/h2>\n<p>Votre stock FBA peut aussi servir les commandes de vos autres canaux : votre site, Cdiscount, les réseaux sociaux. Amazon prépare et livre en emballage neutre, sans logo Amazon (hors vêtements, chaussures et colis de plus de 9 kg ou de grandes dimensions), en 1 à 2 ou 2 à 3 jours ouvrés. Des extensions existent pour Shopify et WooCommerce, et une réduction de 20 % sur les frais d'expédition s'applique aux vendeurs éligibles.<\/p>\n<h2 id=\"exercices\">Exercices<\/h2>\n<ol type=\"1\">\n<li>Préparez et expédiez un envoi FBA de 50 à 100 unités en respectant chaque règle.<\/li>\n<li>Après réception, comparez quantités envoyées et reçues.<\/li>\n<li>Calculez le point de commande de vos 5 meilleurs produits.<\/li>\n<\/ol>\n<h2 id=\"checklist-de-validation\">Checklist de validation<\/h2>\n<ul class=\"task-list\">\n<li><label><input type=\"checkbox\" />Je prépare un envoi sans refus ni frais de non-conformité.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Je contrôle chaque réception.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Je consulte chaque mois les rapports d'ajustement et de remboursement.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Je connais le point de commande de chaque produit actif.<\/label><\/li>\n<\/ul>\n", "todo": [], "quiz": [["Pouvez-vous choisir l'entrepôt FBA de destination ?", ["Oui, le plus proche", "Non, Amazon l'attribue", "Oui, avec un abonnement"], 1, "Amazon désigne l'entrepôt à la création de l'envoi."], ["Amazon a reçu moins d'unités que vous n'en avez envoyées :", ["On l'accepte", "Rapprochement depuis l'envoi, avec preuves", "On ouvre un autre compte"], 1, "Dans les délais indiqués, avec preuve de livraison et détail des cartons."], ["5 ventes par jour, délai fournisseur 10 jours, réception Amazon 7 jours. Point de commande ?", ["155 unités", "50 unités", "35 unités"], 0, "5 × (10 + 7 + 14) = 155."]], "ans": ["Une étiquette lisible par unité, anciens codes masqués, sachets et film bulle si nécessaire, lots attachés, cartons sous 23 kg, une étiquette de carton sur le dessus, photos avant envoi. Voir 8.2, 8.3 et la checklist C des annexes.", "Dans l'envoi, comparez quantités envoyées et reçues. En cas d'écart, ouvrez un rapprochement avec preuve de livraison et détail des cartons, dans les délais. Voir 8.4.", "Rapport d'ajustement d'inventaire (unités perdues ou abîmées), rapport des remboursements et des retours (client remboursé sans retour). Réclamez ce qui n'est pas remboursé. Voir 8.5.", "Ventes par jour × (délai fournisseur + délai de réception Amazon + 14 jours). Exemple : 5 × (10 + 7 + 14) = 155 unités. Voir 8.7."]}, {"id": "m9", "lvl": "Croissance", "t": "Buy Box, prix et référencement", "tag": "Module 9", "min": 40, "lead": "Sur une fiche partagée, le prix et la Buy Box décident de vos ventes. Sur vos propres fiches, c&#x27;est le référencement et la conversion. Ce module couvre les deux, avec les réglages concrets.", "html": "<h2 id=\"91-la-stratégie-de-prix-sur-une-fiche-partagée\">9.1 La stratégie de prix sur une fiche partagée<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Situation<\/th>\n<th>Stratégie<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Vous êtes seul ou presque en FBA<\/td>\n<td>Prix légèrement sous le vendeur FBM le plus bas, ou au niveau du prix moyen 90 jours<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>2 à 5 vendeurs FBA proches<\/td>\n<td>S'aligner sur la Buy Box, partager les ventes<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Un vendeur casse les prix<\/td>\n<td>Ne pas le suivre sous votre plancher, attendre qu'il écoule son stock<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Amazon revient en stock<\/td>\n<td>Rester au prix plancher si la marge le permet, sinon ne pas réapprovisionner<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Stock dormant<\/td>\n<td>Baisser progressivement, jusqu'à 2 à 5 % au-dessus du plancher<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Rupture chez les concurrents<\/td>\n<td>Remonter le prix par paliers de 3 à 5 %<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"92-lajustement-automatique-des-prix\">9.2 L'ajustement automatique des prix<\/h2>\n<p>L'outil gratuit d'Amazon (Prix, Ajuster automatiquement les prix) fonctionne par règles :<\/p>\n<ol type=\"1\">\n<li><strong>Créez une règle « Buy Box »<\/strong> : rester au prix de la Buy Box, ou 0,01 € en dessous.<\/li>\n<li><strong>Rattachez-y vos SKU<\/strong> avec, pour chacun, son prix minimum (votre plancher, module 6) et son prix maximum.<\/li>\n<li><strong>Créez une règle séparée<\/strong> pour les produits sans concurrence : prix fixe ou basé sur l'historique.<\/li>\n<li><strong>Vérifiez chaque semaine<\/strong> les SKU bloqués au prix minimum : c'est le signal d'une guerre des prix.<\/li>\n<\/ol>\n<p>Les outils payants (BQool, Aura, Seller Snap et similaires) ajoutent des stratégies plus fines : remontée automatique quand les concurrents sont en rupture, prix différents selon le type de concurrent. Utiles au-delà de 200 références.<\/p>\n<h2 id=\"93-le-référencement-dune-fiche-vos-fiches\">9.3 Le référencement d'une fiche (vos fiches)<\/h2>\n<p>La recherche d'Amazon indexe le titre, les points clés, la marque, les mots-clés cachés et certains attributs. Elle classe ensuite selon la conversion et les ventes.<\/p>\n<p><strong>La recherche de mots-clés<\/strong> :<\/p>\n<ol type=\"1\">\n<li>Tapez le nom du produit dans la barre de recherche Amazon : notez les suggestions automatiques.<\/li>\n<li>Analysez les titres des 10 premiers concurrents.<\/li>\n<li>Utilisez le rapport de termes de recherche de la publicité (module 10) : il montre ce que tapent vraiment les acheteurs.<\/li>\n<li>Avec le Brand Registry, le tableau de bord des requêtes de recherche donne le volume de chaque requête.<\/li>\n<li>Un outil comme Helium 10 donne les volumes estimés par pays.<\/li>\n<\/ol>\n<p><strong>Où placer les mots-clés<\/strong> :<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Emplacement<\/th>\n<th>Ce qui y va<\/th>\n<th>Poids<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Titre<\/td>\n<td>Les 2 à 3 mots-clés principaux, au début<\/td>\n<td>Très fort<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Points clés<\/td>\n<td>Mots-clés secondaires, dans des phrases naturelles<\/td>\n<td>Fort<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Mots-clés cachés (backend)<\/td>\n<td>Synonymes, variantes, fautes courantes, autres langues<\/td>\n<td>Moyen<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Description et A+<\/td>\n<td>Contenu pour convaincre ; faible pour la recherche<\/td>\n<td>Faible<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Attributs (couleur, matière, usage)<\/td>\n<td>Toujours remplis : ils alimentent les filtres<\/td>\n<td>Fort pour les filtres<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"94-les-images-qui-convertissent\">9.4 Les images qui convertissent<\/h2>\n<ol type=\"1\">\n<li><strong>Image principale<\/strong> : fond blanc pur, produit seul, net, qui occupe l'image. C'est elle qui fait cliquer.<\/li>\n<li><strong>Produit en situation<\/strong> d'usage réel.<\/li>\n<li><strong>Infographie des bénéfices<\/strong> : 3 à 4 avantages, gros texte lisible sur téléphone.<\/li>\n<li><strong>Dimensions<\/strong> avec un objet de référence.<\/li>\n<li><strong>Détails<\/strong> : matière, finitions, fonctionnalités.<\/li>\n<li><strong>Contenu du lot<\/strong> : tout ce que reçoit le client.<\/li>\n<li><strong>Comparaison<\/strong> avec un produit classique, ou garantie et service.<\/li>\n<li><strong>Vidéo<\/strong> de 30 à 60 secondes, si possible.<\/li>\n<\/ol>\n<p>La majorité des visites se fait sur téléphone : vérifiez la lisibilité de chaque image sur un petit écran.<\/p>\n<h2 id=\"95-le-contenu-a-et-la-vitrine-de-marque\">9.5 Le contenu A+ et la vitrine de marque<\/h2>\n<ul>\n<li>Réservés aux marques enregistrées (module 12).<\/li>\n<li>Le contenu A+ remplace la description par des modules visuels : il améliore la conversion et réduit les retours en clarifiant le produit.<\/li>\n<li>La vitrine de marque (Store) est une mini-boutique sur Amazon, utile pour la publicité Sponsored Brands.<\/li>\n<\/ul>\n<h2 id=\"96-les-avis-clients\">9.6 Les avis clients<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Méthode<\/th>\n<th>Autorisée<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Bouton « Demander un avis » dans la commande (4 à 30 jours après livraison)<\/td>\n<td>Oui<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Outil qui envoie automatiquement cette demande officielle<\/td>\n<td>Oui<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Programme Vine (unités gratuites à des testeurs choisis par Amazon)<\/td>\n<td>Oui, marques enregistrées<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Encart dans le colis qui demande un avis neutre<\/td>\n<td>Oui, sans incitation ni orientation<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Remise, remboursement ou cadeau contre un avis<\/td>\n<td>Non<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Demander un avis positif ou filtrer les clients satisfaits<\/td>\n<td>Non<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Avis de la famille, d'amis ou d'échanges d'avis<\/td>\n<td>Non, fermeture possible du compte<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Répondre aux avis négatifs<\/strong> : vous ne pouvez pas les faire supprimer, sauf s'ils violent les règles (insulte, avis sur la livraison FBA, avis sur un autre produit). Utilisez-les pour corriger le produit, la fiche ou l'emballage.<\/p>\n<h2 id=\"97-les-évaluations-de-vendeur\">9.7 Les évaluations de vendeur<\/h2>\n<p>Distinctes des avis produit, elles notent votre service. En FBA, Amazon barre les évaluations négatives liées à la livraison. Demandez la suppression d'une évaluation qui concerne le produit et non le vendeur.<\/p>\n<h2 id=\"98-vendre-aux-professionnels-amazon-business\">9.8 Vendre aux professionnels (Amazon Business)<\/h2>\n<p>Avec un compte Professionnel, vos offres sont automatiquement visibles par les clients professionnels d'Amazon Business : entreprises, écoles, collectivités. Selon Amazon, ils commandent en moyenne 75 % d'unités de plus par commande et retournent 30 % de produits en moins.<\/p>\n<ul>\n<li><strong>Prix professionnels<\/strong> : un prix plus bas visible uniquement par les clients professionnels.<\/li>\n<li><strong>Remises sur quantité<\/strong> : prix dégressif selon le nombre d'unités (par exemple −3 % dès 5 unités, −6 % dès 20).<\/li>\n<li><strong>Factures avec TVA<\/strong> : le service de calcul de TVA (module 3.3) affiche le badge « Facture avec TVA téléchargeable », indispensable pour les acheteurs professionnels.<\/li>\n<li><strong>Frais réduits<\/strong> : les commandes professionnelles de plusieurs unités avec au moins 3 % de remise peuvent bénéficier de frais de vente et de frais FBA réduits en France, en Allemagne, en Italie et en Espagne.<\/li>\n<\/ul>\n<p>Les produits de bureau, l'outillage, l'entretien et le rangement se prêtent bien à ces ventes. Activez les fonctions professionnelles dans Seller Central dès que vos premiers produits sont en ligne.<\/p>\n<h2 id=\"exercices\">Exercices<\/h2>\n<ol type=\"1\">\n<li>Paramétrez une règle d'ajustement automatique et rattachez-y tous vos SKU avec leurs prix minimum et maximum.<\/li>\n<li>Pour une fiche de votre future marque, réalisez la recherche de mots-clés et rédigez titre, 5 points clés et mots-clés cachés.<\/li>\n<li>Analysez les avis négatifs de 3 concurrents et listez les défauts récurrents.<\/li>\n<\/ol>\n<h2 id=\"checklist-de-validation\">Checklist de validation<\/h2>\n<ul class=\"task-list\">\n<li><label><input type=\"checkbox\" />Chaque SKU a un prix minimum et maximum dans l'outil d'ajustement.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Je sais choisir une stratégie de prix selon la situation de la fiche.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Je sais rédiger un titre et des points clés optimisés.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Je connais les 8 images d'une fiche qui convertit.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Je ne fais aucune pratique d'avis interdite.<\/label><\/li>\n<\/ul>\n", "todo": [], "quiz": [["Un concurrent descend sous votre prix plancher :", ["Vous le suivez", "Vous attendez qu'il vide son stock", "Vous signalez son offre"], 1, "Suivre sous le plancher, c'est vendre à perte."], ["Laquelle de ces pratiques d'avis est autorisée ?", ["Rembourser un client contre un avis 5 étoiles", "Le bouton « Demander un avis »", "Faire noter par la famille"], 1, "Seuls les outils officiels et Vine sont autorisés."], ["Où placer les mots-clés principaux d'une fiche ?", ["Au début du titre", "Dans la description seulement", "Nulle part"], 0, "Le titre a le plus de poids pour la recherche."]], "ans": ["Prix, Ajuster automatiquement les prix : une règle « Buy Box », chaque SKU rattaché avec son prix minimum (le prix plancher du 6.2) et son prix maximum. Voir 9.2.", "Seul : sous le moins cher en FBM ou au prix moyen. Plusieurs FBA : aligné sur la Buy Box. Casseur de prix : ne pas le suivre sous le plancher. Amazon revient : plancher ou pas de réassort. Stock dormant : baisse progressive. Concurrents en rupture : hausse par paliers. Voir 9.1.", "Titre : marque + produit + caractéristique clé + taille ou quantité, mots-clés principaux au début. Points clés : le bénéfice d'abord, puis la preuve, avec les mots-clés secondaires. Voir 9.3 et 7.3.", "1. Principale sur fond blanc. 2. En situation. 3. Infographie des bénéfices. 4. Dimensions. 5. Détails. 6. Contenu du lot. 7. Comparaison ou garantie. 8. Vidéo. Voir 9.4.", "Autorisé : bouton « Demander un avis », outil qui l'automatise, programme Vine, encart neutre dans le colis. Interdit : contrepartie contre un avis, demander un avis positif, avis de la famille ou échanges d'avis. Voir 9.6."]}, {"id": "m10", "lvl": "Croissance", "t": "Publicité Amazon Ads", "tag": "Module 10", "min": 40, "lead": "La publicité achète de la visibilité immédiate et nourrit le classement naturel. Bien menée, elle se rembourse ; mal menée, elle mange toute la marge en quelques semaines. Elle sert surtout vos fiches exclusives et votre marque propre : sur une fiche partagée, votre annonce ne s&#x27;affiche que si vous détenez la Buy Box.", "html": "<h2 id=\"101-les-formats\">10.1 Les formats<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Format<\/th>\n<th>Emplacement<\/th>\n<th>Ciblage<\/th>\n<th>Accès<\/th>\n<th>Rôle<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Sponsored Products<\/td>\n<td>Dans les résultats et sur les fiches<\/td>\n<td>Mots-clés, produits, catégories<\/td>\n<td>Tout vendeur Professionnel<\/td>\n<td>Ventes directes, 70 à 80 % du budget<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Sponsored Brands<\/td>\n<td>Bannière en tête de résultats, avec logo et plusieurs produits, ou vidéo<\/td>\n<td>Mots-clés, produits<\/td>\n<td>Marques enregistrées<\/td>\n<td>Notoriété, recherches de marque<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Sponsored Display<\/td>\n<td>Fiches, page d'accueil, hors Amazon<\/td>\n<td>Audiences, reciblage des visiteurs<\/td>\n<td>Marques enregistrées<\/td>\n<td>Relance, défense de vos fiches<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"102-les-indicateurs\">10.2 Les indicateurs<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Indicateur<\/th>\n<th>Formule<\/th>\n<th>Lecture<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>CTR (taux de clic)<\/td>\n<td>Clics ÷ impressions<\/td>\n<td>Sous 0,3 % : image principale, prix ou titre peu attractifs<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>CPC (coût par clic)<\/td>\n<td>Dépenses ÷ clics<\/td>\n<td>Dépend de la concurrence sur le mot-clé<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Taux de conversion<\/td>\n<td>Commandes ÷ clics<\/td>\n<td>Sous 8 % : fiche, prix ou avis à améliorer<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>ACOS<\/td>\n<td>Dépenses ÷ ventes publicitaires<\/td>\n<td>À comparer à votre marge avant publicité<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>ROAS<\/td>\n<td>Ventes publicitaires ÷ dépenses<\/td>\n<td>Inverse de l'ACOS<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>TACOS<\/td>\n<td>Dépenses ÷ ventes totales<\/td>\n<td>Santé globale ; doit baisser dans le temps<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"formula\">ACOS d&#x27;équilibre = (Marge nette avant publicité) ÷ (Prix de vente TTC)<\/div>\n<p>Exemple : marge de 6 € sur un produit à 24 € TTC, ACOS d'équilibre de 25 %. Une campagne à 20 % d'ACOS rapporte ; à 30 %, elle coûte, sauf en phase de lancement.<\/p>\n<h2 id=\"103-la-structure-de-campagnes\">10.3 La structure de campagnes<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Campagne<\/th>\n<th>Type de ciblage<\/th>\n<th>Objectif<\/th>\n<th>Budget de départ<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Automatique<\/td>\n<td>Amazon choisit les recherches<\/td>\n<td>Découvrir les recherches qui convertissent<\/td>\n<td>10 à 15 € par jour<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Manuelle « exacte »<\/td>\n<td>Mots-clés validés, correspondance exacte<\/td>\n<td>Rentabilité maximale<\/td>\n<td>60 % du budget une fois en place<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Manuelle « expression » ou « large »<\/td>\n<td>Variantes des mots-clés<\/td>\n<td>Découverte contrôlée<\/td>\n<td>20 %<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Ciblage produit<\/td>\n<td>ASIN concurrents<\/td>\n<td>Capter les clients d'autres fiches<\/td>\n<td>10 à 20 %<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Ciblage de vos propres ASIN<\/td>\n<td>Vos fiches<\/td>\n<td>Défendre vos pages contre la concurrence<\/td>\n<td>Faible<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Le cycle de récolte<\/strong> :<\/p>\n<ol type=\"1\">\n<li>Semaines 1 et 2 : campagne automatique seule.<\/li>\n<li>Chaque recherche qui a généré au moins 2 ventes sous l'ACOS cible passe en campagne exacte.<\/li>\n<li>Elle est ajoutée en mot-clé négatif exact dans la campagne automatique, pour éviter que les deux campagnes ne se concurrencent.<\/li>\n<li>Les recherches qui coûtent sans vendre (par exemple 15 clics, 0 vente) deviennent des mots-clés négatifs.<\/li>\n<\/ol>\n<h2 id=\"104-les-enchères\">10.4 Les enchères<\/h2>\n<div class=\"formula\">Enchère cible = Prix TTC × Taux de conversion × ACOS cible<\/div>\n<p>Exemple : produit à 24 €, conversion de 10 %, ACOS cible de 20 %, enchère cible de 24 × 0,10 × 0,20 = 0,48 €.<\/p>\n<ul>\n<li><strong>Stratégie d'enchère<\/strong> : « dynamique, baisse uniquement » pour commencer, la plus prudente.<\/li>\n<li><strong>Ajustement par emplacement<\/strong> : augmentez l'enchère de 20 à 50 % sur le haut de la première page si cet emplacement convertit mieux.<\/li>\n<\/ul>\n<h2 id=\"105-la-routine-hebdomadaire\">10.5 La routine hebdomadaire<\/h2>\n<ol type=\"1\">\n<li>Exporter le rapport des termes de recherche des 14 derniers jours.<\/li>\n<li>Promouvoir les recherches gagnantes en exact.<\/li>\n<li>Ajouter les négatifs.<\/li>\n<li>Baisser de 10 à 20 % les enchères au-dessus de l'ACOS cible, monter de 10 % celles en dessous avec peu d'impressions.<\/li>\n<li>Couper les mots-clés sans vente après un nombre de clics égal à 2 fois l'inverse du taux de conversion.<\/li>\n<li>Ne jamais juger une modification avant 7 jours : Amazon attribue les ventes avec retard.<\/li>\n<\/ol>\n<h2 id=\"106-la-publicité-selon-la-phase\">10.6 La publicité selon la phase<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Phase<\/th>\n<th>ACOS accepté<\/th>\n<th>Objectif<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Lancement d'un produit de marque (4 à 8 semaines)<\/td>\n<td>Au-dessus de l'équilibre<\/td>\n<td>Ventes, avis, classement<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Croissance<\/td>\n<td>Proche de l'équilibre<\/td>\n<td>Part de marché<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Rentabilité<\/td>\n<td>Sous l'équilibre, TACOS sous 10 %<\/td>\n<td>Marge<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Fiche partagée en revente<\/td>\n<td>Très bas, ou pas de publicité<\/td>\n<td>Ne pas perdre d'argent<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"107-conditions-et-crédits-publicitaires\">10.7 Conditions et crédits publicitaires<\/h2>\n<ul>\n<li><strong>Sponsored Products<\/strong> n'affiche votre annonce que si votre offre est éligible à l'offre en vedette (la Buy Box). Pas de publicité pour les produits d'occasion ou reconditionnés.<\/li>\n<li><strong>Sponsored Brands, Sponsored Display et la vitrine de marque<\/strong> demandent le Brand Registry et passent une modération ; Sponsored Products s'affiche immédiatement.<\/li>\n<li><strong>Paiement<\/strong> : les dépenses sont prélevées sur votre solde vendeur, puis sur la carte bancaire si le solde ne suffit pas. Le plafond de la carte augmente par paliers (50, 150, 200, 350 puis 500 €).<\/li>\n<li><strong>Crédits nouveaux vendeurs<\/strong> : jusqu'à 850 € en Sponsored Products (module 3.9), à utiliser avant expiration.<\/li>\n<li><strong>Ressources gratuites<\/strong> : webinaires publicitaires en direct et vidéos de la Seller University d'Amazon.<\/li>\n<\/ul>\n<h2 id=\"exercices\">Exercices<\/h2>\n<ol type=\"1\">\n<li>Calculez l'ACOS d'équilibre et l'enchère cible de 3 produits.<\/li>\n<li>Lancez une campagne automatique sur votre meilleur produit exclusif et appliquez la routine pendant 4 semaines.<\/li>\n<\/ol>\n<h2 id=\"checklist-de-validation\">Checklist de validation<\/h2>\n<ul class=\"task-list\">\n<li><label><input type=\"checkbox\" />Je connais l'ACOS d'équilibre de chaque produit en publicité.<\/label><\/li>\n<li><label><input type=\"checkbox\" />J'applique le cycle de récolte automatique vers exact.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Je calcule une enchère cible.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Je suis la routine chaque semaine.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Mon TACOS baisse de mois en mois.<\/label><\/li>\n<\/ul>\n", "todo": [], "quiz": [["Marge avant pub de 25 % du prix. Un ACOS de 25 % :", ["Vous fait gagner 25 %", "Ne rapporte ni ne coûte", "Vous fait perdre 25 %"], 1, "L'ACOS d'équilibre égale le taux de marge."], ["Quel indicateur doit baisser dans le temps ?", ["Le TACOS", "Le CTR", "Le nombre de mots-clés"], 0, "Un TACOS qui baisse = les ventes naturelles prennent le relais."], ["Produit à 24 €, conversion 10 %, ACOS cible 20 %. Enchère cible ?", ["0,48 €", "2,40 €", "4,80 €"], 0, "24 × 0,10 × 0,20 = 0,48 €."]], "ans": ["ACOS d'équilibre = marge nette avant publicité ÷ prix de vente TTC. Exemple : 6 € de marge sur 24 € donne 25 %. Au-dessus, la publicité vous coûte. Voir 10.2.", "Deux semaines de campagne automatique. Chaque recherche à 2 ventes ou plus sous l'ACOS cible passe en campagne exacte et devient un mot-clé négatif dans l'automatique. Les recherches qui coûtent sans vendre deviennent négatives. Voir 10.3.", "Enchère cible = prix TTC × taux de conversion × ACOS cible. Exemple : 24 € × 10 % × 20 % = 0,48 €. Voir 10.4.", "Chaque semaine : rapport des termes de recherche, gagnants en exact, ajout des négatifs, ajustement des enchères de 10 à 20 %, rien jugé avant 7 jours. Voir 10.5.", "TACOS = dépenses publicitaires ÷ ventes totales. Il baisse quand les ventes naturelles progressent plus vite que la publicité. Cible : sous 10 % en phase de rentabilité. Voir 10.2 et 10.6."]}, {"id": "m11", "lvl": "Croissance", "t": "Expansion européenne", "tag": "Module 11", "min": 35, "lead": "Vendre dans 9 pays avec le même stock multiplie le marché accessible sans multiplier le sourcing. Les produits qui marchent en France marchent souvent mieux en Allemagne, et la concurrence y est parfois plus faible sur les marques françaises.", "html": "<h2 id=\"111-les-pays-dans-lordre-douverture-conseillé\">11.1 Les pays, dans l'ordre d'ouverture conseillé<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Ordre<\/th>\n<th>Pays<\/th>\n<th>Atouts<\/th>\n<th>Points d'attention<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1<\/td>\n<td>Allemagne (.de)<\/td>\n<td>Premier marché européen, clients suisses et autrichiens<\/td>\n<td>LUCID obligatoire, exigence forte sur les traductions et le service<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>2<\/td>\n<td>Italie (.it)<\/td>\n<td>Grand marché, concurrence plus faible dans certaines catégories<\/td>\n<td>TVA à 22 %<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>3<\/td>\n<td>Espagne (.es)<\/td>\n<td>Grand marché, croissance régulière<\/td>\n<td>Prix moyens plus bas<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>4<\/td>\n<td>Pays-Bas (.nl) et Belgique (.com.be)<\/td>\n<td>Pouvoir d'achat élevé, marchés plus petits et moins concurrencés<\/td>\n<td>Belgique bilingue français et néerlandais<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>5<\/td>\n<td>Irlande (.ie)<\/td>\n<td>Anglophone, peu de vendeurs européens<\/td>\n<td>Marché plus petit<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>6<\/td>\n<td>Pologne (.pl)<\/td>\n<td>Marché en forte croissance<\/td>\n<td>Prix en zlotys, sensibilité au prix<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>7<\/td>\n<td>Suède (.se)<\/td>\n<td>Pouvoir d'achat élevé<\/td>\n<td>Prix en couronnes, TVA à 25 %<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Plus tard<\/td>\n<td>Royaume-Uni (.co.uk)<\/td>\n<td>Marché très important<\/td>\n<td>Hors UE : TVA britannique, douane, stock séparé<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>La Suisse n'a pas de site Amazon : les clients suisses achètent surtout sur Amazon.de, et paient la douane à réception.<\/p>\n<h2 id=\"112-les-trois-façons-de-vendre-en-europe\">11.2 Les trois façons de vendre en Europe<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Programme<\/th>\n<th>Stock<\/th>\n<th>Frais logistiques<\/th>\n<th>Obligations<\/th>\n<th>Quand<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Réseau européen (EFN)<\/td>\n<td>France uniquement<\/td>\n<td>Plus élevés par commande étrangère (environ 1 à 2 € de plus)<\/td>\n<td>OSS au-delà de 10 000 € de ventes UE hors France<\/td>\n<td>Mois 3 à 6<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Stockage multi-pays<\/td>\n<td>Pays choisis<\/td>\n<td>Tarifs locaux<\/td>\n<td>Numéro de TVA par pays de stockage<\/td>\n<td>Quand un pays dépasse 20 % des ventes<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Pan-Européen<\/td>\n<td>Réparti par Amazon<\/td>\n<td>Tarifs locaux, livraison plus rapide, plus de Buy Box<\/td>\n<td>Numéros de TVA dans les pays de stockage<\/td>\n<td>Mois 6 à 12, sur les meilleurs produits<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Règles actuelles du Pan-Européen<\/strong> (page Expédié par Amazon en Europe) :<\/p>\n<ul>\n<li>Stockage à autoriser dans au moins 2 pays parmi l'Allemagne, la France, l'Italie, l'Espagne et la Pologne. Vous pouvez démarrer avec seulement 2 numéros de TVA.<\/li>\n<li>Offre active obligatoire, avec le même SKU, en France, Allemagne, Italie, Espagne et, depuis le 3 septembre 2026, aux Pays-Bas. La Belgique sera exigée à partir du 26 février 2027.<\/li>\n<li>Économies annoncées par Amazon : jusqu'à 53 % sur les frais d'expédition par rapport à l'EFN.<\/li>\n<li>Pour vendre en Allemagne et en France, la REP doit être en règle (module 2.6).<\/li>\n<\/ul>\n<p><strong>Les frais EFN depuis un stock français<\/strong> (grille FBA 2026, à l'unité) : par exemple 5,79 € pour une enveloppe standard de 460 g vendue en Allemagne (contre 3,77 € en France), ou 7,73 € pour un colis standard de 400 g vendu en Italie ou en Espagne (contre 5,22 € en France). Le calculateur de la version interactive compare automatiquement les 9 pays.<\/p>\n<h2 id=\"113-le-calcul-de-marge-par-pays\">11.3 Le calcul de marge par pays<\/h2>\n<p>Même produit vendu 15 € TTC, achat 3,33 € HT, commission 15 %, FBA 3,50 € en France, stockage et transport 0,35 € :<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Pays<\/th>\n<th>Prix HT<\/th>\n<th>Surcoût EFN<\/th>\n<th>Marge nette<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>France<\/td>\n<td>12,50 €<\/td>\n<td>0 €<\/td>\n<td>3,07 €<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Allemagne<\/td>\n<td>12,61 €<\/td>\n<td>1,50 €<\/td>\n<td>1,68 €<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Espagne<\/td>\n<td>12,40 €<\/td>\n<td>1,50 €<\/td>\n<td>1,47 €<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Italie<\/td>\n<td>12,30 €<\/td>\n<td>1,50 €<\/td>\n<td>1,37 €<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Suède<\/td>\n<td>12,00 €<\/td>\n<td>1,50 €<\/td>\n<td>1,07 €<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>La leçon : en EFN, un produit à petite marge devient à peine rentable à l'étranger. Fixez un prix par pays (souvent 5 à 15 % plus haut qu'en France), ou réservez l'EFN aux produits à marge confortable jusqu'au passage au Pan-Européen.<\/p>\n<h2 id=\"114-les-fiches-dans-chaque-langue\">11.4 Les fiches dans chaque langue<\/h2>\n<ul>\n<li>Si la fiche existe dans le pays : rien à traduire, vous ajoutez votre offre.<\/li>\n<li>Si elle n'existe pas : Amazon peut créer une traduction automatique. Faites relire au minimum le titre, les points clés et tous les avertissements de sécurité.<\/li>\n<li>Les mots-clés ne se traduisent pas mot à mot : refaites une recherche dans la langue (suggestions de la barre de recherche locale).<\/li>\n<li>Le service client des commandes FBA est assuré par Amazon dans la langue du pays. En FBM, vous devez répondre dans la langue du client sous 24 heures : un outil de traduction suffit, avec des réponses types relues.<\/li>\n<\/ul>\n<h2 id=\"115-les-obligations-pays-par-pays\">11.5 Les obligations pays par pays<\/h2>\n<ul>\n<li><strong>TVA<\/strong> : guichet OSS pour les ventes à distance, numéros locaux pour chaque pays de stockage (module 2).<\/li>\n<li><strong>REP<\/strong> : chaque pays a ses filières et ses numéros ; l'Allemagne est la plus contrôlée (LUCID pour les emballages, registre spécifique pour l'électrique et les piles).<\/li>\n<li><strong>GPSR<\/strong> : avertissements et notices dans la langue de chaque pays de vente.<\/li>\n<li><strong>Garanties légales<\/strong> : la garantie légale de conformité de 2 ans minimum s'applique dans toute l'UE.<\/li>\n<\/ul>\n<h2 id=\"116-le-plan-dexpansion\">11.6 Le plan d'expansion<\/h2>\n<ol type=\"1\">\n<li><strong>Prérequis<\/strong> : 10 produits rentables en France depuis au moins 1 mois, solution REP et OSS prête.<\/li>\n<li><strong>Ouverture Allemagne, Italie, Espagne en EFN<\/strong> avec l'outil de création d'offres internationales et une règle de prix par pays.<\/li>\n<li><strong>Suivi à 4 semaines<\/strong> : ventes, marge réelle, retours par pays.<\/li>\n<li><strong>Extension<\/strong> aux Pays-Bas, à la Belgique, à l'Irlande, puis à la Pologne et à la Suède.<\/li>\n<li><strong>Pan-Européen<\/strong> quand l'étranger dépasse 30 % des ventes, avec un prestataire fiscal.<\/li>\n<li><strong>Royaume-Uni<\/strong> en dernier, après étude dédiée.<\/li>\n<\/ol>\n<h2 id=\"exercices\">Exercices<\/h2>\n<ol type=\"1\">\n<li>Calculez la marge de vos 5 meilleurs produits dans les 9 pays, en EFN.<\/li>\n<li>Définissez un prix par pays qui garde au moins 3 € de marge.<\/li>\n<li>Faites relire la traduction allemande d'une de vos fiches par un natif.<\/li>\n<\/ol>\n<h2 id=\"checklist-de-validation\">Checklist de validation<\/h2>\n<ul class=\"task-list\">\n<li><label><input type=\"checkbox\" />Je connais l'ordre d'ouverture et les spécificités de chaque pays.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Je calcule la marge par pays, surcoût EFN compris.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Les obligations TVA et REP sont réglées avant chaque ouverture.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Je sais quand passer de l'EFN au Pan-Européen.<\/label><\/li>\n<\/ul>\n", "todo": [], "quiz": [["Quel pays ouvrir en premier après la France ?", ["Suède", "Allemagne", "Pologne"], 1, "Premier marché Amazon européen."], ["En EFN, un produit à 3,07 € de marge en France rapporte en Allemagne :", ["Plus", "Moins, à cause du surcoût EFN", "Autant"], 1, "Environ 1,68 € : fixez un prix par pays."], ["Le Pan-Européen impose :", ["Rien de plus", "Un numéro de TVA dans chaque pays de stockage", "Une marque déposée"], 1, "Stocker dans un pays = s'y immatriculer à la TVA."]], "ans": ["Allemagne, Italie, Espagne, puis Pays-Bas et Belgique, Irlande, Pologne, Suède. Le Royaume-Uni plus tard (hors UE). L'Allemagne exige LUCID, la Pologne et la Suède ont leur propre monnaie. Voir 11.1.", "Prix TTC ÷ (1 + TVA du pays) − achat HT − commission − FBA − surcoût EFN (environ 1 à 2 €) − autres frais. Le calculateur de la formation gère les pays et l'EFN. Voir 11.3.", "Avant chaque ouverture : surveillance du seuil OSS, enregistrement REP du pays (LUCID en Allemagne), avertissements dans la langue locale. Voir 11.5 et la checklist D des annexes.", "Quand les ventes hors France dépassent environ 30 % du total, sur les meilleurs produits, avec un prestataire fiscal pour les numéros de TVA des pays de stockage. Voir 11.2 et 11.6."]}, {"id": "m12", "lvl": "Croissance", "t": "Marque propre", "tag": "Module 12", "min": 45, "lead": "La marque propre transforme une activité de revente en actif : une fiche que vous seul contrôlez, sans guerre des prix, et une société qui se revend plusieurs années de bénéfice. C&#x27;est aussi le modèle qui demande le plus de capital et de méthode. Commencez-le après 6 à 12 mois de revente rentable.", "html": "<h2 id=\"121-choisir-le-produit\">12.1 Choisir le produit<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Critère<\/th>\n<th>Cible<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Prix de vente<\/td>\n<td>20 à 60 € TTC (assez pour absorber les frais, assez bas pour l'achat impulsif)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Demande<\/td>\n<td>Requêtes de recherche régulières toute l'année, pas un effet de mode<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Concurrence<\/td>\n<td>Les 10 premiers résultats ont souvent moins de 500 avis, des notes sous 4,3, des fiches médiocres<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Amélioration possible<\/td>\n<td>Avis négatifs récurrents des concurrents que vous pouvez corriger<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Taille et poids<\/td>\n<td>Petit, léger, non fragile (frais FBA bas)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Complexité<\/td>\n<td>Sans électronique pour un premier produit, peu de réglementation<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Vos règles<\/td>\n<td>Pas de risque sanitaire, pas de jouet ou d'article enfant à risque<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Potentiel de gamme<\/td>\n<td>5 à 10 produits complémentaires possibles sous la même marque<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Familles adaptées à vos règles<\/strong> : rangement et organisation, accessoires de cuisine non alimentaires (hors contact alimentaire), bricolage et outillage à main, jardin, sport et fitness simples, accessoires auto et vélo, animaux (hors alimentation), bureau, voyage.<\/p>\n<h2 id=\"122-la-marque\">12.2 La marque<\/h2>\n<ol type=\"1\">\n<li><strong>Nom<\/strong> : court, prononçable dans plusieurs langues européennes, sans signification gênante ailleurs, nom de domaine disponible.<\/li>\n<li><strong>Recherche d'antériorité<\/strong> : bases INPI, EUIPO et sur Amazon. Un nom proche d'une marque existante dans la même classe sera refusé ou contesté.<\/li>\n<li><strong>Dépôt<\/strong> : INPI pour la France (environ 190 € pour une classe en ligne) ou EUIPO pour toute l'UE (environ 850 € pour une classe). Pour une vente européenne, l'EUIPO est le bon choix.<\/li>\n<li><strong>Classes<\/strong> : choisissez les classes des produits visés (par exemple 21 pour les ustensiles ménagers, 8 pour l'outillage à main).<\/li>\n<li><strong>Logo et charte<\/strong> : simples, lisibles en petit sur l'emballage et les images.<\/li>\n<\/ol>\n<h2 id=\"123-le-brand-registry\">12.3 Le Brand Registry<\/h2>\n<p>Inscription possible dès que la demande de marque est déposée (numéro de dépôt), sans attendre l'enregistrement définitif. Il donne :<\/p>\n<ul>\n<li>Le contrôle de la fiche : personne ne peut modifier titre, images ou description.<\/li>\n<li>Le contenu A+, la vitrine de marque, Sponsored Brands et Display, le programme Vine.<\/li>\n<li>Les outils de protection : signalement des contrefaçons et des vendeurs qui se greffent sur votre fiche.<\/li>\n<li>L'analyse de la marque : requêtes de recherche, panier, répétition d'achat.<\/li>\n<\/ul>\n<h2 id=\"124-trouver-et-choisir-un-fabricant\">12.4 Trouver et choisir un fabricant<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Origine<\/th>\n<th>Avantages<\/th>\n<th>Inconvénients<\/th>\n<th>Minimum typique<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>France et Europe<\/td>\n<td>Délais courts, normes maîtrisées, argument « fabriqué en Europe »<\/td>\n<td>Prix plus élevé<\/td>\n<td>100 à 500 unités<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Turquie, Portugal, Pologne<\/td>\n<td>Bon compromis prix et délai<\/td>\n<td>Choix plus restreint<\/td>\n<td>300 à 1 000 unités<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Asie (plateformes B2B, salons)<\/td>\n<td>Prix bas, choix immense<\/td>\n<td>Qualité variable, délais longs, douane, conformité à vérifier<\/td>\n<td>300 à 1 000 unités<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Le processus<\/strong> :<\/p>\n<ol type=\"1\">\n<li>Contacter 10 à 20 fabricants avec un cahier des charges précis (dimensions, matières, finitions, emballage, logo).<\/li>\n<li>Comparer prix, minimum, délai, certificats, ancienneté.<\/li>\n<li>Commander des échantillons à 3 à 5 fabricants et les tester réellement.<\/li>\n<li>Négocier le prix au palier visé, l'emballage, les conditions de paiement (souvent 30 % à la commande, 70 % avant expédition).<\/li>\n<li>Faire réaliser une inspection qualité avant expédition par une société tierce (environ 200 à 400 €).<\/li>\n<\/ol>\n<h2 id=\"125-importer-hors-ue\">12.5 Importer hors UE<\/h2>\n<ul>\n<li><strong>Incoterm<\/strong> : en début de parcours, préférez un prix livré (DDP) ou faites appel à un transitaire qui gère tout.<\/li>\n<li><strong>Douane<\/strong> : droits selon le code douanier du produit, TVA à l'importation récupérable, numéro EORI de la société obligatoire.<\/li>\n<li><strong>Délais<\/strong> : 30 à 45 jours par mer, 7 à 10 jours par avion (beaucoup plus cher), 20 à 30 jours par train depuis la Chine.<\/li>\n<li><strong>Vous devenez importateur<\/strong> : responsable de la conformité du produit, du marquage, de la documentation technique et de la REP.<\/li>\n<\/ul>\n<h2 id=\"126-conformité-du-produit-de-marque\">12.6 Conformité du produit de marque<\/h2>\n<ul>\n<li>Documentation technique et déclaration UE de conformité si le produit relève d'une directive (marquage CE).<\/li>\n<li>Étiquetage GPSR : votre nom, adresse, numéro de lot, avertissements dans chaque langue.<\/li>\n<li>Codes-barres GS1 à votre nom.<\/li>\n<li>REP comme producteur dans chaque pays de vente.<\/li>\n<li>Essais en laboratoire si la réglementation l'impose ou si un doute existe.<\/li>\n<\/ul>\n<h2 id=\"127-le-lancement\">12.7 Le lancement<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Semaine<\/th>\n<th>Action<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Avant réception<\/td>\n<td>Fiche complète prête : photos professionnelles, A+, mots-clés, vidéo<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1<\/td>\n<td>Stock reçu en FBA, inscription au programme Vine<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1 à 2<\/td>\n<td>Prix de lancement 10 à 15 % sous la cible, coupon visible<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1 à 8<\/td>\n<td>Publicité agressive : campagnes automatique, exacte et ciblage produit, ACOS au-dessus de l'équilibre accepté<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>4 à 8<\/td>\n<td>Premiers avis, remontée progressive du prix<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>8 à 12<\/td>\n<td>Baisse de l'ACOS, objectif de TACOS sous 15 %<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Dès la semaine 4<\/td>\n<td>Commande de réassort pour ne jamais tomber en rupture<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"128-budget-dun-premier-produit\">12.8 Budget d'un premier produit<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Poste<\/th>\n<th>Montant indicatif<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Dépôt de marque EUIPO<\/td>\n<td>Environ 850 €<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Échantillons et tests<\/td>\n<td>200 à 500 €<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Premier stock (500 unités)<\/td>\n<td>2 000 à 8 000 €<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Inspection qualité<\/td>\n<td>200 à 400 €<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Transport, douane, transitaire<\/td>\n<td>500 à 1 500 €<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Photos, vidéo, contenu A+<\/td>\n<td>500 à 1 500 €<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Codes-barres GS1<\/td>\n<td>Environ 50 à 150 € par an<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Publicité de lancement<\/td>\n<td>1 000 à 3 000 €<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Total<\/strong><\/td>\n<td><strong>5 300 à 15 900 €<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"129-protéger-la-marque\">12.9 Protéger la marque<\/h2>\n<ul>\n<li>Surveillez chaque semaine les vendeurs qui se greffent sur votre fiche : signalez les contrefaçons via les outils du Brand Registry.<\/li>\n<li>Le programme de numéros de série d'Amazon (Transparency, selon disponibilité) bloque les unités non authentiques.<\/li>\n<li>Gardez des photos datées de vos produits et emballages comme preuves.<\/li>\n<\/ul>\n<h2 id=\"1210-les-outils-du-brand-registry-en-chiffres\">12.10 Les outils du Brand Registry en chiffres<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Outil<\/th>\n<th>Ce qu'il fait<\/th>\n<th>Effet annoncé par Amazon<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Contenu A+<\/td>\n<td>Images enrichies, vidéos, tableaux comparatifs<\/td>\n<td>Environ +8 % de ventes en version de base, jusqu'à +20 % en version Premium<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Transparency<\/td>\n<td>Code unique par unité contre la contrefaçon<\/td>\n<td>Plus de 2,7 milliards d'unités protégées<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Project Zero<\/td>\n<td>Suppression immédiate des offres contrefaites par la marque<\/td>\n<td>—<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Expériences<\/td>\n<td>Tests A/B de titres, images et contenu A+<\/td>\n<td>Environ +25 % de ventes<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Abonnez-vous et économisez<\/td>\n<td>Remise de 10 à 15 % pour les achats récurrents<\/td>\n<td>Conversion multipliée par 1,8 en moyenne<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Brand Analytics<\/td>\n<td>Recherches et achats des clients<\/td>\n<td>—<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>IP Accelerator<\/td>\n<td>Avocats agréés par Amazon pour déposer la marque, avec accès anticipé au Brand Registry<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>L'inscription est gratuite. Une demande de marque en cours est acceptée dans certains cas. Le nom ou le logo doit figurer de façon permanente sur le produit ou l'emballage.<\/p>\n<h2 id=\"exercices\">Exerc
