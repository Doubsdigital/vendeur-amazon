ices<\/h2>\n<ol type=\"1\">\n<li>Sélectionnez 5 produits candidats selon la grille 12.1 et classez-les.<\/li>\n<li>Faites une recherche d'antériorité sur 3 noms de marque.<\/li>\n<li>Rédigez un cahier des charges et envoyez-le à 10 fabricants.<\/li>\n<\/ol>\n<h2 id=\"checklist-de-validation\">Checklist de validation<\/h2>\n<ul class=\"task-list\">\n<li><label><input type=\"checkbox\" />Je sais choisir un produit de marque selon les 8 critères.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Je connais les étapes du dépôt et du Brand Registry.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Je sais comparer et tester des fabricants.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Je connais mes obligations d'importateur.<\/label><\/li>\n<li><label><input type=\"checkbox\" />J'ai un plan de lancement semaine par semaine.<\/label><\/li>\n<\/ul>\n", "todo": [], "quiz": [["Que donne le Brand Registry ?", ["Le contrôle de la fiche et le contenu A+", "Des frais FBA réduits", "Une exemption de TVA"], 0, "Plus les outils de protection contre les contrefaçons."], ["Premier lancement le plus raisonnable :", ["2 000 unités d'un gadget électronique", "Un objet simple et robuste, 300 à 500 unités", "Un jouet pour enfants"], 1, "Tester la demande sans produit à risque."], ["Pour vendre dans toute l'UE, la marque se dépose plutôt :", ["À l'INPI seulement", "À l'EUIPO", "Ce n'est pas utile"], 1, "Une seule protection pour toute l'Union européenne."]], "ans": ["Prix de 20 à 60 €, demande toute l'année, concurrents faibles, amélioration possible, petit et léger, sans électronique au début, conforme à vos règles, potentiel de gamme. Voir 12.1.", "Recherche d'antériorité, dépôt à l'EUIPO (environ 850 € pour une classe) ou à l'INPI, puis inscription au Brand Registry dès le numéro de dépôt. Voir 12.2 et 12.3.", "Cahier des charges envoyé à 10 à 20 fabricants, comparaison prix, minimum, délai et certificats, échantillons chez 3 à 5 d'entre eux, inspection qualité avant expédition. Voir 12.4.", "Numéro EORI, droits de douane et TVA d'importation, conformité et documentation technique du produit, marquage, étiquetage GPSR, REP comme producteur. Voir 12.5 et 12.6.", "Fiche prête avant réception, Vine dès la semaine 1, prix de lancement 10 à 15 % sous la cible, publicité agressive 4 à 8 semaines, remontée du prix, réassort commandé dès la semaine 4. Voir 12.7."]}, {"id": "m13", "lvl": "Expert", "t": "Pilotage et passage à l'échelle", "tag": "Module 13", "min": 45, "lead": "Passer de 1 000 à 50 000 € de ventes mensuelles ne demande pas de travailler 50 fois plus : cela demande des chiffres fiables chaque semaine, une trésorerie anticipée, et des tâches déléguées ou automatisées.", "html": "<h2 id=\"131-le-tableau-de-bord-hebdomadaire\">13.1 Le tableau de bord hebdomadaire<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Indicateur<\/th>\n<th>Cible<\/th>\n<th>Source<\/th>\n<th>Si hors cible<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Chiffre d'affaires HT<\/td>\n<td>En hausse sur 4 semaines<\/td>\n<td>Rapports d'activité<\/td>\n<td>Plus de références, plus de pays<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Marge nette totale<\/td>\n<td>Plus de 15 % du CA HT<\/td>\n<td>Outil de profit ou tableur<\/td>\n<td>Revoir achats, prix, publicité<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Retour sur l'achat moyen<\/td>\n<td>Plus de 30 %<\/td>\n<td>Tableur<\/td>\n<td>Éliminer les produits faibles<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Rotation du stock<\/td>\n<td>Écoulé en moins de 60 jours<\/td>\n<td>Rapport d'inventaire<\/td>\n<td>Réduire les lots, liquider le dormant<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Taux de Buy Box (fiches partagées)<\/td>\n<td>Plus de 50 %<\/td>\n<td>Rapport d'activité par ASIN<\/td>\n<td>Prix, FBA, santé du compte<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Ruptures<\/td>\n<td>Zéro sur les 20 meilleurs produits<\/td>\n<td>Rapport de réapprovisionnement<\/td>\n<td>Avancer les commandes<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>TACOS<\/td>\n<td>Moins de 10 %<\/td>\n<td>Console publicitaire<\/td>\n<td>Couper les campagnes non rentables<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Taux de retour<\/td>\n<td>Moins de 5 %<\/td>\n<td>Rapport des retours<\/td>\n<td>Corriger fiche ou produit<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Part des ventes hors France<\/td>\n<td>En hausse<\/td>\n<td>Rapports par site<\/td>\n<td>Ouvrir des pays<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Santé du compte<\/td>\n<td>Tout au vert<\/td>\n<td>Performances<\/td>\n<td>Plan d'action immédiat<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Un outil de suivi du profit (Sellerboard ou équivalent, environ 20 à 40 € par mois) calcule automatiquement la marge réelle par produit en croisant ventes, frais Amazon, coûts d'achat saisis et publicité.<\/p>\n<h2 id=\"132-lanalyse-abc-du-catalogue\">13.2 L'analyse ABC du catalogue<\/h2>\n<p>Chaque mois, classez vos produits par marge totale générée :<\/p>\n<ul>\n<li><strong>A<\/strong> : les 20 % de produits qui font environ 80 % de la marge. Jamais en rupture, négociation prioritaire, ouverture dans tous les pays.<\/li>\n<li><strong>B<\/strong> : produits corrects. Maintenus, optimisés.<\/li>\n<li><strong>C<\/strong> : produits faibles. Pas de réapprovisionnement, écoulement, remplacement.<\/li>\n<\/ul>\n<h2 id=\"133-la-trésorerie\">13.3 La trésorerie<\/h2>\n<ul>\n<li><strong>Le cycle<\/strong> : achat, réception, envoi, vente, paiement Amazon. 30 à 60 jours entre la sortie et le retour de l'argent.<\/li>\n<li><strong>La règle de montée en charge<\/strong> : un produit qui vend 80 % d'un lot test au prix prévu en moins de 30 jours mérite un lot 5 fois plus gros. N'engagez jamais plus de 60 jours de ventes observées sur un même produit.<\/li>\n<li><strong>La répartition<\/strong> : 70 % des bénéfices réinvestis les 12 premiers mois, réserve de 3 mois de frais fixes.<\/li>\n<li><strong>Les pics de fin d'année<\/strong> : le stock de novembre et décembre se paie en septembre et octobre. Prévoyez 2 à 3 fois votre besoin habituel.<\/li>\n<li><strong>Les leviers<\/strong> : délais de paiement fournisseurs (30 jours), paiement plus rapide des fonds Amazon, financement de stock par la banque une fois l'historique constitué.<\/li>\n<\/ul>\n<h2 id=\"134-les-paliers-de-croissance\">13.4 Les paliers de croissance<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Palier<\/th>\n<th>Ventes mensuelles HT<\/th>\n<th>Organisation type<\/th>\n<th>Priorité<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Démarrage<\/td>\n<td>0 à 5 000 €<\/td>\n<td>Les deux associés font tout<\/td>\n<td>Trouver 20 produits rentables<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Structuration<\/td>\n<td>5 000 à 20 000 €<\/td>\n<td>Grossistes récurrents, Europe en EFN<\/td>\n<td>Process, tableau de bord, prestataire de préparation<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Croissance<\/td>\n<td>20 000 à 50 000 €<\/td>\n<td>Pan-Européen, premier produit de marque, assistant<\/td>\n<td>Délégation, trésorerie<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Échelle<\/td>\n<td>Plus de 50 000 €<\/td>\n<td>Gamme de marque, équipe, plusieurs canaux<\/td>\n<td>Marque, marge, valeur de revente<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"135-déléguer-et-automatiser\">13.5 Déléguer et automatiser<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Tâche<\/th>\n<th>Solution<\/th>\n<th>Quand<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Préparation et envois FBA<\/td>\n<td>Prestataire de préparation<\/td>\n<td>Dès les achats grossistes<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Recherche produit<\/td>\n<td>Assistant formé à vos critères (module 4), à distance<\/td>\n<td>Palier Structuration<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Prix<\/td>\n<td>Ajustement automatique<\/td>\n<td>Dès le début<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Demandes d'avis<\/td>\n<td>Outil automatique officiel<\/td>\n<td>Dès le début<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Comptabilité<\/td>\n<td>Connecteur Amazon vers le logiciel comptable<\/td>\n<td>Dès le début<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Récupération des remboursements FBA<\/td>\n<td>Service spécialisé au pourcentage<\/td>\n<td>Palier Structuration<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Publicité<\/td>\n<td>Vous, puis une agence ou un freelance pour la marque<\/td>\n<td>Palier Croissance<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Traductions<\/td>\n<td>IA plus relecture native<\/td>\n<td>Ouverture de chaque pays<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Documentez chaque tâche<\/strong> sous forme de procédure courte (étapes, captures d'écran, critères) avant de la déléguer. Les procédures de ce programme sont une bonne base.<\/p>\n<h2 id=\"136-lorganisation-entre-associés\">13.6 L'organisation entre associés<\/h2>\n<ul>\n<li><strong>Rôles<\/strong> : par exemple, l'un sur le sourcing, les fournisseurs et la logistique ; l'autre sur Seller Central, prix, publicité, Europe et chiffres. Les rôles peuvent tourner, mais chaque tâche a un responsable.<\/li>\n<li><strong>Réunion de pilotage<\/strong> chaque lundi, 30 minutes : tableau de bord, décisions d'achat, problèmes de compte.<\/li>\n<li><strong>Règle de décision<\/strong> : tout achat de plus d'un montant défini se décide à deux.<\/li>\n<li><strong>Outils partagés<\/strong> : tableur ou base de données des produits, des fournisseurs et des envois.<\/li>\n<\/ul>\n<h2 id=\"137-les-autres-canaux\">13.7 Les autres canaux<\/h2>\n<p>Une fois le stock et les process en place, le même stock peut être vendu sur Cdiscount, Fnac, ManoMano, eBay ou votre propre site, souvent via un outil multicanal qui synchronise les stocks. Amazon peut même expédier ces commandes depuis votre stock FBA (service d'expédition multicanal).<\/p>\n<p>Amazon propose ce service sous le nom d'expédition multicanal (module 8.12) : emballage neutre, 1 à 3 jours ouvrés, extensions pour Shopify et WooCommerce.<\/p>\n<h2 id=\"138-utiliser-lia-pour-analyser-des-centaines-de-produits\">13.8 Utiliser l'IA pour analyser des centaines de produits<\/h2>\n<p>Scanner un produit à la fois ne passe pas à l'échelle. Une IA comme Claude peut appliquer votre grille de décision à des centaines ou des milliers de produits en quelques minutes, à condition de lui donner les bonnes données. Vous gardez la décision finale.<\/p>\n<p><strong>Les trois façons de travailler<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Méthode<\/th>\n<th>Volume<\/th>\n<th>Vitesse<\/th>\n<th>Quand l'utiliser<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Export d'une liste, analysé par l'IA<\/td>\n<td>Des centaines à des milliers de produits<\/td>\n<td>Quelques minutes<\/td>\n<td>Méthode principale, dès le début<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>IA dans le navigateur (Chrome)<\/td>\n<td>Quelques dizaines de produits<\/td>\n<td>30 secondes à 1 minute par produit<\/td>\n<td>Vérifier une sélection, lire des graphiques, comparer des boutiques<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Accès automatique aux données de Keepa (API)<\/td>\n<td>Des milliers, chaque jour<\/td>\n<td>Automatique, sur programmation<\/td>\n<td>Palier Croissance<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>La méthode principale, pas à pas<\/strong><\/p>\n<ol type=\"1\">\n<li><strong>Exporter une liste<\/strong> :\n<ul>\n<li>ProfitGo : export Google Sheets des produits analysés ;<\/li>\n<li>grossiste : sa liste de prix (Excel avec codes-barres et prix HT) ;<\/li>\n<li>Keepa : export de la recherche de produits (fichier CSV), avec les colonnes de prix, de classement et d'offres.<\/li>\n<\/ul><\/li>\n<li><strong>Vérifier les colonnes minimales<\/strong> : code-barres ou ASIN, nom du produit, prix d'achat (en précisant HT ou TTC), prix de la Buy Box actuel et moyen sur 90 jours, frais FBA et commission (ou catégorie), ventes estimées, nombre de vendeurs FBA, présence d'Amazon vendeur.<\/li>\n<li><strong>Envoyer le fichier à l'IA avec vos consignes<\/strong> (modèle ci-dessous).<\/li>\n<li><strong>Recevoir un tableau trié<\/strong> : verdict vert, orange ou rouge, marge nette, retour sur l'achat, part des ventes estimée, lot conseillé, phase du cycle de vie, raison de chaque refus.<\/li>\n<li><strong>Vérifier vous-même chaque produit vert avant d'acheter<\/strong> : restriction dans l'application Amazon Seller, correspondance exacte avec la fiche, prix du jour.<\/li>\n<\/ol>\n<p><strong>Modèle de consigne à donner à l'IA<\/strong><\/p>\n<blockquote>\n<p>Voici un export de [nombre] produits. Pour chaque produit, calcule la marge nette et le retour sur l'achat en régime réel de TVA (20 % en France), avec la commission indiquée, les frais FBA et 0,35 € de coûts supplémentaires par unité. Utilise le prix de la Buy Box moyen sur 90 jours, pas le prix du jour.<\/p>\n<p>Applique ces règles : feu vert si retour sur l'achat d'au moins 30 % et marge d'au moins 3 € ; pour un produit électrique ou mécanique, 50 % et 5 € après 8 % de provision pour retours. Exclus les produits à risque sanitaire et les jouets ou articles enfants à risque d'accident. Feu rouge si Amazon vend la plupart du temps.<\/p>\n<p>Estime nos ventes mensuelles (ventes de la fiche divisées par le nombre de vendeurs FBA au prix de la Buy Box plus un) et propose un lot d'un à deux mois de ventes. Indique la phase du cycle de vie si l'historique le permet. Rends un tableau trié du meilleur au moins bon, avec la raison de chaque refus.<\/p>\n<\/blockquote>\n<p><strong>L'IA dans le navigateur<\/strong><\/p>\n<ul>\n<li><strong>Prérequis<\/strong> : ordinateur allumé, Chrome ouvert avec l'extension Claude, comptes ProfitGo, Keepa ou Amazon déjà connectés.<\/li>\n<li><strong>Ce qu'elle peut faire<\/strong> : ouvrir les fiches, lire les graphiques de prix et de classement, appliquer la grille, comparer les prix dans plusieurs boutiques, remplir un tableau.<\/li>\n<li><strong>Les règles<\/strong> : consultation raisonnable uniquement. Amazon interdit l'extraction automatique de données, et les outils comme Keepa ou ProfitGo encadrent l'usage automatisé dans leurs conditions. Aucune action dans Seller Central et aucun achat sans votre validation.<\/li>\n<\/ul>\n<p><strong>L'accès automatique aux données de Keepa<\/strong><\/p>\n<p>Un abonnement à l'interface de programmation de Keepa (à partir d'environ 50 € par mois) permet à une tâche programmée d'interroger les données chaque jour et de vous envoyer chaque matin une liste de produits qui passent vos critères. À envisager quand le volume d'achat le justifie.<\/p>\n<p><strong>Les limites à connaître<\/strong><\/p>\n<ul>\n<li>Des données fausses ou incomplètes donnent des résultats faux : vérifiez les colonnes avant l'analyse.<\/li>\n<li>Les ventes estimées restent des estimations.<\/li>\n<li>L'IA ne voit pas les restrictions de votre compte si elles ne figurent pas dans l'export.<\/li>\n<li>Les frais d'Amazon changent : mettez à jour les taux dans vos consignes.<\/li>\n<li>La décision d'achat et la responsabilité du compte restent les vôtres.<\/li>\n<\/ul>\n<h2 id=\"exercices\">Exercices<\/h2>\n<ol type=\"1\">\n<li>Construisez votre tableau de bord et remplissez-le 4 lundis de suite.<\/li>\n<li>Faites l'analyse ABC de votre catalogue.<\/li>\n<li>Rédigez la procédure d'une tâche que vous déléguerez en premier.<\/li>\n<li>Exportez une liste d'au moins 100 produits et faites-la analyser par l'IA avec le modèle de consigne du 13.8.<\/li>\n<\/ol>\n<h2 id=\"checklist-de-validation\">Checklist de validation<\/h2>\n<ul class=\"task-list\">\n<li><label><input type=\"checkbox\" />Le tableau de bord est rempli chaque semaine.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Je connais mes produits A, B et C.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Le besoin de trésorerie de fin d'année est anticipé.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Les rôles entre associés sont écrits.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Au moins 3 tâches sont automatisées.<\/label><\/li>\n<li><label><input type=\"checkbox\" />J'ai fait analyser au moins une liste de plus de 100 produits par l'IA et vérifié les produits verts.<\/label><\/li>\n<\/ul>\n", "todo": [], "quiz": [["Un lot test de 30 unités se vend à 26 en 3 semaines au bon prix. Vous :", ["Recommandez 30", "Commandez environ 150", "Arrêtez"], 1, "Plus de 80 % vendus en moins de 30 jours : lot × 5."], ["Les produits A de l'analyse ABC sont :", ["Les 20 % qui font environ 80 % de la marge", "Les moins chers", "Les plus récents"], 0, "Jamais en rupture, négociés en priorité."], ["Le stock de novembre et décembre se paie :", ["En janvier", "En septembre et octobre", "Il est gratuit"], 1, "Prévoyez 2 à 3 fois votre besoin habituel de trésorerie."]], "ans": ["Chaque lundi : chiffre d'affaires, marge nette, retour sur l'achat, rotation du stock, taux de Buy Box, ruptures, TACOS, retours, part hors France, santé du compte. Voir 13.1.", "Classez vos produits par marge totale du mois. A : les 20 % qui font environ 80 % de la marge. B : corrects. C : faibles, ni réassort ni publicité. Voir 13.2.", "Le stock de novembre et décembre se paie en septembre et octobre. Prévoyez 2 à 3 fois votre besoin habituel. Voir 13.3.", "Pour chaque tâche, un responsable : par exemple sourcing, fournisseurs et logistique pour l'un ; Seller Central, prix, publicité et chiffres pour l'autre. Plus une règle de décision à deux au-delà d'un montant. Voir 13.6.", "Faciles à automatiser dès le début : ajustement des prix, demandes d'avis, connecteur comptable. Ensuite : prestataire de préparation, récupération des remboursements FBA. Voir 13.5.", "Exportez une liste, envoyez-la à l'IA avec le modèle de consigne du 13.8, puis vérifiez vous-même la restriction, la fiche et le prix de chaque produit vert. Voir 13.8."]}, {"id": "m14", "lvl": "Expert", "t": "Risques, suspensions et défense du compte", "tag": "Module 14", "min": 35, "lead": "Votre compte vendeur est votre actif principal. Une suspension bloque ventes et paiements du jour au lendemain, parfois pendant des semaines. La plupart des suspensions viennent de risques connus et évitables ; les autres se règlent mieux avec une réponse méthodique.", "html": "<h2 id=\"141-la-carte-des-risques\">14.1 La carte des risques<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Risque<\/th>\n<th>Probabilité en revente<\/th>\n<th>Gravité<\/th>\n<th>Prévention principale<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Plainte d'authenticité (client ou marque)<\/td>\n<td>Élevée<\/td>\n<td>Élevée<\/td>\n<td>Factures de grossiste, éviter les marques qui surveillent leurs revendeurs<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Plainte de propriété intellectuelle<\/td>\n<td>Moyenne<\/td>\n<td>Élevée<\/td>\n<td>Ne jamais utiliser photos, textes ou logos d'une marque ; ne pas créer de fiche au nom d'une marque tierce<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Produit « différent de la description »<\/td>\n<td>Moyenne<\/td>\n<td>Moyenne<\/td>\n<td>Vérifier la correspondance exacte (lot, couleur, version)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>État du produit (vendu Neuf, reçu abîmé)<\/td>\n<td>Moyenne<\/td>\n<td>Moyenne<\/td>\n<td>Contrôle visuel, état Neuf uniquement si parfait<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Produit restreint ou dangereux<\/td>\n<td>Faible si vérification<\/td>\n<td>Élevée<\/td>\n<td>Vérifier chaque ASIN, FDS pour les produits chimiques<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Prix abusif lors d'une pénurie<\/td>\n<td>Faible<\/td>\n<td>Moyenne<\/td>\n<td>Pas de hausse brutale en situation de crise<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Comptes liés<\/td>\n<td>Faible<\/td>\n<td>Très élevée<\/td>\n<td>Un seul compte, appareils, cartes et réseaux dédiés<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Manipulation des avis<\/td>\n<td>Faible<\/td>\n<td>Très élevée<\/td>\n<td>Outils officiels uniquement<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Documents falsifiés<\/td>\n<td>Nulle si honnête<\/td>\n<td>Fermeture définitive<\/td>\n<td>Jamais<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Non-conformité REP ou GPSR<\/td>\n<td>Moyenne<\/td>\n<td>Offres désactivées<\/td>\n<td>Identifiants et informations à jour<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"142-les-niveaux-de-sanction\">14.2 Les niveaux de sanction<\/h2>\n<ol type=\"1\">\n<li><strong>Avertissement<\/strong> sur la santé du compte : aucune action immédiate, mais à traiter.<\/li>\n<li><strong>Offre ou fiche supprimée<\/strong> : le produit concerné n'est plus vendable.<\/li>\n<li><strong>Retrait des droits de vente<\/strong> dans une catégorie ou une marque.<\/li>\n<li><strong>Désactivation du compte<\/strong> : plus aucune vente, fonds bloqués.<\/li>\n<li><strong>Fermeture définitive<\/strong> : rare, après fraude ou récidive.<\/li>\n<\/ol>\n<p>La notation de la santé du compte dégrade progressivement : surveillez-la chaque jour pour agir au niveau 1 ou 2.<\/p>\n<h2 id=\"143-la-procédure-en-cas-de-plainte\">14.3 La procédure en cas de plainte<\/h2>\n<ol type=\"1\">\n<li><strong>Lire la notification en entier<\/strong>, deux fois. Identifier l'ASIN, le type de plainte, le plaignant et le délai.<\/li>\n<li><strong>Ne pas répondre dans la précipitation.<\/strong> Une réponse rejetée compte, et les suivantes sont examinées avec plus de méfiance.<\/li>\n<li><strong>Retirer l'offre<\/strong> si le risque est réel, et vérifier le stock FBA concerné.<\/li>\n<li><strong>Rassembler les preuves<\/strong> : factures (fournisseur identifiable, quantités cohérentes avec les ventes), photos, échanges avec le fournisseur.<\/li>\n<li><strong>Pour une plainte de marque<\/strong> : contacter le plaignant à l'adresse indiquée, poliment, pour comprendre et proposer de cesser la vente. Beaucoup de plaintes sont retirées ainsi, ce qui est la meilleure issue.<\/li>\n<li><strong>Rédiger un plan d'action<\/strong> (14.4) et le déposer depuis la page Santé du compte.<\/li>\n<li><strong>Suivre<\/strong> : réponse en général sous 48 heures à quelques jours. Si refus, lire la raison, compléter, ne pas renvoyer le même texte.<\/li>\n<\/ol>\n<h2 id=\"144-la-structure-dun-plan-daction-accepté\">14.4 La structure d'un plan d'action accepté<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Partie<\/th>\n<th>Contenu<\/th>\n<th>Exemple pour une plainte « produit abîmé vendu Neuf »<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Cause racine<\/td>\n<td>Ce qui a causé le problème, sans accuser Amazon ni le client<\/td>\n<td>Nos contrôles avant envoi ne vérifiaient pas l'état des emballages des produits achetés en magasin<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Actions immédiates<\/td>\n<td>Ce qui est déjà fait<\/td>\n<td>Offre retirée, stock FBA rapatrié et contrôlé, 3 unités abîmées retirées de la vente, client remboursé<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Mesures préventives<\/td>\n<td>Ce qui empêche la récidive<\/td>\n<td>Contrôle visuel unité par unité avec checklist, photo de chaque carton avant envoi, achat uniquement de produits sous emballage intact<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Règles d'écriture : phrases courtes, listes numérotées, faits vérifiables, aucun argument émotionnel, aucune promesse vague (« nous ferons plus attention »).<\/p>\n<h2 id=\"145-les-plaintes-dauthenticité-en-revente\">14.5 Les plaintes d'authenticité en revente<\/h2>\n<ul>\n<li>Amazon demande souvent des factures du fournisseur couvrant les ventes des 365 derniers jours.<\/li>\n<li>Les factures de détaillant (tickets, factures de magasin) sont rarement acceptées comme preuve d'authenticité.<\/li>\n<li>C'est la raison principale de basculer vers des grossistes : chaque produit que vous gardez durablement doit pouvoir être justifié par une facture de grossiste ou du fabricant.<\/li>\n<li>Si vous ne pouvez pas justifier, retirez le produit et rapatriez le stock plutôt que de risquer le compte.<\/li>\n<\/ul>\n<h2 id=\"146-en-cas-de-désactivation-complète\">14.6 En cas de désactivation complète<\/h2>\n<ul>\n<li>Fonds bloqués, stock FBA immobilisé : vous pouvez demander le retrait du stock.<\/li>\n<li>Un seul appel, bien préparé : plan d'action complet, toutes les pièces.<\/li>\n<li>Un consultant ou avocat spécialisé dans les comptes Amazon peut être rentable : chaque jour de blocage coûte des ventes et fait baisser vos classements.<\/li>\n<li>N'ouvrez jamais un nouveau compte pendant une désactivation : il serait lié et fermé.<\/li>\n<\/ul>\n<h2 id=\"147-les-15-erreurs-de-débutant\">14.7 Les 15 erreurs de débutant<\/h2>\n<ol type=\"1\">\n<li>Acheter sans vérifier restriction et frais.<\/li>\n<li>Calculer la marge au prix du jour.<\/li>\n<li>Ignorer la TVA dans le calcul.<\/li>\n<li>Tout miser sur un seul produit.<\/li>\n<li>Entrer dans une guerre des prix.<\/li>\n<li>Garder des tickets au lieu de factures.<\/li>\n<li>Vendre en « Neuf » un produit déballé ou abîmé.<\/li>\n<li>Se tromper de variation ou de lot.<\/li>\n<li>Négliger la REP et le GPSR.<\/li>\n<li>Ouvrir un second compte.<\/li>\n<li>Laisser dormir du stock plus de 90 jours.<\/li>\n<li>Tomber en rupture sur un produit gagnant.<\/li>\n<li>Faire de la publicité sans connaître l'ACOS d'équilibre.<\/li>\n<li>Ne pas lire les messages de Seller Central chaque jour.<\/li>\n<li>Mélanger finances personnelles et finances de la société.<\/li>\n<\/ol>\n<h2 id=\"exercices\">Exercices<\/h2>\n<ol type=\"1\">\n<li>Rédigez un plan d'action complet pour une plainte fictive « produit contrefait ».<\/li>\n<li>Vérifiez que chaque produit actif a une facture qui le justifie.<\/li>\n<\/ol>\n<h2 id=\"checklist-de-validation\">Checklist de validation<\/h2>\n<ul class=\"task-list\">\n<li><label><input type=\"checkbox\" />Je consulte la santé du compte chaque jour.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Je connais les 7 étapes de réponse à une plainte.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Je sais rédiger un plan d'action en 3 parties.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Chaque produit actif est justifié par une facture.<\/label><\/li>\n<\/ul>\n", "todo": [], "quiz": [["Une plainte de contrefaçon arrive. Première action ?", ["Répondre dans l'heure en contestant", "Lire, identifier l'ASIN, retirer l'offre si le risque est réel", "Ouvrir un nouveau compte"], 1, "Analyse d'abord, réponse structurée ensuite."], ["Un bon plan d'action contient :", ["Des excuses détaillées", "Cause racine, actions faites, mesures préventives", "Une critique de l'algorithme"], 1, "Factuel, en trois parties, listes numérotées."], ["Un produit au carton abîmé, contenu intact :", ["Vendu en « Neuf »", "Vendu en occasion avec note, ou retiré", "Envoyé tel quel"], 1, "« Neuf » mal utilisé est une cause classique de suspension."]], "ans": ["Seller Central, Performances, Santé du compte : chaque jour, en même temps que les messages acheteurs. Agissez dès l'avertissement. Voir 14.2 et 15.6.", "1. Lire la notification. 2. Ne pas répondre dans la précipitation. 3. Retirer l'offre si le risque est réel. 4. Rassembler les preuves. 5. Contacter la marque plaignante. 6. Rédiger le plan d'action. 7. Suivre et compléter si refus. Voir 14.3.", "1. Cause racine, sans accuser Amazon ni le client. 2. Actions immédiates déjà faites. 3. Mesures préventives contre la récidive. Phrases courtes, listes numérotées, faits vérifiables. Voir 14.4.", "Pour chaque produit en vente, une facture au nom de la SAS, d'un grossiste ou du fabricant de préférence, couvrant les quantités vendues sur 12 mois. Sinon, retirez le produit. Voir 14.5."]}, {"id": "m15", "lvl": "Expert", "t": "Plan d'action 90 jours et routines", "tag": "Module 15", "min": 20, "lead": "Objectif à 90 jours : un compte sain, 20 produits rentables, 4 pays européens ouverts, un premier grossiste récurrent et un tableau de bord tenu chaque semaine. Départ avec 1 000 € de stock, augmenté uniquement sur les produits validés.", "html": "<h2 id=\"151-semaines-1-et-2--fondations\">15.1 Semaines 1 et 2 — Fondations<\/h2>\n<ul class=\"task-list\">\n<li><label><input type=\"checkbox\" />Immatriculer la SAS, ouvrir le compte bancaire professionnel.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Choisir le régime de TVA avec le comptable, mettre en place le logiciel comptable.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Souscrire l'assurance RC pro avec garantie produits.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Régler la REP France.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Ouvrir le compte Seller Central Professionnel, régler les paramètres du module 3.<\/label><\/li>\n<li><label><input type=\"checkbox\" />S'abonner à ProfitGo, suivre la formation de prise en main, installer l'application Amazon Seller.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Acheter l'équipement logistique (module 8).<\/label><\/li>\n<\/ul>\n<h2 id=\"152-semaines-3-et-4--premiers-tests\">15.2 Semaines 3 et 4 — Premiers tests<\/h2>\n<ul class=\"task-list\">\n<li><label><input type=\"checkbox\" />Scanner 200 produits en magasin et en ligne, retenir 8 à 10 feux verts.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Acheter 20 à 30 unités de chacun, pour 1 000 € au total, avec factures.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Mettre en ligne les offres (module 7).<\/label><\/li>\n<li><label><input type=\"checkbox\" />Préparer et expédier le premier envoi FBA.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Envoyer les 30 premières demandes à des grossistes et marques.<\/label><\/li>\n<\/ul>\n<h2 id=\"153-semaines-5-à-8--valider-et-réinvestir\">15.3 Semaines 5 à 8 — Valider et réinvestir<\/h2>\n<ul class=\"task-list\">\n<li><label><input type=\"checkbox\" />Contrôler la réception du premier envoi.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Mesurer pour chaque produit : prix réel, vitesse, marge réelle.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Multiplier par 5 les lots des produits validés, arrêter les autres.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Activer l'ajustement automatique des prix avec planchers.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Passer à 15 produits actifs.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Analyser les premières listes de prix de grossistes.<\/label><\/li>\n<\/ul>\n<h2 id=\"154-semaines-9-à-13--structurer-et-étendre\">15.4 Semaines 9 à 13 — Structurer et étendre<\/h2>\n<ul class=\"task-list\">\n<li><label><input type=\"checkbox\" />Signer un premier grossiste récurrent.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Atteindre 20 produits actifs, rotation sous 60 jours.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Ouvrir l'Allemagne, l'Italie et l'Espagne en EFN, avec un prix par pays.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Préparer le guichet OSS et les obligations allemandes (LUCID).<\/label><\/li>\n<li><label><input type=\"checkbox\" />Tenir le tableau de bord chaque lundi.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Bilan du jour 90 : chiffre d'affaires, marge, part de l'étranger, temps passé. Décider des 90 jours suivants.<\/label><\/li>\n<\/ul>\n<h2 id=\"155-les-90-jours-suivants\">15.5 Les 90 jours suivants<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Période<\/th>\n<th>Objectif<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Mois 4<\/td>\n<td>40 produits actifs, 3 grossistes récurrents<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Mois 5<\/td>\n<td>Pays-Bas, Belgique, Irlande ; prestataire de préparation si les volumes le justifient<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Mois 6<\/td>\n<td>Bilan semestriel ; décision Pan-Européen ; choix du premier produit de marque<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Septembre et octobre<\/td>\n<td>Stock de fin d'année commandé et envoyé avant mi-octobre<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"156-les-routines\">15.6 Les routines<\/h2>\n<p><strong>Chaque jour (15 à 30 minutes)<\/strong> :<\/p>\n<ul>\n<li>Santé du compte et notifications.<\/li>\n<li>Messages acheteurs : réponse sous 24 heures.<\/li>\n<li>Commandes FBM à expédier.<\/li>\n<li>Produits bloqués au prix minimum ou sans Buy Box.<\/li>\n<\/ul>\n<p><strong>Chaque semaine<\/strong> :<\/p>\n<ul>\n<li>Réunion de pilotage du lundi et tableau de bord.<\/li>\n<li>Session de sourcing (tournée ou liste de grossiste).<\/li>\n<li>Routine publicitaire.<\/li>\n<li>Préparation et envoi FBA.<\/li>\n<li>Contrôle des réceptions.<\/li>\n<\/ul>\n<p><strong>Chaque mois<\/strong> :<\/p>\n<ul>\n<li>Compte de résultat et analyse ABC.<\/li>\n<li>Rapports d'ajustement d'inventaire et demandes de remboursement.<\/li>\n<li>Stock dormant de plus de 90 jours.<\/li>\n<li>Annonces Amazon sur les frais et les règles.<\/li>\n<li>Relance des fournisseurs.<\/li>\n<\/ul>\n<p><strong>Chaque trimestre<\/strong> :<\/p>\n<ul>\n<li>Déclaration OSS.<\/li>\n<li>Revue de la stratégie pays et catégories.<\/li>\n<li>Négociation avec les principaux fournisseurs.<\/li>\n<li>Relecture des modules 6 et 14.<\/li>\n<\/ul>\n", "todo": [], "quiz": [["Semaine 6 : 3 produits sur 10 se vendent bien. Vous :", ["Rachetez les 10", "Multipliez les lots des 3 gagnants, arrêtez les autres", "Attendez la semaine 13"], 1, "On concentre la trésorerie sur ce qui est validé."], ["Quand activer le guichet OSS ?", ["Avant de dépasser 10 000 € de ventes UE hors France", "Jamais", "Seulement au Royaume-Uni"], 0, "Le seuil déclenche la TVA du pays du client."], ["Combien de temps prend la routine quotidienne ?", ["15 à 30 minutes", "4 heures", "Aucune routine"], 0, "Santé du compte, messages, commandes, prix bloqués."]], "ans": []}, {"id": "annexes", "lvl": "Ressources", "t": "Annexes : modèles, checklists, glossaire", "tag": "Annexes", "min": 15, "lead": "Modèles d'e-mails prêts à envoyer, checklists d'achat, d'envoi et d'ouverture de pays, glossaire et sources.", "html": "<h2 id=\"a-modèles-de-mails\">A. Modèles d'e-mails<\/h2>\n<p><strong>A1 — Premier contact avec un grossiste ou une marque<\/strong><\/p>\n<blockquote>\n<p>Objet : Demande d'ouverture de compte revendeur — [Nom de la SAS]<\/p>\n<p>Bonjour,<\/p>\n<p>Nous sommes [Nom de la SAS], société basée dans le Doubs, spécialisée dans la vente en ligne multicanal en France et en Europe. Nous souhaitons distribuer vos produits [gamme ou références].<\/p>\n<p>Pourriez-vous nous transmettre vos conditions revendeur : liste de prix professionnels, minimum de commande, délais et frais de livraison, conditions de paiement ?<\/p>\n<p>Nous respectons les prix de vente conseillés et l'image de vos marques. Vous trouverez ci-joint notre Kbis. Numéro de TVA : […].<\/p>\n<p>Bien cordialement, [Prénom Nom], [fonction], [téléphone]<\/p>\n<\/blockquote>\n<p><strong>A2 — Relance après 7 jours sans réponse<\/strong><\/p>\n<blockquote>\n<p>Objet : Re : Demande d'ouverture de compte revendeur — [Nom de la SAS]<\/p>\n<p>Bonjour,<\/p>\n<p>Je me permets de revenir vers vous au sujet de notre demande. Pouvez-vous m'indiquer la bonne personne à contacter pour les comptes revendeurs ?<\/p>\n<p>Merci par avance, [Prénom Nom]<\/p>\n<\/blockquote>\n<p><strong>A3 — Proposition à une marque mal présente sur Amazon<\/strong><\/p>\n<blockquote>\n<p>Objet : Développer [Marque] sur Amazon en Europe<\/p>\n<p>Bonjour,<\/p>\n<p>Vos produits […] sont aujourd'hui peu ou mal présents sur Amazon (fiches incomplètes, ruptures, revendeurs non autorisés). Nous proposons de devenir votre revendeur de référence sur Amazon en France, en Allemagne, en Italie et en Espagne : fiches complètes et traduites, stock permanent, respect de vos prix.<\/p>\n<p>Seriez-vous disponible pour un échange de 20 minutes la semaine prochaine ?<\/p>\n<p>Bien cordialement, [Prénom Nom]<\/p>\n<\/blockquote>\n<p><strong>A4 — Réponse à une marque qui dépose une plainte<\/strong><\/p>\n<blockquote>\n<p>Objet : Plainte concernant l'ASIN […] — [Nom de la SAS]<\/p>\n<p>Bonjour,<\/p>\n<p>Nous avons reçu votre réclamation concernant l'ASIN […]. Les produits que nous vendons sont authentiques, achetés auprès de [fournisseur], factures disponibles. Par respect pour votre marque, nous avons retiré notre offre.<\/p>\n<p>Pourriez-vous retirer votre réclamation auprès d'Amazon ? Nous restons ouverts à un partenariat de revente autorisée si vous le souhaitez.<\/p>\n<p>Bien cordialement, [Prénom Nom]<\/p>\n<\/blockquote>\n<p><strong>A5 — Demande d'autorisation écrite de revente sur Amazon<\/strong><\/p>\n<blockquote>\n<p>Objet : Lettre d'autorisation de revente sur Amazon<\/p>\n<p>Bonjour,<\/p>\n<p>Afin de vendre vos produits sur Amazon, la plateforme nous demande un document de votre part autorisant [Nom de la SAS] à revendre vos produits sur Amazon.fr et les sites Amazon européens. Pourriez-vous nous l'adresser sur papier à en-tête, avec vos coordonnées complètes ?<\/p>\n<p>Merci par avance, [Prénom Nom]<\/p>\n<\/blockquote>\n<h2 id=\"b-checklist-avant-dacheter-un-produit\">B. Checklist avant d'acheter un produit<\/h2>\n<ul class=\"task-list\">\n<li><label><input type=\"checkbox\" />Non restreint pour notre compte.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Aucune alerte de plainte de marque, de propriété intellectuelle ou de matière dangereuse.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Catégorie autorisée par nos règles.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Amazon absent ou rarement en stock.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Marge et retour sur l'achat au-dessus des seuils, au prix bas sur 90 jours.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Ventes estimées pour nous d'au moins 20 par mois.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Nombre de vendeurs stable.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Correspondance exacte avec la fiche (lot, couleur, version).<\/label><\/li>\n<li><label><input type=\"checkbox\" />Facture au nom de la SAS possible.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Quantité achetée limitée à 1 à 2 mois de nos ventes estimées.<\/label><\/li>\n<\/ul>\n<h2 id=\"c-checklist-avant-denvoyer-en-fba\">C. Checklist avant d'envoyer en FBA<\/h2>\n<ul class=\"task-list\">\n<li><label><input type=\"checkbox\" />Produits neufs et intacts, sinon classés en occasion.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Une étiquette lisible par unité, anciens codes masqués.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Sachets, film bulle et lots conformes.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Cartons sous les limites de poids et de dimensions.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Une étiquette de carton par carton, sur le dessus.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Photo de chaque carton ouvert puis fermé.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Numéros de suivi saisis.<\/label><\/li>\n<\/ul>\n<h2 id=\"d-checklist-avant-douvrir-un-pays\">D. Checklist avant d'ouvrir un pays<\/h2>\n<ul class=\"task-list\">\n<li><label><input type=\"checkbox\" />Marge calculée avec la TVA locale et le surcoût EFN.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Prix par pays défini.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Fiche disponible dans la langue, titre et avertissements relus.<\/label><\/li>\n<li><label><input type=\"checkbox\" />REP du pays réglée.<\/label><\/li>\n<li><label><input type=\"checkbox\" />Seuil OSS surveillé.<\/label><\/li>\n<\/ul>\n<h2 id=\"e-glossaire\">E. Glossaire<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Terme<\/th>\n<th>Définition<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>A+<\/td>\n<td>Contenu visuel enrichi des fiches de marques enregistrées<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>ACOS<\/td>\n<td>Dépenses publicitaires divisées par les ventes issues de la publicité<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>ASIN<\/td>\n<td>Identifiant unique d'un produit sur Amazon<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Brand Registry<\/td>\n<td>Programme d'Amazon pour les marques déposées<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>BSR<\/td>\n<td>Classement des ventes d'un produit dans sa catégorie<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Buy Box<\/td>\n<td>Bloc « Ajouter au panier », attribué à un vendeur à la fois<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>DAC7<\/td>\n<td>Directive qui oblige les places de marché à déclarer les ventes des vendeurs<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>EAN<\/td>\n<td>Code-barres à 13 chiffres d'un produit<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>EFN<\/td>\n<td>Réseau européen : vente dans d'autres pays avec le stock en France<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>FBA<\/td>\n<td>Expédié par Amazon<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>FBM<\/td>\n<td>Expédié par le vendeur<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>FDS<\/td>\n<td>Fiche de données de sécurité d'un produit chimique<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>FNSKU<\/td>\n<td>Code-barres Amazon propre à votre stock<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>GPSR<\/td>\n<td>Règlement européen sur la sécurité générale des produits<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>GS1<\/td>\n<td>Organisme qui délivre les codes-barres officiels<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>IDU<\/td>\n<td>Identifiant unique REP délivré via un éco-organisme<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Keepa<\/td>\n<td>Outil d'historique des prix et des ventes sur Amazon<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>LUCID<\/td>\n<td>Registre allemand des emballages<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>ODR<\/td>\n<td>Taux de défauts de commande<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>OSS<\/td>\n<td>Guichet unique de TVA pour les ventes à distance dans l'UE<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Pan-EU<\/td>\n<td>Programme de stockage réparti par Amazon dans plusieurs pays<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>REP<\/td>\n<td>Responsabilité élargie du producteur (financement du recyclage)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>ProfitGo<\/td>\n<td>Outil de scan et d'analyse de rentabilité<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>SKU<\/td>\n<td>Référence interne d'un produit chez le vendeur<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>TACOS<\/td>\n<td>Dépenses publicitaires divisées par les ventes totales<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Ungating<\/td>\n<td>Obtention de l'autorisation de vendre une catégorie ou une marque restreinte<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Vine<\/td>\n<td>Programme d'Amazon qui envoie des produits à des testeurs pour obtenir des avis<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Sources<\/h2><ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.lafabriquedunet.fr/creation-site-ecommerce/articles/pourquoi-vendre-produits-marketplace-cdiscount/\">La Fabrique du Net — coût de la vente sur Amazon.fr, tarifs relevés en octobre 2026<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.sendcloud.com/fr/blog/vendre-sur-amazon/\">Sendcloud — vendre sur Amazon, frais de vente<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://cdn.adelphe.fr/IDENTIFIANT_UNIQUE/ADELPHE_FICHE_REFLEXE_ID_UNIQUE_MARKETPLACE.pdf\">Adelphe — identifiant unique REP et places de marché<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://eprrepresentative.com/fr/faq\">EPR Representative — FAQ REP France et programme d'Amazon<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://donneespersonnelles.fr/gpsr\">Données personnelles — le règlement GPSR<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://sellercentral-europe.amazon.com/seller-forums/discussions/t/b2ad0bb7-66d8-453f-b875-702c3e97892e\">Forum vendeurs Amazon — arbitrage et factures de magasin<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.eurosender.com/fr/business/fret/devis-envoi-palettes\">Eurosender — tarifs d'envoi de palettes<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://hellotax.com/blog/amazon/warehouse/locations/france\">Hellotax — entrepôts Amazon en France<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://sell.amazon.fr/tarifs\">Amazon — Tarification : plans, frais de vente, frais FBA, autres coûts, avantages nouveaux vendeurs<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://m.media-amazon.com/images/G/02/sell/images/261014-FBA-Rate-Card-FR.pdf\">Amazon — Grille tarifaire FBA en vigueur au 2 novembre 2026 (PDF)<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://sell.amazon.fr/tarifs-fba-a-bas-prix\">Amazon — Prix bas FBA<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://sell.amazon.fr/expedie-par-amazon/nouveau-programme-de-selection\">Amazon — Nouveau programme de sélection<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://sell.amazon.fr/expedie-par-amazon/europe\">Amazon — Expédié par Amazon en Europe<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://sell.amazon.fr/expedie-par-amazon/expedie-multicanal\">Amazon — Expédition multicanal<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://sell.amazon.fr/programmes/expedie-par-le-vendeur\">Amazon — Expédié par le vendeur<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://sell.amazon.fr/vendre-sur-internet/guide-d-inscription\">Amazon — Guide d'inscription<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://sell.amazon.fr/programmes/amazon-business\">Amazon — Vendre en B2B avec Amazon Business<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://sell.amazon.fr/publicite\">Amazon — Publicité<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://sell.amazon.fr/brand-registry\">Amazon — Registre des marques<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://sell.amazon.fr/resources/gestion-stocks-commerce-enligne\">Amazon — Gestion des stocks pour le commerce en ligne<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.blogdumoderateur.com/amazon-la-taxe-gafa-payee-vendeurs-francais/\">Blog du Modérateur — Amazon répercute la taxe sur les services numériques<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.journaldugeek.com/2026/10/12/la-taxe-gafam-pourrait-passer-de-3-a-15-4-milliards-pour-renflouer-la-dette-de-la-france/\">Journal du Geek — débat sur le relèvement de la taxe sur les services numériques (octobre 2026)<\/a><\/li>\n<\/ul>\n<p>Références officielles à consulter avant toute décision : page Tarification du site vendeur d'Amazon France, centre d'aide de Seller Central, site de l'administration fiscale pour le guichet OSS, site de l'ADEME pour la REP.<\/p>\n", "todo": [], "quiz": null}];

const KEY="academie-amazon-v2";
let state={done:{},scores:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.done)state=s}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>(isFinite(n)?n:0).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2});

function renderToc(cur){
  const groups={};M.forEach(m=>(groups[m.lvl]=groups[m.lvl]||[]).push(m));
  let h="";
  for(const [lvl,list] of Object.entries(groups)){
    h+=`<div class="lvl">${lvl}</div><ul>`+list.map(m=>`<li><a href="#${m.id}" class="${state.done[m.id]?"done":""}" ${cur===m.id?'aria-current="page"':""}><span class="tick">✓</span>${esc(m.t)}</a></li>`).join("")+`</ul>`;
  }
  h+=`<div class="lvl">Outil</div><ul><li><a href="#calc" class="tool-link" ${cur==="calc"?'aria-current="page"':""}><span class="tick"></span>Calculateur de rentabilité</a></li></ul>`;
  document.getElementById("tocBody").innerHTML=h;
  const n=M.filter(m=>state.done[m.id]).length;
  document.getElementById("progTxt").textContent=`${n} / ${M.filter(x=>x.quiz).length} modules`;
  document.getElementById("progBar").style.width=(n/M.filter(x=>x.quiz).length*100)+"%";
  const c=M.find(m=>m.id===cur);document.getElementById("tocCur").textContent=c?c.t:(cur==="calc"?"Calculateur de rentabilité":"");
}

function renderLesson(m){
  const i=M.indexOf(m),prev=M[i-1],next=M[i+1];
  const v=document.getElementById("view");
  v.innerHTML=`<article class="lesson">
    <div class="meta"><span class="tag">${m.lvl}</span><span class="tag time">${m.tag} · ${m.min} min</span></div>
    <h1 class="lt">${esc(m.t)}</h1>${m.lead?`<p class="lead">${m.lead}</p>`:""}${m.html}
    ${m.todo.length?`<div class="todo"><h2>À faire</h2><ul>${m.todo.map(t=>`<li>${t}</li>`).join("")}</ul></div>`:""}
    ${m.quiz?`<section class="quiz" aria-labelledby="qz"><h2 id="qz">Quiz de validation</h2><p class="fb">Répondez juste à 2 questions sur 3 pour valider le module.</p>

  <h2>Comparaison des 9 pays</h2>
  <p class="hint2">Même prix TTC partout, stock en France (EFN pour l'étranger en FBA). Ajustez le prix par pays dans la vente réelle.</p>
  <div class="cmpwrap"><table class="cmp"><thead><tr><th>Pays</th><th>Prix HT</th><th>Frais Amazon</th><th>Marge</th><th>Retour</th><th>Verdict</th></tr></thead><tbody id="c-cmp"></tbody></table></div>
  <p class="hint2">Sources : page Tarification d'Amazon.fr et grille tarifaire FBA du 2 novembre 2026. Les tarifs de haute saison (15 octobre – 14 janvier) ne sont pas inclus. Vérifiez toujours un produit avec le calculateur de revenus de Seller Central avant un gros achat.</p>
  <div class="pager"><a href="#m6">← Économie d'un produit</a><a href="#m15">Plan d'action 90 jours →</a></div></article>`;
  const ids=["type","cat","pays","vente","achat","achatMode","tvaa","remise","L","W","H","g","jours","saison","transp","prep","fbm","fbmx","emb","pub","prov","minm","fuel","dst","lpmax","ventes","vendeurs"];
  const g=id=>document.getElementById("c-"+id);
  const TXT=["type","pays","achatMode","cat","saison"];
  ids.forEach(id=>{g(id).value=TXT.includes(id)?c[id]:String(c[id]).replace(".",",")});["hz","app","lp"].forEach(id=>{g(id).checked=!!c[id]});
  const segs=[...document.querySelectorAll(".seg button")];
  const setMode=m=>{c.mode=m;segs.forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.mode===m)))};
  setMode(c.mode);
  const L=(a,b,cls)=>`<div class="line${cls?" "+cls:""}"><span>${a}</span><span>${b}</span></div>`;
  const run=()=>{
    ids.forEach(id=>{const v=g(id).value;c[id]=(["type","pays","achatMode"].includes(id))?v:num(v)});
    ["hz","app","lp"].forEach(id=>{c[id]=g(id).checked});
    saveC(c);
    const ct=CAT[c.cat];
    g("cathint").textContent=ct[1]==="flat"?`${Math.round(ct[2]*100)} %`:ct[1]==="whole"?`${Math.round(ct[3]*100)} % jusqu'à ${ct[2]} €, ${Math.round(ct[4]*100)} % au-dessus`:ct[1]==="split"?`${Math.round(ct[3]*100)} % jusqu'à ${ct[2]} €, ${Math.round(ct[4]*100)} % sur la part au-dessus`:"5 % ≤ 15 €, 10 % de 15 à 20 €, 15 % au-dessus";
    const r=compute(c,c.pays,c.vente), T=r.T;
    g("tier").innerHTML=c.mode==="FBA"?`<b>${T.t.n}</b> · poids d'expédition ${fmt(T.w/1000)} kg${T.kind!=="env"?` (volumétrique ${fmt(T.dimW/1000)} kg)`:""}<br>Frais FBA ${c.pays==="FR"?"France":"EFN depuis la France"} : <b>${isFinite(r.shipInfo.fee)?fmt(r.shipInfo.fee)+" €":"—"}</b>${r.shipInfo.lp?' <span class="pill">prix bas FBA</span>':""}${r.shipInfo.lpWhy?`<br><span class="muted">Prix bas FBA non applicable : ${r.shipInfo.lpWhy}. Conditions : 20 € TTC maximum (12 € dans certaines catégories), et au plus 100 g (petite enveloppe), 460 g (enveloppe standard), 960 g (grande et très grande enveloppe) ou 400 g (petit colis).</span>`:""}${r.shipInfo.note?`<br><span class="warn">${r.shipInfo.note}</span>`:""}`:`Expédition par vos soins : ${fmt(c.pays==="FR"?c.fbm:c.fbmx)} € + emballage ${fmt(c.emb)} €`;
    const [vc,vt,vw]=verdictOf(c,r);
    g("out").innerHTML=
      L(`Prix de vente HT (${TVA[c.pays][0]})`,fmt(r.ht)+" €")+
      L(`Achat HT${c.remise?` (−${c.remise} %)`:""}`,"−"+fmt(r.ach)+" €")+
      L("Commission Amazon","−"+fmt(r.com)+" €")+
      L(c.mode==="FBA"?`Expédition FBA${c.fuel?` (+${c.fuel} % carburant)`:""}${c.hz?" + lithium":""}`:"Expédition et emballage","−"+(isFinite(r.ship)?fmt(r.ship):"?")+" €")+
      (c.mode==="FBA"?L(`Stockage (${c.jours} j)`,"−"+fmt(r.sto)+" €")+L("Transport et préparation","−"+fmt(r.extra)+" €"):"")+
      (r.dst?L(`Taxe numérique (${c.dst} %)`,"−"+fmt(r.dst)+" €"):"")+
      (r.prov?L(`Provision retours (${c.prov} %)`,"−"+fmt(r.prov)+" €"):"")+
      (r.pub?L("Publicité","−"+fmt(r.pub)+" €"):"")+
      `<div class="line total"><span>Marge nette</span><span>${isFinite(r.marge)?fmt(r.marge)+" €":"—"}</span></div>
      <div class="kpis"><div class="kpi"><b>${Math.round(r.roi*100)} %</b><small>Retour sur l'achat</small></div><div class="kpi"><b>${Math.round(r.taux*100)} %</b><small>Taux de marge</small></div>
      <div class="kpi"><b>${Math.round(r.feesAmz/c.vente*100)} %</b><small>Frais Amazon / prix TTC</small></div><div class="kpi"><b>${fmt(r.marge*100)} €</b><small>Pour 100 unités</small></div></div>
      <div class="verdict ${vc}">${vt}<span>${vw}</span></div>`;
    const p0=floorPrice(c,c.pays,0),pm=floorPrice(c,c.pays,c.type==="panne"?5:c.minm);
    g("floor").innerHTML=L("Prix minimum sans perte",isFinite(p0)?fmt(p0)+" € TTC":"—")+L(`Prix pour ${fmt(c.type==="panne"?5:c.minm)} € de marge`,isFinite(pm)?fmt(pm)+" € TTC":"—")+
      `<p class="hint2">À saisir comme prix minimum dans l'ajustement automatique des prix (module 9.2).</p>`;
    const mine=c.ventes/((c.vendeurs||0)+1), lotMin=Math.ceil(mine), lotMax=Math.ceil(mine*1.5);
    g("proj").innerHTML=L("Vos ventes estimées",`${fmt(mine).replace(",00","")} / mois`)+L("Bénéfice mensuel estimé",fmt(mine*r.marge)+" €")+
      L("Lot conseillé (1 à 1,5 mois)",`${lotMin} à ${lotMax} unités`)+L("Capital pour ce lot",`${fmt(lotMin*r.ach)} à ${fmt(lotMax*r.ach)} € HT`);
    g("cmp").innerHTML=Object.keys(TVA).map(k=>{const x=compute(c,k,c.vente),[vv]=verdictOf(c,x);
      return `<tr${k===c.pays?' class="cur"':""}><td>${TVA[k][0]}${x.shipInfo.est?" *":""}</td><td>${fmt(x.ht)} €</td><td>${isFinite(x.feesAmz)?fmt(x.feesAmz)+" €":"—"}</td><td><b>${isFinite(x.marge)?fmt(x.marge)+" €":"—"}</b></td><td>${Math.round(x.roi*100)} %</td><td><span class="dot ${vv}"></span></td></tr>`}).join("");
  };
  ids.forEach(id=>g(id).addEventListener("input",run));["hz","app","lp"].forEach(id=>g(id).addEventListener("change",run));
  g("type").addEventListener("change",()=>{g("prov").value=g("type").value==="panne"?8:0;run()});
  segs.forEach(b=>b.addEventListener("click",()=>{setMode(b.dataset.mode);run()}));
  run();
}

function route(){
  const id=(location.hash||"#intro").slice(1);
  const m=M.find(x=>x.id===id);
  renderToc(m?m.id:id);
  if(id==="calc")renderCalc();else renderLesson(m||M[0]);
  if(window.matchMedia("(max-width:900px)").matches)document.getElementById("tocDetails").open=false;
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
</script>

<button id="tts-btn" type="button" aria-label="Écouter le texte en français">🔊 Écouter</button>
<style>#tts-btn{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;padding:10px 14px;border-radius:999px;border:0;background:var(--navy);color:var(--paper);font:600 .95rem system-ui,sans-serif;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}#tts-btn:focus-visible{outline:3px solid var(--navy);outline-offset:3px}</style>
<script>(function(){const b=document.getElementById("tts-btn");if(!("speechSynthesis" in window)){b.hidden=true;return}
let voice=null;const pick=()=>{const v=speechSynthesis.getVoices().filter(x=>/^fr/i.test(x.lang));voice=v.find(x=>/Google/i.test(x.name))||v.find(x=>/natural|online|neural/i.test(x.name))||v.find(x=>x.lang==="fr-FR")||v[0]||null};pick();speechSynthesis.onvoiceschanged=pick;
const chunks=t=>t.replace(/\s+/g," ").match(/[^.!?;:]{1,220}[.!?;:]?/g)||[];
b.addEventListener("click",()=>{if(speechSynthesis.speaking){speechSynthesis.cancel();b.textContent="🔊 Écouter";return}
const sel=String(window.getSelection()||"").trim();const L=[...document.querySelectorAll(".lesson")].find(e=>e.offsetParent);const txt=sel||(L?L.innerText:"");if(!txt)return;
if(!voice){pick();if(!voice){b.textContent="Aucune voix française installée";setTimeout(()=>b.textContent="🔊 Écouter",4000);return}}
const parts=chunks(txt);parts.forEach((c,i)=>{const u=new SpeechSynthesisUtterance(c);u.lang="fr-FR";u.voice=voice;u.rate=1;if(i===parts.length-1)u.onend=()=>{b.textContent="🔊 Écouter"};speechSynthesis.speak(u)});b.textContent="⏹ Arrêter"})})();</script>
<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
